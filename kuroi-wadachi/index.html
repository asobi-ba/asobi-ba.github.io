    function bandOf(z){
      for (var b = 0; b < bands.length; b++) if (z >= bands[b].low - 35) return bands[b];
      return bands.length ? bands[bands.length - 1] : null;
    }

    // 轍：見える範囲のものだけ。どの帯に入るかを奥行きで決めておく
    for (k = 0; vp.marks && k < marks.length; k++){
      var mk = marks[k];
      var mdx = mk.x1 - cam.x, mdy = mk.y1 - cam.y;
      var mfw = mdx*cam.fx + mdy*cam.fy;
      if (mfw < 4 || mfw > 560) continue;                                     // 背中側・遠すぎ
      if (Math.abs(mdx*cam.rx + mdy*cam.ry) > mfw * vp.wide + 30) continue;   // 見える角度の外
      if (mfw > 240 && (k & 2)) continue;                                      // 遠いものは間引く
      var hh = (mk.h !== undefined ? mk.h : 0) + 0.4;
      var ddx = mk.x2 - mk.x1, ddy = mk.y2 - mk.y1, dl = Math.hypot(ddx, ddy);
      if (dl < 0.01) continue;
      var px = -ddy / dl * 3, py = ddx / dl * 3;
      var q4 = [toC(cam, mk.x1 - px, mk.y1 - py, hh), toC(cam, mk.x2 - px, mk.y2 - py, hh),
                toC(cam, mk.x2 + px, mk.y2 + py, hh), toC(cam, mk.x1 + px, mk.y1 + py, hh)];
      var bm = bandOf(q4[0].Z);
      if (bm) bm.marks.push(q4);
    }
    // 前照灯が路面を照らす光（自分の車と、物語の相手）。これも帯に振り分ける
    if (vp.marks) {                       // ルームミラーには描かない（後ろ向きなので見えず、重いだけ）
      var Ls = lightCone(cam, car);
      if (story && riv) Ls = Ls.concat(lightCone(cam, riv));
      for (k = 0; k < Ls.length; k++){ var bl = bandOf(Ls[k].z); if (bl) bl.lights.push(Ls[k]); }
    }

    // 車と煙。奥行き（カメラから見た前後）で並べ、帯と帯のあいだに差し込んで描く
    var items = [];
    if (story && riv) items.push({ c: riv, col: riv.col.body, a: 1 });
    if (vp.self) items.push({ c: car, col: myCol(), a: 1 });   // 外からの視点では自分の車も
    {
      var gc = ghostNow();
      if (gc){
        ghost = gc.arr;
        var gp = ghostPose(time);
        if (gp){
          var gi = Math.min(gc.arr.length/4 - 1, Math.floor(time / GH_DT));
          items.push({ c: { x:gp.x, y:gp.y, ang:gp.ang, idx: gc.arr[gi*4+3] }, col: gc.col.body, a: 0.38 });
        }
      }
    }
    for (k = 0; k < items.length; k++){
      var ic = items[k].c, ih = TRACK[Math.max(0, Math.min(TRACK.length-1, ic.idx || 0))].h;
      items[k].z = toC(cam, ic.x, ic.y, ih + 6).Z;
    }
    // タイヤの煙：上からの視点と同じ粒を、立体の中では「ぼかした丸い絵」を置くだけで描く（軽い）
    if (vp.marks) {
      var sstep = smoke.length > 36 ? 2 : 1;            // 粒が多いときは1つおきにして、塗る量を抑える
      for (k = 0; k < smoke.length; k += sstep){
        var sm = smoke[k];
        if (sm.h === undefined || Math.hypot(sm.x - cam.x, sm.y - cam.y) > 480) continue;
        items.push({ smoke: sm, z: toC(cam, sm.x, sm.y, sm.h + 6).Z });
      }
    }
    items.sort(function(a, b){ return b.z - a.z; });
    var ii = 0;
    function drawItemsBeyond(z){
      while (ii < items.length && items[ii].z > z){
        var it = items[ii++];
        if (it.smoke) puff(cam, vp, it.smoke); else car3(cam, vp, it.c, it.col, it.a);
      }
    }

    var WO = HALF + WALL, EO = HALF + 2.5, j, ft, ti2, sL, sR, gL, gR;
    for (var bi = 0; bi < bands.length; bi++){
      var band = bands[bi];
      drawItemsBeyond(band.top + 20);       // この帯より奥にいる車を先に
      var each = function(fn){
        for (var q = 0; q < band.s.length; q++){
          j = band.s[q][1]; ti2 = i0 + j;
          ft = Math.round(Math.max(0, band.s[q][0]) / FOG.dist * 24) / 24;   // 色の数を減らしてまとめ塗りを効かせる
          // 隣の道（ヘアピンの折り返し先）と重ならない幅に抑える
          var T0 = TRACK[ti2];
          // ガードレールは、車体が壁ぎわまで寄っても突き抜けて見えない所（壁の線＋車幅の半分）に立てる
          sL = Math.max(EO + 1, Math.min(WO + 14, T0.roomL - HALF - 2)); sR = Math.max(EO + 1, Math.min(WO + 14, T0.roomR - HALF - 2));
          gL = Math.min(WO + 300, T0.roomL - HALF - 4); gR = Math.min(WO + 300, T0.roomR - HALF - 4);
          fn();
        }
      };
      var B = batch(vp);
      each(function(){   // 地面：路肩の外へ広がり、外ほど少し下がる（道が宙に浮いて見えないように）
        var c = fogC(RGB_GROUND, ft);
        if (gL > sL) bAdd(B, [off(j,-gL,-14), offN(j,-gL,-14), offN(j,-sL), off(j,-sL)], c);
        if (gR > sR) bAdd(B, [off(j,sR), offN(j,sR), offN(j,gR,-14), off(j,gR,-14)], c);
      });
      bFlush(B, false); B = batch(vp);
      each(function(){   // 路肩（土）：白線の外側だけ
        var c = fogC(RGB_WALL, ft);
        bAdd(B, [off(j,-sL), offN(j,-sL), offN(j,-HALF), off(j,-HALF)], c);
        bAdd(B, [off(j,HALF), offN(j,HALF), offN(j,sR), off(j,sR)], c);
      });
      bFlush(B, false); B = batch(vp);
      each(function(){   // 白線：路面の外側の細い帯だけ
        var c = fogC(RGB_EDGE, ft);
        bAdd(B, [off(j,-EO), offN(j,-EO), offN(j,-HALF+0.5), off(j,-HALF+0.5)], c);
        bAdd(B, [off(j,HALF-0.5), offN(j,HALF-0.5), offN(j,EO), off(j,EO)], c);
      });
      bFlush(B, false); B = batch(vp);
      var B2 = batch(vp);
      each(function(){   // 路面（上から見たときの坂の色づけと同じく、下りは水色・上りは橙を薄く混ぜる）
        var gg = TRACK[ti2].g, rr = weather === 'rain' ? RGB_WET : RGB_ROAD;
        var tint = Math.round(Math.min(0.13, Math.abs(gg) * 0.75) * 50) / 50;
        var rc = gg >= 0 ? [rr[0] + (95-rr[0])*tint, rr[1] + (211-rr[1])*tint, rr[2] + (224-rr[2])*tint]
                         : [rr[0] + (240-rr[0])*tint, rr[1] + (135-rr[1])*tint, rr[2] + (58-rr[2])*tint];
        bAdd(B, [off(j,-HALF+0.5), offN(j,-HALF+0.5), offN(j,HALF-0.5), off(j,HALF-0.5)], fogC(rc, ft));
        // 中央の破線（コース上の距離で決めるので、走っても模様がずれない）
        if (Math.round(TRACK[ti2].d / STEP) % 4 < 2)
          bAdd(B2, [off(j,-1), off(j+1,-1), off(j+1,1), off(j,1)], fogC(RGB_CEN, ft));
        // スタートとゴールの線
        if (ti2 === 0 || ti2 === TRACK.length - 2)
          bAdd(B2, [off(j,-HALF), off(j+1,-HALF), off(j+1,HALF), off(j,HALF)], ti2 === 0 ? 'rgba(232,228,216,0.75)' : 'rgba(95,211,224,0.8)');
      });
      bFlush(B, false); bFlush(B2, false);
      // この帯の轍と、前照灯の光
      if (band.marks.length) {
        var BM = batch(vp);
        for (k = 0; k < band.marks.length; k++) bAdd(BM, band.marks[k], 'rgba(0,0,0,0.42)');
        bFlush(BM, false);
      }
      if (band.lights.length) {
        ctx.globalCompositeOperation = 'lighter';
        for (k = 0; k < band.lights.length; k++) polyC(vp, band.lights[k].pts, band.lights[k].col);
        ctx.globalCompositeOperation = 'source-over';
      }
      B = batch(vp);
      each(function(){   // ガードレール（路肩の外の端。低い板）は立っているので帯の最後に
        var rc2 = fogC(RGB_RAIL, Math.min(1, ft + 0.2));
        bAdd(B, [off(j,-sL), offN(j,-sL), offN(j,-sL,8), off(j,-sL,8)], rc2);
        bAdd(B, [off(j,sR), offN(j,sR), offN(j,sR,8), off(j,sR,8)], rc2);
      });
      bFlush(B, false);
    }
    drawItemsBeyond(-1e9);                   // 残り（いちばん手前）の車と煙
  }

// 運転席の目の位置（車の中心から 前 f・右 r。右ハンドルなので右の座席）
  var EYE_F = -4, EYE_R = 7;
  function drawCab(){
    var fx = Math.sin(car.ang), fy = -Math.cos(car.ang);
    var rx = Math.cos(car.ang), ry = Math.sin(car.ang);
    var base = TRACK[idx] ? TRACK[idx].h : 0;
    var ez = base + EYE;
    var ex = car.x + fx*EYE_F + rx*EYE_R, ey = car.y + fy*EYE_F + ry*EYE_R;
    var F = (W/2) / Math.tan(CAB_FOV/2);
    var cam = makeCam(ex, ey, ez, cabYaw, cabPitch);
    var vp = { x:0, y:0, w:W, h:H, cx:W/2, hor:H*0.42, F:F, flip:false, wide:(W/2)/F, marks:true };
    ctx.save();
    scene(cam, vp);
    ctx.restore();
    cockpit(cam, vp, base);

    // ルームミラー（後ろ。ライバルが迫ってくるのが見える）
    var mw = 92, mh = 30, mx = W/2 - mw/2, my = 24;
    ctx.save();
    ctx.beginPath(); ctx.rect(mx, my, mw, mh); ctx.clip();
    var Fm = (mw/2) / Math.tan(0.55);
    scene(makeCam(car.x, car.y, ez + 2, car.ang + Math.PI, -0.05), { x:mx, y:my, w:mw, h:mh, cx:W/2, hor:my + mh*0.55, F:Fm, flip:true, wide:(mw/2)/Fm, marks:false, back:80, ahead:10 });
    ctx.restore();
    ctx.strokeStyle = '#1A1C22'; ctx.lineWidth = 3;
    ctx.strokeRect(mx - 1, my - 1, mw + 2, mh + 2);

    // 壁やライバルに当たった瞬間は、画面を薄く赤く
    if (hitT > 0){ ctx.fillStyle = 'rgba(224,69,58,' + Math.min(0.25, hitT*0.5).toFixed(2) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  // 車内を3次元で組む（車体に付いているので、視線がどちらを向いても正しい位置に見える。
  // 真横を向けば横の窓・ドア・中の柱が見える）。座標は車の中心から 前 f・右 r・路面からの高さ z。
  // 車体の大きさ：全長62（±31）・全幅31（±15.5）。
  function cockpit(cam, vp, base){
    var fx = Math.sin(car.ang), fy = -Math.cos(car.ang), rx = Math.cos(car.ang), ry = Math.sin(car.ang);
    var g = TRACK[idx] ? TRACK[idx].g : 0;
    function P(f, r, z){
      // 坂では車体も前後に傾く（下りは前が下がる）
      return toC(cam, car.x + fx*f + rx*r, car.y + fy*f + ry*r, base + z - f*g);
    }
    var body = myCol();
    var parts = [];
    function add(pts, fill){
      var zs = 0;
      for (var i = 0; i < pts.length; i++) zs += pts[i].Z;
      parts.push({ pts: pts, fill: fill, z: zs / pts.length });
    }
    var WF = 12, WT = 3;          // 窓の下端（前）と上端（屋根のふち）の前後位置
    // ボンネット：左右の泥よけが少し高く、まんなかが低い
    add([P(WF,-15.5,10.9), P(WF,-9,10.9), P(30.5,-9,8.6), P(30.5,-15,8.8)], shade(body, -0.02));
    add([P(WF,-9,10.9), P(WF,9,10.9), P(30.5,9,8.3), P(30.5,-9,8.3)], shade(body, -0.16));
    add([P(WF,9,10.9), P(WF,15.5,10.9), P(30.5,15,8.8), P(30.5,9,8.6)], shade(body, -0.02));
    // ダッシュボード（上の面と、運転手に向いた面）
    add([P(6,-15,9.6), P(6,15,9.6), P(WF,15,10.2), P(WF,-15,10.2)], '#16171D');
    add([P(6,-15,0), P(6,15,0), P(6,15,9.6), P(6,-15,9.6)], '#0E0F13');
    // 床（足もと）
    add([P(6.2,-15.5,0.5), P(6.2,15.5,0.5), P(-26,15.5,0.5), P(-26,-15.5,0.5)], '#0A0B0E');
    // ドア（窓の下）。上のふちを少し明るく
    add([P(WF,-15.5,0), P(-26,-15.5,0), P(-26,-15.5,11), P(WF,-15.5,11)], '#14151A');
    add([P(WF,15.5,0), P(-26,15.5,0), P(-26,15.5,11), P(WF,15.5,11)], '#14151A');
    add([P(WF,-15.5,10.4), P(-26,-15.5,10.4), P(-26,-15,11.2), P(WF,-15,11.2)], '#2C2E36');
    add([P(WF,15.5,10.4), P(-26,15.5,10.4), P(-26,15,11.2), P(WF,15,11.2)], '#2C2E36');
    // 屋根（内張り）。低い屋根
    add([P(WT,-12.5,19), P(WT,12.5,19), P(-26,12.5,19), P(-26,-12.5,19)], '#0E0F13');
    // 屋根のふち（窓の上の帯）
    add([P(WT+0.5,-12.5,18.2), P(WT+0.5,12.5,18.2), P(WT,12.5,19.2), P(WT,-12.5,19.2)], '#1B1C22');
    // ピラー（前の柱。強く寝かせてある）と、中の柱（真横を向くと見える）
    function pillar(s){
      add([P(WF, s*15.4, 10.8), P(WF-2.6, s*15.2, 10.8), P(WT-1.8, s*12.4, 19), P(WT, s*12.6, 19)], '#101116');
      add([P(-12, s*15.3, 11), P(-15.5, s*15.3, 11), P(-15.5, s*12.8, 19), P(-12, s*12.8, 19)], '#101116');
    }
    pillar(-1); pillar(1);
    // 遠い順に塗る
    parts.sort(function(a, b){ return b.z - a.z; });
    for (var k = 0; k < parts.length; k++) polyC(vp, parts[k].pts, parts[k].fill, true);

    // ハンドル（運転手の正面。切っているぶん回る。右へ切ると時計回り）
    var cf = 3, cr = EYE_R, cz = 10.5, R = 2.7, tilt = 0.45;   // 半径 約19cm、目から 約50cm 前
    var rot = -steerV * 1.9, i;
    function WP(a, rr){   // 輪の上の点（a: 角度 0=右 π/2=上、rr: 中心からの距離）
      var u = Math.cos(a + rot) * rr, v = Math.sin(a + rot) * rr;
      return P(cf - v*Math.sin(tilt), cr + u, cz + v*Math.cos(tilt));
    }
    function line3(a1, b1, wd, col){
      if (a1.Z < CAB_NEAR || b1.Z < CAB_NEAR) return;
      ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, wd * vp.F / ((a1.Z + b1.Z) / 2));
      ctx.beginPath();
      ctx.moveTo(vp.cx + a1.X*vp.F/a1.Z, vp.hor - a1.Y*vp.F/a1.Z);
      ctx.lineTo(vp.cx + b1.X*vp.F/b1.Z, vp.hor - b1.Y*vp.F/b1.Z);
      ctx.stroke();
    }
    ctx.lineCap = 'round';
    for (i = 0; i < 28; i++) line3(WP(i/28*Math.PI*2, R), WP((i+1)/28*Math.PI*2, R), 0.45, '#24262E');
    line3(WP(Math.PI, R), WP(0, 0), 0.35, '#24262E');        // 横のスポーク
    line3(WP(0, 0), WP(0, R), 0.35, '#24262E');
    line3(WP(Math.PI/2, R), WP(Math.PI/2, R - 0.5), 0.22, '#F0873A');   // 真上の印
    ctx.lineCap = 'butt';
  }

  function drawGate(s, color){
    var x = s.x - camX, y = s.y - camY;
    if (x < -80 || x > W+80 || y < -80 || y > H+80) return;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(s.a);
    ctx.fillStyle = color;
    for (var i=-HALF;i<HALF;i+=11) ctx.fillRect(i, -3, 5.5, 6);
    ctx.restore();
  }

  function drawCar(){
    var blink = hitT > 0 && Math.floor(hitT*20) % 2 === 0;
    ctx.save();
    ctx.translate(car.x - camX, car.y - camY);
    ctx.rotate(car.ang);

    // 前照灯の光
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = COL.lamp;
    ctx.beginPath();
    ctx.moveTo(-9, -26); ctx.lineTo(-48, -196); ctx.lineTo(48, -196); ctx.lineTo(9, -26);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;

    drawCarNew(ctx, myCol() === COL.body ? COL : { body: myCol(), lampCore: COL.lampCore }, steerV, sliding, lastSlip, blink, false);
    if (COL.body === '#3A3A42' && !blink) {
      ctx.strokeStyle = 'rgba(200,205,220,0.35)'; ctx.lineWidth = 1.2;
      bodyPath(ctx, 0, 0); ctx.stroke();
    }
    ctx.restore();
  }

// 真上から見たドリフト車。全長62・全幅31。前は -Y 方向。
// タイヤは張り出した泥よけの下に収め、端だけ見せる（実車の見え方）。
// 前輪の、絵の上での最大の切れ角（ラジアン。0.8 ≒ 46度。ドリフトのカウンターが見えるよう大きめ）
var WLOCK = 0.8;
function drawCarNew(ctx, COL, steerV, sliding, slip, blink, brakeOn){
  if (blink) return;
  var st = Math.max(-1, Math.min(1, steerV));
  var sa = st * WLOCK;

  // ---- タイヤ（車体の下。泥よけからわずかに覗く） ----
  function wheel(x, y, rot, wide, long, smear){
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    if (smear > 0){
      ctx.globalAlpha = 0.28; ctx.fillStyle = '#07080B';
      rr(ctx, -wide/2 - smear, -long/2, wide + smear*2, long, 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = '#0B0C10';
    rr(ctx, -wide/2, -long/2, wide, long, 1.6); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';                 // 溝
    ctx.fillRect(-wide/2 + 1.4, -long/2 + 1.0, 0.9, long - 2.0);
    ctx.fillRect( wide/2 - 2.3, -long/2 + 1.0, 0.9, long - 2.0);
    ctx.fillStyle = 'rgba(206,202,190,0.12)';           // 肩の照り
    ctx.fillRect(-wide/2 + 0.5, -long/2 + 1.4, wide - 1.0, 0.9);
    ctx.restore();
  }
  var sm = sliding ? 0.8 + slip * 1.5 : 0;
  // 泥よけを控えめにしたので、タイヤも内側へ（外の縁が車体の縁から少しだけ覗く）
  wheel(-11.0, -18.5, sa, 6.2, 13.0, sm * 0.5);
  wheel( 11.0, -18.5, sa, 6.2, 13.0, sm * 0.5);
  wheel(-11.2,  18.5, 0,  7.0, 13.6, sm);
  wheel( 11.2,  18.5, 0,  7.0, 13.6, sm);

  // ---- 影 ----
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  bodyPath(ctx, 1.8, 3.0); ctx.fill();

  // ---- 車体 ----
  var grd = ctx.createLinearGradient(-15, 0, 15, 0);
  grd.addColorStop(0,    shade(COL.body, -0.50));
  grd.addColorStop(0.16, shade(COL.body, -0.16));
  grd.addColorStop(0.34, shade(COL.body,  0.30));   // 縦に走る照り
  grd.addColorStop(0.46, COL.body);
  grd.addColorStop(0.78, shade(COL.body, -0.22));
  grd.addColorStop(1,    shade(COL.body, -0.54));
  ctx.fillStyle = grd;
  bodyPath(ctx, 0, 0); ctx.fill();

  ctx.save(); bodyPath(ctx, 0, 0); ctx.clip();

  // 泥よけの張り出し：車体の輪郭に沿って内側へ弧を描く線と、その外側のうっすらした影
  function fender(sx, y0, ym, y1, xin, xmid){
    ctx.beginPath();
    ctx.moveTo(sx*xin, y0); ctx.quadraticCurveTo(sx*xmid, ym, sx*xin, y1);
    ctx.lineTo(sx*16, y1); ctx.lineTo(sx*16, y0); ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx*xin, y0); ctx.quadraticCurveTo(sx*xmid, ym, sx*xin, y1);
    ctx.strokeStyle = 'rgba(0,0,0,0.34)'; ctx.lineWidth = 0.8; ctx.stroke();
  }
  fender(-1, -26.0, -18.5, -11.0, 12.0, 10.4);
  fender( 1, -26.0, -18.5, -11.0, 12.0, 10.4);
  fender(-1,  11.0,  18.5,  26.5, 12.4, 10.6);
  fender( 1,  11.0,  18.5,  26.5, 12.4, 10.6);
  // 横に走る細い帯
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  ctx.fillRect(-13.0, -3.0, 2.2, 12.0);
  ctx.fillRect( 10.8, -3.0, 2.2, 12.0);
  ctx.restore();

  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1.1;
  bodyPath(ctx, 0, 0); ctx.stroke();

  // ---- 前の下ばり ----
  ctx.fillStyle = '#14161C';
  rr(ctx, -12.4, -32.2, 24.8, 3.0, 1.2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  rr(ctx, -12.4, -32.2, 24.8, 1.0, 0.8); ctx.fill();
  // 開口部
  ctx.fillStyle = '#0D0F14';
  rr(ctx, -6.0, -30.4, 12.0, 2.6, 1); ctx.fill();

  // ---- 長いボンネット ----
  ctx.strokeStyle = 'rgba(0,0,0,0.34)'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(-9.6, -28.0); ctx.lineTo(-9.2, -12.0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 9.6, -28.0); ctx.lineTo( 9.2, -12.0); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.58)';
  for (var v = 0; v < 3; v++){
    var vy = -23.0 + v * 2.3;
    rr(ctx, -7.0, vy, 5.6, 1.3, 0.6); ctx.fill();
    rr(ctx,  1.4, vy, 5.6, 1.3, 0.6); ctx.fill();
  }

  // ---- 窓と屋根 ----
  var glass = '#0A0C11';
  ctx.fillStyle = glass;
  ctx.beginPath();                                    // 前窓
  ctx.moveTo(-7.0, -11.0); ctx.lineTo(7.0, -11.0);
  ctx.lineTo(9.4, -2.0); ctx.lineTo(-9.4, -2.0); ctx.closePath(); ctx.fill();
  var rg = ctx.createLinearGradient(-9, 0, 9, 0);
  rg.addColorStop(0, shade(COL.body, -0.24));
  rg.addColorStop(0.36, shade(COL.body, 0.34));
  rg.addColorStop(1, shade(COL.body, -0.30));
  ctx.fillStyle = rg;                                 // 屋根
  rr(ctx, -8.4, -2.0, 16.8, 8.6, 1.4); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.42)';                 // 柱
  ctx.fillRect(-9.0, -2.4, 1.6, 9.4);
  ctx.fillRect( 7.4, -2.4, 1.6, 9.4);
  ctx.fillStyle = glass;                              // 後窓
  ctx.beginPath();
  ctx.moveTo(-8.6, 6.6); ctx.lineTo(8.6, 6.6);
  ctx.lineTo(6.8, 13.4); ctx.lineTo(-6.8, 13.4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.13)';           // 前窓の映り込み
  ctx.beginPath();
  ctx.moveTo(-6.8, -10.8); ctx.lineTo(-1.4, -10.8);
  ctx.lineTo(-4.6, -2.2); ctx.lineTo(-9.2, -2.2); ctx.closePath(); ctx.fill();

  // ---- 側面の帯・ドアミラー ----
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(-11.6, -1.6, 1.4, 8.0);
  ctx.fillRect( 10.2, -1.6, 1.4, 8.0);
  ctx.fillStyle = shade(COL.body, -0.40);
  rr(ctx, -14.6, -12.4, 2.8, 2.2, 0.9); ctx.fill();
  rr(ctx,  11.8, -12.4, 2.8, 2.2, 0.9); ctx.fill();

  // ---- 後ろの羽（純正くらいの小さなもの。荷室のふたの後ろの端） ----
  ctx.fillStyle = 'rgba(0,0,0,0.40)';                 // 羽の下の影
  rr(ctx, -11.2, 24.8, 22.4, 2.4, 1.0); ctx.fill();
  var wg = ctx.createLinearGradient(0, 23.8, 0, 26.0);
  wg.addColorStop(0, shade(COL.body, 0.06));
  wg.addColorStop(1, shade(COL.body, -0.36));
  ctx.fillStyle = wg;
  rr(ctx, -11.2, 23.8, 22.4, 2.2, 1.0); ctx.fill();

  // ---- 前照灯 ----
  ctx.fillStyle = COL.lampCore;
  rr(ctx, -9.4, -30.0, 5.8, 2.8, 1.1); ctx.fill();
  rr(ctx,  3.6, -30.0, 5.8, 2.8, 1.1); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  rr(ctx, -9.4, -30.0, 5.8, 1.1, 0.7); ctx.fill();
  rr(ctx,  3.6, -30.0, 5.8, 1.1, 0.7); ctx.fill();

  // ---- 尾灯 ----
  var hot = brakeOn || sliding;
  if (hot){
    ctx.globalAlpha = 0.32; ctx.fillStyle = '#FF3B2E';
    rr(ctx, -12.0, 26.2, 9.8, 4.6, 1.8); ctx.fill();
    rr(ctx,   2.2, 26.2, 9.8, 4.6, 1.8); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = hot ? '#FF6A5C' : '#A02821';
  rr(ctx, -11.0, 27.0, 7.8, 2.8, 1); ctx.fill();
  rr(ctx,   3.2, 27.0, 7.8, 2.8, 1); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(-1.8, 27.0, 3.6, 2.8);
  ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = 0.9;   // 荷室のふた
  ctx.beginPath(); ctx.moveTo(-9.0, 25.6); ctx.lineTo(9.0, 25.6); ctx.stroke();

  // ---- 上の縁の照り返し ----
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(-6.0, -31.0); ctx.lineTo(6.0, -31.0); ctx.stroke();
}

function bodyPath(ctx, dx, dy){
  ctx.beginPath();
  ctx.moveTo(dx +  -6.2, dy + -31.2);
  ctx.lineTo(dx + -11.4, dy + -28.6);
  // 泥よけの張り出しは控えめ（立体の車と同じ輪郭）
  ctx.quadraticCurveTo(dx + -13.7, dy + -25.6, dx + -13.6, dy + -18.5);  // 前の張り出し
  ctx.quadraticCurveTo(dx + -12.5, dy +  -5.0, dx + -12.6, dy +   8.0);  // 胴を絞る
  ctx.quadraticCurveTo(dx + -14.1, dy +  13.0, dx + -14.0, dy +  21.0);  // 後ろの張り出し
  ctx.lineTo(dx + -13.4, dy +  25.5);
  ctx.lineTo(dx + -11.2, dy +  30.0);
  ctx.lineTo(dx +  11.2, dy +  30.0);
  ctx.lineTo(dx +  13.4, dy +  25.5);
  ctx.lineTo(dx +  14.0, dy +  21.0);
  ctx.quadraticCurveTo(dx +  14.1, dy +  13.0, dx +  12.6, dy +   8.0);
  ctx.quadraticCurveTo(dx +  12.5, dy +  -5.0, dx +  13.6, dy + -18.5);
  ctx.quadraticCurveTo(dx +  13.7, dy + -25.6, dx +  11.4, dy + -28.6);
  ctx.closePath();
}

function rr(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function shade(hex, k){
  var n = parseInt(hex.slice(1), 16);
  var r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  if (k >= 0){ r += (255-r)*k; g += (255-g)*k; b += (255-b)*k; }
  else { r *= (1+k); g *= (1+k); b *= (1+k); }
  return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
}

  // ---------- 表示 ----------
  var prev = {};
  function syncDash(){
    var t = (st === 'play' || st === 'pause' || st === 'done' || st === 'replay') ? time : 0;
    var ts = fmt(t);
    if (prev.t !== ts) { vTime.textContent = ts; prev.t = ts; }
    var bs = best ? fmt(best) : '--';
    if (prev.b !== bs) { vBest.textContent = bs; prev.b = bs; }
    var ds = (score + Math.round(pending*mult)).toLocaleString('ja-JP');
    if (prev.d !== ds) { vDrift.textContent = ds; prev.d = ds; }
    var pg = Math.round(idx / Math.max(1, TRACK.length-1) * 100);
    if (prev.p !== pg) { progBar.style.width = pg + '%'; prev.p = pg; }
    if (prev.sl !== sliding) {
      dash.classList.toggle('sliding', sliding);
      glow.classList.toggle('on', sliding);
      prev.sl = sliding;
    }
    if (st === 'count') {
      var n = Math.ceil(countT - 0.2);
      var txt = n > 0 ? String(n) : 'GO';
      if (prev.c !== txt) {
        countN.textContent = txt;
        countEl.classList.toggle('go', txt === 'GO');
        countN.style.animation = 'none'; void countN.offsetHeight; countN.style.animation = '';
        prev.c = txt;
      }
    }
  }

  // ---------- まわす ----------
  var lastT = 0, acc = 0;
  function frame(now){
    requestAnimationFrame(frame);
    if (!lastT) { lastT = now; return; }
    var dt = Math.min(0.05, (now - lastT)/1000);
    lastT = now;
    if (window.WADACHI_AUDIO) WADACHI_AUDIO.tick(st === 'replay' ? 'play' : st, sliding, lastSlip, lastSp);
    if (st !== 'pause') {
      acc += dt;
      var g = 0;
      while (acc >= 1/60 && g < 6) { step(1/60); acc -= 1/60; g++; }
      if (g >= 6) acc = 0;
      draw();
    }
    syncDash();
  }

  function boot(saved){
    wiped = resetIfOldRules();
    loadBest();
    loadStory();
    loadMyCol();
    loadOpts();
    syncWx();
    try { var v0 = localStorage.getItem('wadachi.view'); if (v0 === 'cab' || v0 === 'chase') view = v0; } catch(e){}
    syncView();
    syncGh();
    if (saved && saved.best && (!best || saved.best < best)) { best = saved.best; saveBest(); }
    layout();
    setCourse(0);
    syncDash();
    requestAnimationFrame(frame);
  }
  try {
    var hot = window.claude && window.claude.hot;
    if (hot && hot.snapshot) hot.snapshot(function(){ return { best: best }; });
    if (hot && hot.ready) hot.ready(boot);
    else boot((hot && hot.data) || {});
  } catch(e){ boot({}); }
})();
</script>

<script>
// ===== スマホの全画面 =====
// iPhone の Safari は、動画以外の全画面に対応していない。その場合はボタンを出さず、
// 「ホーム画面に追加」から開けば上下のバーが消える（公開サイト側で手当てしてある）。
(function(){
  var el = document.documentElement;
  var btn = document.getElementById('fsBtn');
  if (!btn) return;
  var req = el.requestFullscreen || el.webkitRequestFullscreen;
  var exi = document.exitFullscreen || document.webkitExitFullscreen;
  if (!req) return;                       // 対応していない端末ではボタンを出さない
  btn.classList.add('on');

  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function sync(){
    var on = isFs();
    el.classList.toggle('fs', on);
    btn.textContent = on ? '×' : '全';
    btn.title = on ? '全画面をやめる' : '全画面';
    btn.setAttribute('aria-label', btn.title);
    // 作品側に大きさを測り直させる
    setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 60);
    setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 360);
  }
  btn.addEventListener('click', function(e){
    e.preventDefault();
    try{
      if (isFs()) { if (exi) exi.call(document); }
      else { req.call(el, { navigationUI:'hide' }); }
    }catch(err){}
  });
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  sync();
})();
</script>
