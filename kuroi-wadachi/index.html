    ghBtn.classList.toggle('top', ghostMode === 2);
    ghBtn.setAttribute('aria-pressed', ghostMode !== 0 ? 'true' : 'false');
    ghBtn.title = ['ゴーストを出さない', '自己ベストと並走', '順位表1位と勝負'][ghostMode];
  }
  function toggleGh(){
    ghostMode = (ghostMode + 1) % 3;
    try { localStorage.setItem('wadachi.ghostMode', String(ghostMode)); } catch(e){}
    syncGh();
    if (st === 'title' || st === 'done') showTitle2();
  }
  if (ghBtn) ghBtn.addEventListener('click', toggleGh);

  var volSl = document.getElementById('volSl');
  if (volSl && window.WADACHI_AUDIO){
    volSl.value = Math.round(WADACHI_AUDIO.getVol() * 100);
    volSl.addEventListener('input', function(){ WADACHI_AUDIO.setVol(volSl.value / 100); });
  }
  goBtn.addEventListener('click', goAction);

  // ---------- そうさ（左右だけ） ----------
  var keys = {}, touchDir = 0;
  window.addEventListener('keydown', function(e){
    var k = e.key;
    if (k === ' ' || k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') e.preventDefault();
    keys[k] = true;
    // ボタンにフォーカスがあるときの Enter はボタン側の click で動く（二重に進めない）
    var onBtn = e.target && e.target.tagName === 'BUTTON';
    if (k === ' ' || (k === 'Enter' && !onBtn)) {
      if (st === 'title' || st === 'done' || st === 'pause') goAction();
    }
    if (k === 'p' || k === 'P') { if (st === 'play') setPause(true); else if (st === 'pause') setPause(false); }
    if (k === 'g' || k === 'G') toggleGh();
  });
  window.addEventListener('keyup', function(e){ keys[e.key] = false; });
  window.addEventListener('blur', function(){ keys = {}; touchDir = 0; });

  function touchAt(e){
    var r = cv.getBoundingClientRect();
    touchDir = ((e.clientX - r.left) / r.width < 0.5) ? -1 : 1;
  }
  cv.addEventListener('pointerdown', function(e){
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    touchAt(e);
  });
  cv.addEventListener('pointermove', function(e){ if (e.buttons) touchAt(e); });
  cv.addEventListener('pointerup', function(){ touchDir = 0; });
  cv.addEventListener('pointercancel', function(){ touchDir = 0; });
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  function steerDir(){
    var d = 0;
    if (keys['ArrowLeft']  || keys['a'] || keys['A']) d -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) d += 1;
    if (d === 0) d = touchDir;
    return d;
  }

  function bank(){
    if (pending > 0) score += Math.round(pending * mult);
    pending = 0; mult = 1; driftT = 0;
  }

  // ---------- 1コマ ----------
  function step(dt){
    if (st === 'count') {
      countT -= dt;
      if (window.WADACHI_AUDIO) WADACHI_AUDIO.count(Math.max(0, Math.ceil(countT - 0.2)));
      if (countT <= 0) { st = 'play'; countEl.classList.add('off'); }
      return;
    }
    if (st !== 'play') return;

    time += dt;

    car.steerV = steerV; car.holdT = holdT; car.idx = idx; car.hitT = hitT; car.stuckT = stuckT;
    drive(car, steerDir(), dt);
    steerV = car.steerV; holdT = car.holdT; idx = car.idx; hitT = car.hitT; stuckT = car.stuckT;
    if (story && riv) stepRival(dt);
    var fx = Math.sin(car.ang), fy = -Math.cos(car.ang);
    var rx = Math.cos(car.ang), ry = Math.sin(car.ang);
    var lat = car.lat, fwd = car.fwd, onRoad = car.onRoad;

    if (car.wall) {
      if (window.WADACHI_AUDIO) WADACHI_AUDIO.hitWall();
      pending = 0; mult = 1; driftT = 0;
      for (var i=0;i<8;i++) smoke.push({ x:car.x, y:car.y, r:4+Math.random()*7, life:1 });
    }

    // 滑り具合
    var sp = Math.hypot(car.vx, car.vy);
    lastSp = sp;
    var slip = Math.abs(Math.atan2(lat, Math.max(18, fwd)));
    lastSlip = slip;
    sliding = (slip > 0.18 && sp > 80 && onRoad);

    if (sliding) {
      driftT += dt; idleT = 0;
      mult = Math.min(8, 1 + Math.floor(driftT / 1.5));
      pending += slip * sp * dt * 1.6;
    } else {
      idleT += dt;
      if (pending > 0 && idleT > 0.4) bank();
    }

    // 轍と煙
    // 新しい車の後輪の位置（左右13.8・後ろ18）に合わせる
    var wl = { x: car.x - rx*13.8 - fx*18, y: car.y - ry*13.8 - fy*18 };
    var wr = { x: car.x + rx*13.8 - fx*18, y: car.y + ry*13.8 - fy*18 };
    if (Math.abs(lat) > 34) {
      if (lastWheels) {
        marks.push({ x1:lastWheels.l.x, y1:lastWheels.l.y, x2:wl.x, y2:wl.y });
        marks.push({ x1:lastWheels.r.x, y1:lastWheels.r.y, x2:wr.x, y2:wr.y });
        while (marks.length > 1400) marks.shift();
      }
      if (Math.random() < dt*30) smoke.push({ x:(wl.x+wr.x)/2, y:(wl.y+wr.y)/2, r:3+Math.random()*5, life:1 });
      lastWheels = { l:wl, r:wr };
    } else lastWheels = null;

    for (var s=smoke.length-1;s>=0;s--){
      var sm = smoke[s];
      sm.r += 20*dt; sm.life -= dt*1.2;
      if (sm.life <= 0) smoke.splice(s,1);
    }

    checkGate();

    // ゴーストのために位置を控える（0.05秒ごと）
    while (rec.length / 4 * GH_DT <= time && rec.length < 4 * 4000) {
      rec.push(Math.round(car.x*10)/10, Math.round(car.y*10)/10,
               Math.round(car.ang*1000)/1000, idx);
    }

    // ゴール（関門を全部くぐっているか確認する）
    if (idx >= TRACK.length - 3) finish(GATES.length - nextGate);

    // 画面の追従（速度のぶんだけ先を見る）
    var tx = car.x + car.vx*0.42 - W/2;
    var ty = car.y + car.vy*0.42 - H/2;
    var k = Math.min(1, 6.5*dt);
    camX += (tx - camX) * k;
    camY += (ty - camY) * k;
  }

  // ---------- 車を1コマ動かす（自分の車もライバルの車も、この同じ式で走る）----------
  // c: 車（x,y,ang,vx,vy と steerV,holdT,idx,hitT,stuckT を持つ）、d: ハンドル -1/0/1
  // 結果として c.lat, c.fwd, c.onRoad, c.wall（このコマで壁に当たったか）を残す。
  function drive(c, d, dt){
    var sp = Math.hypot(c.vx, c.vy);
    // 切り続けるほど後ろが出る。戻すと素早く収まる
    if (d !== 0) c.holdT = Math.min(1, c.holdT + dt*1.7); else c.holdT = Math.max(0, c.holdT - dt*2.8);
    // ハンドルは一気にではなく、押している長さに応じて切れていく
    var rate = (d === 0 || d * c.steerV < 0) ? STEERDN : STEERUP;
    c.steerV += (d - c.steerV) * Math.min(1, rate * dt);
    c.ang += c.steerV * TURN * Math.max(0.32, Math.min(1, sp/70)) * dt;  // 止まっていても向きは変えられる

    var fx = Math.sin(c.ang), fy = -Math.cos(c.ang);
    var rx = Math.cos(c.ang), ry = Math.sin(c.ang);
    var fwd = c.vx*fx + c.vy*fy;
    var lat = c.vx*rx + c.vy*ry;

    // コース上のどこにいるか
    c.idx = nearest(c.x, c.y, c.idx);
    var sN = TRACK[c.idx];
    var offv = (c.x - sN.x)*sN.nx + (c.y - sN.y)*sN.ny;   // 中心からの横ずれ
    var off = Math.abs(offv) - HALF;
    var onRoad = off < 0;

    // 前へ
    // 角度をつけている間は駆動が前へ出る（パワーをかけたドリフト）。
    // 山で最大になり、そこを越えると急に効かなくなるので、振りすぎても得しない。
    var la1 = Math.abs(lat);
    var drv = la1 <= PEAK ? la1 / PEAK
                          : Math.max(0, (PEAK * 1.5 - la1) / (PEAK * 0.5));
    // c.pow：ライバルの運転手がアクセルをどこまで踏むか（1＝床まで）。自分の車は持たない＝1
    fwd += ACCEL * (c.pow || 1) * (1 + DRIVE * drv) * dt;
    // 坂：下りは押され、上りは抑えられる
    fwd += GRAV * sN.g * dt;
    fwd -= fwd * (onRoad ? 0.16 : 1.1) * dt;
    // c.top：ライバルの運転手が出す速さの上限（怖がって踏み切れない分）。自分の車は持たない＝MAXS
    var top = c.top || MAXS;
    if (fwd > top) fwd = top;
    // 滑ったぶんの減速＝これが唯一の減速。
    // 前向きの速度からだけ引くと、真横を向いた（前向きが0の）ときに減速が
    // 効かなくなり、勢いを保ったまま向きだけ戻って かえって速くなる。
    // 前向きで引ききれないぶんは、横向きの勢いから削る。
    var la0 = Math.abs(lat);
    var loss = (la0 <= PEAK ? la0 * SCRUB * SCRUBMILD
                            : PEAK * SCRUB * SCRUBMILD + (la0 - PEAK) * SCRUB * SCRUBHARD) * dt;
    var take = Math.min(Math.max(0, fwd), loss);
    fwd -= take;
    // 90度を超えて流れると、前向きの速度はマイナス（車が進行方向と逆を向いている）。
    // このときエンジンは進行方向に対して逆向きに押すので、加速ではなく減速になる。
    // ここを 0 で止めるとその減速が丸ごと消え、90度で張り付いて振り回すほど速くなる。
    if (fwd < -BACKMAX) fwd = -BACKMAX;
    var rest = loss - take;
    if (rest > 0){
      var cut = Math.min(Math.abs(lat), rest);
      lat -= (lat > 0 ? cut : -cut);
    }

    // 横のグリップ
    // タイヤの踏ん張りは PEAK でいちばん強く、そこを越えると落ちていく。
    // 横速度に比例させ続けると、大きく振るほど強く引き戻されて速くなってしまう。
    var fast = 1 - SPEEDSLIP * Math.min(1, sp / MAXS);
    // 荷重：頂上では抜けて滑りやすく、谷では沈んで 食いつく
    var load = Math.max(0.60, Math.min(1.40, 1 - CREST * sN.dg));
    var grip = GRIP * fast * (1 - HOLD*c.holdT) * (onRoad ? 1 : 0.5) * load;
    var la = Math.abs(lat);
    var curve = la <= PEAK ? la : Math.max(PEAK * TAIL, PEAK * PEAK / la);
    var dLat = Math.min(la, grip * curve * dt);
    lat -= (lat > 0 ? dLat : -dLat);

    c.vx = fx*fwd + rx*lat;
    c.vy = fy*fwd + ry*lat;
    // 前向きの成分だけを頭打ちにすると、車が回ったときに前向きへ空きができて
    // そこへ推進が継ぎ足される。回すたびに繰り返されるので、振り回すほど
    // 全体の速さが増えてしまう（実測で最高速の106%まで出ていた）。
    // 全体の速さで頭打ちにする。まっすぐ走ったときの最高速は変わらない。
    var tot = Math.hypot(c.vx, c.vy);
    if (tot > top){ var kk = top / tot; c.vx *= kk; c.vy *= kk; }
    c.x += c.vx * dt;
    c.y += c.vy * dt;

    // 壁
    c.wall = false;
    if (off > WALL) {
      var sgn = offv > 0 ? 1 : -1;
      // 壁の内側へ少し戻す（ちょうどの位置に置くと張り付く）
      c.x = sN.x + sN.nx * sgn * (HALF + WALL - 7);
      c.y = sN.y + sN.ny * sgn * (HALF + WALL - 7);
      // 壁へ向かう成分だけ消す。前へ進む成分は残すので、壁ぞいに流れて復帰できる
      var vn = c.vx*sN.nx + c.vy*sN.ny;
      if (vn * sgn > 0) { c.vx -= sN.nx * vn; c.vy -= sN.ny * vn; }
      c.vx *= 0.72; c.vy *= 0.72;
      c.hitT = 0.35;
      c.wall = true;
    }
    if (c.hitT > 0) c.hitT -= dt;

    // どうにも動けなくなったら、コースの中心へ戻して立て直す
    if (Math.hypot(c.vx, c.vy) < 16) c.stuckT += dt; else c.stuckT = 0;
    if (c.stuckT > 1.1) {
      c.stuckT = 0;
      c.x = sN.x; c.y = sN.y; c.ang = sN.a;
      c.vx = Math.sin(sN.a)*55; c.vy = -Math.cos(sN.a)*55;
      c.hitT = 0.5;
    }
    c.lat = lat; c.fwd = fwd; c.onRoad = onRoad;
  }

  // ---------- ライバルの運転手（コンピュータ）----------
  // 人と同じく左右のハンドルだけ。少し先のコース上の点を狙い、曲がる側へ寄せた点に向けて切る。
  // この先がきつく曲がっていて速すぎるときは、早めに向きを入れて滑らせ、速度を落とす
  // （ブレーキが無いので、人と同じくこれが唯一の減速）。
  // P: l0,lk 見る先 / ik,cw 寄せ方 / th 切り始め / sv,v0 先のきつさと出してよい速さ / g,ma 向きの入れ方
  function wrapA(a){ while (a > Math.PI) a -= Math.PI*2; while (a < -Math.PI) a += Math.PI*2; return a; }
  function botSteer(c, P){
    var sp = Math.hypot(c.vx, c.vy);
    var j = Math.min(TRACK.length-1, c.idx + Math.max(2, Math.round((P.l0 + sp*P.lk) / STEP)));
    var a = Math.max(0, j - P.cw), b = Math.min(TRACK.length-1, j + P.cw);
    var off = Math.max(-1, Math.min(1, wrapA(TRACK[b].a - TRACK[a].a) * P.ik)) * 40;
    var tp = TRACK[j];
    var err = wrapA(Math.atan2(tp.x + tp.nx*off - c.x, -(tp.y + tp.ny*off - c.y)) - c.ang);
    var e = Math.min(TRACK.length-1, c.idx + P.sv);
    var turn = wrapA(TRACK[e].a - TRACK[c.idx].a);
    var vs = P.v0 / (0.3 + Math.abs(turn));
    if (sp > vs && Math.abs(turn) > 0.25) err += (turn > 0 ? 1 : -1) * Math.min(P.ma, (sp - vs) * P.g);
    return err > P.th ? 1 : err < -P.th ? -1 : 0;
  }

  // ライバルを1コマ動かし、ぶつかっていれば押し合う
  function stepRival(dt){
    var r = riv;
    if (!rivFin) {
      drive(r, botSteer(r, CH().P), dt);
      if (r.idx >= TRACK.length - 3) rivFin = time;
    } else {
      // ゴールしたら惰性で流して止まる（コースの先には道が無いので、ハンドルは切らない）
      var kd = Math.max(0, 1 - 1.6*dt);
      r.vx *= kd; r.vy *= kd; r.x += r.vx*dt; r.y += r.vy*dt;
      r.lat = 0;
    }
    // 差の表示用に、各点を通ったタイムを控える
    for (var i = r.seen + 1; i <= r.idx; i++) rivAt[i] = time;
    if (r.idx > r.seen) r.seen = r.idx;
    for (var j = r.mySeen + 1; j <= idx; j++) myAt[j] = time;
    if (idx > r.mySeen) r.mySeen = idx;

    // ライバルの轍と煙
    var fx = Math.sin(r.ang), fy = -Math.cos(r.ang), rx = Math.cos(r.ang), ry = Math.sin(r.ang);
    if (Math.abs(r.lat) > 34) {
      var wl = { x: r.x - rx*13.8 - fx*18, y: r.y - ry*13.8 - fy*18 };
      var wr = { x: r.x + rx*13.8 - fx*18, y: r.y + ry*13.8 - fy*18 };
      if (rivWheels) {
        marks.push({ x1:rivWheels.l.x, y1:rivWheels.l.y, x2:wl.x, y2:wl.y });
        marks.push({ x1:rivWheels.r.x, y1:rivWheels.r.y, x2:wr.x, y2:wr.y });
        while (marks.length > 1400) marks.shift();
      }
      if (Math.random() < dt*30) smoke.push({ x:(wl.x+wr.x)/2, y:(wl.y+wr.y)/2, r:3+Math.random()*5, life:1 });
      rivWheels = { l:wl, r:wr };
    } else rivWheels = null;

    if (bumpT > 0) bumpT -= dt;
    var hit = collide(car, r);
    if (hit > 25 && bumpT <= 0) {
      bumpT = 0.25;
      if (window.WADACHI_AUDIO) WADACHI_AUDIO.hitWall();
      for (var s = 0; s < 4; s++) smoke.push({ x:(car.x+r.x)/2, y:(car.y+r.y)/2, r:3+Math.random()*5, life:1 });
    }
  }

  // 2台の当たり。車体を前後2つの円で近似する（全長62・全幅31 に合わせて 前後±14・半径15.5）。
  // 重なったぶんを半分ずつ押し戻し、押し合う向きの速さを分け合う（同じ重さ）。
  // 車体の端に当たると向きも少し回る。戻り値は当たりの強さ（音を鳴らすかの目安）。
  var CR = 15.5, CO = 14, BOUNCE = 0.35, SPIN = 0.0004;
  function collide(a, b){
    var best = 0;
    for (var ia = -1; ia <= 1; ia += 2){
      for (var ib = -1; ib <= 1; ib += 2){
        var ax = a.x + Math.sin(a.ang)*CO*ia, ay = a.y - Math.cos(a.ang)*CO*ia;
        var bx = b.x + Math.sin(b.ang)*CO*ib, by = b.y - Math.cos(b.ang)*CO*ib;
        var dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
        if (d >= CR*2 || d < 0.001) continue;
        var nx = dx / d, ny = dy / d, ov = (CR*2 - d) / 2;
        a.x -= nx*ov; a.y -= ny*ov; b.x += nx*ov; b.y += ny*ov;
        var vr = (b.vx - a.vx)*nx + (b.vy - a.vy)*ny;   // 近づく速さ（マイナス＝近づいている）
        if (vr >= 0) continue;
        var jm = -(1 + BOUNCE) * vr / 2;
        a.vx -= nx*jm; a.vy -= ny*jm; b.vx += nx*jm; b.vy += ny*jm;
        // 当たった円の位置（車の中心から）× 受けた力 で回す
        var rax = ax - a.x, ray = ay - a.y, rbx = bx - b.x, rby = by - b.y;
        a.ang += SPIN * (rax*(-ny*jm) - ray*(-nx*jm));
        b.ang += SPIN * (rbx*( ny*jm) - rby*( nx*jm));
        if (jm > best) best = jm;
      }
    }
    return best * 2;
  }

  // ---------- 絵 ----------
  function visibleRuns(){
    var cx = camX + W/2, cy = camY + H/2, lim = (W+H)/2 + 140;
    var runs = [], cur = null;
    for (var i=0;i<TRACK.length;i++){
      var s = TRACK[i];
      if (Math.abs(s.x-cx) < lim && Math.abs(s.y-cy) < lim) {
        if (!cur) { cur = []; runs.push(cur); }
        cur.push(s);
      } else cur = null;
    }
    return runs;
  }

  function strokeRuns(runs, width, color, dash){
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
    for (var r=0;r<runs.length;r++){
      var run = runs[r];
      if (run.length < 2) continue;
      // 破線は道の始点からの距離に合わせる（画面が動いても模様がずれない）
      ctx.lineDashOffset = dash ? run[0].d : 0;   // 符号に注意。マイナスだと逆に2倍ずれる
      ctx.beginPath();
      ctx.moveTo(run[0].x - camX, run[0].y - camY);
      for (var i=1;i<run.length;i++) ctx.lineTo(run[i].x - camX, run[i].y - camY);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // 路面に薄く色を重ねて坂を見せる。
  // 塗り分けの境目は「コース上の走行距離」で決める。画面に映っている範囲の
  // 先頭を基準にすると、カメラが動くたびに境目がずれて模様が路面を這って見える。
  var TINTN = 3;        // 何刻みで塗り分けるか（7×3＝21ごと）
  function tintStart(run){
    for (var i = 0; i < run.length; i++){
      if (Math.round(run[i].d / STEP) % TINTN === 0) return i;
    }
    return run.length;
  }
  function hillTint(runs){
    ctx.lineWidth = HALF*2; ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
    for (var r = 0; r < runs.length; r++){
      var run = runs[r];
      for (var i = tintStart(run); i + TINTN < run.length; i += TINTN){
        var g0 = (run[i].g + run[i+TINTN].g) / 2;
        var al = Math.min(0.13, Math.abs(g0) * 0.75);
        if (al < 0.012) continue;        // ほぼ平らなところは塗らない（塗っても見えない）
        ctx.strokeStyle = (g0 >= 0 ? 'rgba(95,211,224,' : 'rgba(240,135,58,') + al.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(run[i].x - camX, run[i].y - camY);
        for (var k = 1; k <= TINTN; k++){
          ctx.lineTo(run[i+k].x - camX, run[i+k].y - camY);
        }
        ctx.stroke();
      }
    }
    ctx.lineCap = 'round';
  }

  function draw(){
    ctx.fillStyle = COL.ground;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = COL.groundDot;
    for (var g=0; g<44; g++){
      var gx = (((g*137) % 400) - camX*0.35) % 400, gy = (((g*211) % 400) - camY*0.35) % 400;
      gx = ((gx % 400)+400)%400; gy = ((gy % 400)+400)%400;
      if (gx < W && gy < H) ctx.fillRect(gx, gy, 2, 2);
    }

    var runs = visibleRuns();
    strokeRuns(runs, (HALF+WALL)*2, COL.wall);       // 路肩
    strokeRuns(runs, HALF*2 + 5, COL.edge);          // 白線
    strokeRuns(runs, HALF*2, COL.road);              // 路面
    hillTint(runs);                                  // 坂の色づけ

    // 轍
    if (marks.length) {
      ctx.strokeStyle = COL.mark; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath();
      for (var m=0;m<marks.length;m++){
        var mk = marks[m];
        var sx = mk.x1 - camX, sy = mk.y1 - camY;
        if (sx < -50 || sx > W+50 || sy < -50 || sy > H+50) continue;
        ctx.moveTo(sx, sy); ctx.lineTo(mk.x2 - camX, mk.y2 - camY);
      }
      ctx.stroke();
    }

    strokeRuns(runs, 2, COL.center, [12,16]);        // 中央線

    // スタート／ゴール
    drawGate(TRACK[0], '#E8E4D8');
    drawGate(TRACK[TRACK.length-1], '#5FD3E0');

    // 煙
    for (var s=0;s<smoke.length;s++){
      var sm = smoke[s];
      ctx.globalAlpha = Math.max(0, sm.life) * 0.5;
      ctx.fillStyle = COL.smoke;
      ctx.beginPath(); ctx.arc(sm.x - camX, sm.y - camY, sm.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawGhost();
    drawRival();
    drawCar();
    drawGhostGap();
    drawRivalGap();
    drawSpeed();
    drawProfile();
  }

  function showTitle2(){
    var e = veilBody.getElementsByClassName('gh')[0];
    if (e) e.textContent = ghostLine();
  }
  function ghostLine(){
    var tail = '　（画面下の GHOST／G キーで 切→自己→1位）';
    if (ghostMode === 0) return 'ゴースト：切' + tail;
    if (ghostMode === 2) {
      var t = topG[courseIdx];
      if (!t) return 'ゴースト：1位と勝負 — まだ誰も記録を出していません' + tail;
      return 'ゴースト：1位と勝負　' + t.name + '　' + fmt(t.score) + tail;
    }
    if (!ghosts[courseIdx]) return 'ゴースト：自己ベスト — まだ記録なし（1本 完走すると記録されます）' + tail;
    return 'ゴースト：自己ベスト　' + fmt(ghostT[courseIdx]) + tail;
  }

  // コースの断面図。左下に小さく出し、いまの位置に点を打つ。
  // 路面を塗ると、画面が動くたびに模様がずれて這っているように見えるのでやめた。
  function drawProfile(){
    if (st === 'title' || !PROFILE || !PROFILE.length) return;
    var x0 = 10, y0 = H - 34, w = 96, h = 24, i;
    ctx.save();
    ctx.fillStyle = 'rgba(11,12,16,0.55)';
    ctx.fillRect(x0 - 4, y0 - 4, w + 8, h + 8);
    // 山の形
    ctx.beginPath();
    ctx.moveTo(x0, y0 + h);
    for (i = 0; i < PROFILE.length; i++){
      ctx.lineTo(x0 + w * i / (PROFILE.length - 1), y0 + h - PROFILE[i] * h);
    }
    ctx.lineTo(x0 + w, y0 + h);
    ctx.closePath();
    ctx.fillStyle = 'rgba(95,211,224,0.16)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(95,211,224,0.55)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // いまの位置
    var u = Math.max(0, Math.min(1, idx / Math.max(1, TRACK.length - 1)));
    var pi = u * (PROFILE.length - 1);
    var lo2 = Math.floor(pi), hi2 = Math.min(PROFILE.length - 1, lo2 + 1);
    var hh = PROFILE[lo2] + (PROFILE[hi2] - PROFILE[lo2]) * (pi - lo2);
    var px = x0 + w * u, py = y0 + h - hh * h;
    ctx.strokeStyle = 'rgba(232,228,216,0.30)';
    ctx.beginPath(); ctx.moveTo(px, y0); ctx.lineTo(px, y0 + h); ctx.stroke();
    ctx.fillStyle = '#F0873A';
    ctx.beginPath(); ctx.arc(px, py, 2.6, 0, 7); ctx.fill();
    ctx.restore();
  }

  // 速さは画面の右下に出す（盤の外より、走っている画の中のほうが見やすい）
  function drawSpeed(){
    if (st === 'title') return;
    var kmh = Math.round(Math.hypot(car.vx, car.vy) * 0.62);
    ctx.save();
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(11,12,16,0.55)';
    ctx.fillRect(W - 74, H - 46, 68, 40);
    ctx.fillStyle = 'rgba(232,228,216,0.50)';
    ctx.font = 'bold 9px Oxanium, monospace';
    ctx.fillText('KM/H', W - 12, H - 33);
    // 勾配（下りは＋・水色／上りは－・橙）
    var gr = TRACK[idx] ? TRACK[idx].g : 0;
    var pc = Math.round(gr * 100);
    ctx.fillStyle = 'rgba(11,12,16,0.55)';
    ctx.fillRect(W - 74, H - 70, 68, 21);
    ctx.fillStyle = pc >= 0 ? '#5FD3E0' : '#F0873A';
    ctx.font = 'bold 13px Oxanium, monospace';
    ctx.fillText((pc >= 0 ? '▼ ' : '▲ ') + Math.abs(pc) + '%', W - 12, H - 55);
    ctx.fillStyle = sliding ? '#FFC27A' : '#E8E4D8';
    ctx.font = 'bold 24px Oxanium, monospace';
    ctx.fillText(String(kmh), W - 12, H - 12);
    ctx.restore();
  }

  // ライバルの車。画面の外にいるときは、いる方向の画面のふちに印を出す
  function drawRival(){
    if (!story || !riv) return;
    var r = riv, x = r.x - camX, y = r.y - camY;
    if (x < -40 || x > W+40 || y < -40 || y > H+40) {
      if (st !== 'play') return;
      var cx = W/2, cy = H/2, dx = x - cx, dy = y - cy;
      var k = Math.min((W/2 - 12) / Math.max(1e-6, Math.abs(dx)), (H/2 - 12) / Math.max(1e-6, Math.abs(dy)));
      var ex = cx + dx*k, ey = cy + dy*k, an = Math.atan2(dy, dx);
      ctx.save();
      ctx.translate(ex, ey); ctx.rotate(an);
      ctx.fillStyle = r.col.body; ctx.strokeStyle = '#E8E4D8'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-6, -6); ctx.lineTo(-6, 6); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
      return;
    }
    var slipR = Math.abs(Math.atan2(r.lat || 0, Math.max(18, r.fwd || 0)));
    var blink = r.hitT > 0 && Math.floor(r.hitT*20) % 2 === 0;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(r.ang);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = COL.lamp;
    ctx.beginPath();
    ctx.moveTo(-9, -26); ctx.lineTo(-48, -196); ctx.lineTo(48, -196); ctx.lineTo(9, -26);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    drawCarNew(ctx, r.col, r.steerV, slipR > 0.18, slipR, blink, false);
    // 黒い車は夜の路面に溶けるので、ふちを薄く光らせる
    if (CH().boss && !blink) {
      ctx.strokeStyle = 'rgba(200,205,220,0.35)'; ctx.lineWidth = 1.2;
      bodyPath(ctx, 0, 0); ctx.stroke();
    }
    ctx.restore();
  }

  // ライバルとの差（秒）。マイナス＝自分が前
  function drawRivalGap(){
    if (!story || !riv || st !== 'play') return;
    var d = null;
    if (riv.idx > idx && rivAt[idx] !== undefined) d = time - rivAt[idx];
    else if (idx > riv.idx && myAt[riv.idx] !== undefined) d = -(time - myAt[riv.idx]);
    else d = 0;
    var txt = rivFin ? '相手がゴール' : (d > 0 ? '+' : d < 0 ? '-' : '±') + Math.abs(d).toFixed(2);
    ctx.save();
    ctx.font = 'bold 11px Oxanium, "Zen Kaku Gothic New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(11,12,16,0.62)';
    var w = rivFin ? 84 : 58;
    ctx.fillRect(W/2 - w/2, 5, w, 15);
    ctx.fillStyle = rivFin || d > 0 ? '#E0453A' : '#8CF0AE';
    ctx.fillText(txt, W/2, 16);
    ctx.restore();
  }

  function drawGhost(){
    if (st !== 'play' || story) return;
    var c = curGhost();
    if (!c) return;
    ghost = c.arr;
    var g = ghostPose(time);
    if (!g) return;
    var x = g.x - camX, y = g.y - camY;
    if (x < -60 || x > W+60 || y < -60 || y > H+60) return;
    ctx.save();
    ctx.globalAlpha = 0.34;
    ctx.translate(x, y);
    ctx.rotate(g.ang);
    drawCarNew(ctx, c.col, 0, false, 0, false, false);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 手本との差。マイナスなら自分が前に出ている
  function drawGhostGap(){
    if (st !== 'play' || story) return;
    var c = curGhost();
    if (!c) return;
    ghost = c.arr;
    var gt = ghostTimeAt(idx);
    if (gt < 0) return;
    var d = time - gt;
    var txt = (d >= 0 ? '+' : '-') + Math.abs(d).toFixed(2);
    ctx.save();
    ctx.font = 'bold 11px Oxanium, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(11,12,16,0.55)';
    ctx.fillRect(W/2 - 25, 5, 50, 14);
    ctx.fillStyle = d <= 0 ? c.col.body : '#E0453A';
    ctx.fillText(txt, W/2, 15.5);
    ctx.restore();
  }

  function drawGate(s, color){
    var x = s.x - camX, y = s.y - camY;
    if (x < -80 || x > W+80 || y < -80 || y > H+80) return;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(s.a);
    ctx.fillStyle = color;
    for (var i=-HALF;i<HALF;i+=11) ctx.fillRect(i, -3, 5.5, 6);
    ctx.restore();
  }

  function drawCar(){
    var blink = hitT > 0 && Math.floor(hitT*20) % 2 === 0;
    ctx.save();
    ctx.translate(car.x - camX, car.y - camY);
    ctx.rotate(car.ang);

    // 前照灯の光
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = COL.lamp;
    ctx.beginPath();
    ctx.moveTo(-9, -26); ctx.lineTo(-48, -196); ctx.lineTo(48, -196); ctx.lineTo(9, -26);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;

    drawCarNew(ctx, COL, steerV, sliding, lastSlip, blink, false);
    ctx.restore();
  }

// 真上から見たドリフト車。全長62・全幅31。前は -Y 方向。
// タイヤは張り出した泥よけの下に収め、端だけ見せる（実車の見え方）。
function drawCarNew(ctx, COL, steerV, sliding, slip, blink, brakeOn){
  if (blink) return;
  var st = Math.max(-1, Math.min(1, steerV));
  var sa = st * 0.55;

  // ---- タイヤ（車体の下。泥よけからわずかに覗く） ----
  function wheel(x, y, rot, wide, long, smear){
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    if (smear > 0){
      ctx.globalAlpha = 0.28; ctx.fillStyle = '#07080B';
      rr(ctx, -wide/2 - smear, -long/2, wide + smear*2, long, 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = '#0B0C10';
    rr(ctx, -wide/2, -long/2, wide, long, 1.6); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';                 // 溝
    ctx.fillRect(-wide/2 + 1.4, -long/2 + 1.0, 0.9, long - 2.0);
    ctx.fillRect( wide/2 - 2.3, -long/2 + 1.0, 0.9, long - 2.0);
    ctx.fillStyle = 'rgba(206,202,190,0.12)';           // 肩の照り
    ctx.fillRect(-wide/2 + 0.5, -long/2 + 1.4, wide - 1.0, 0.9);
    ctx.restore();
  }
  var sm = sliding ? 0.8 + slip * 1.5 : 0;
  wheel(-11.9, -18.5, sa, 6.2, 13.0, sm * 0.5);
  wheel( 11.9, -18.5, sa, 6.2, 13.0, sm * 0.5);
  wheel(-12.4,  18.5, 0,  7.2, 13.6, sm);
  wheel( 12.4,  18.5, 0,  7.2, 13.6, sm);

  // ---- 影 ----
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  bodyPath(ctx, 1.8, 3.0); ctx.fill();

  // ---- 車体 ----
  var grd = ctx.createLinearGradient(-15, 0, 15, 0);
  grd.addColorStop(0,    shade(COL.body, -0.50));
  grd.addColorStop(0.16, shade(COL.body, -0.16));
  grd.addColorStop(0.34, shade(COL.body,  0.30));   // 縦に走る照り
  grd.addColorStop(0.46, COL.body);
  grd.addColorStop(0.78, shade(COL.body, -0.22));
  grd.addColorStop(1,    shade(COL.body, -0.54));
  ctx.fillStyle = grd;
  bodyPath(ctx, 0, 0); ctx.fill();

  ctx.save(); bodyPath(ctx, 0, 0); ctx.clip();

  // 泥よけの張り出し
  ctx.fillStyle = 'rgba(0,0,0,0.26)';
  rr(ctx, -15.2, -25.0, 4.6, 14.0, 2.2); ctx.fill();
  rr(ctx,  10.6, -25.0, 4.6, 14.0, 2.2); ctx.fill();
  rr(ctx, -15.6,  11.5, 5.0, 14.5, 2.2); ctx.fill();
  rr(ctx,  10.6,  11.5, 5.0, 14.5, 2.2); ctx.fill();
  // 泥よけの縁の線
  ctx.strokeStyle = 'rgba(0,0,0,0.42)'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(-10.8, -25.0); ctx.lineTo(-10.8, -11.0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 10.8, -25.0); ctx.lineTo( 10.8, -11.0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-11.0,  11.5); ctx.lineTo(-11.0,  26.0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 11.0,  11.5); ctx.lineTo( 11.0,  26.0); ctx.stroke();
  // 横に走る細い帯
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  ctx.fillRect(-13.0, -3.0, 2.2, 12.0);
  ctx.fillRect( 10.8, -3.0, 2.2, 12.0);
  ctx.restore();

  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1.1;
  bodyPath(ctx, 0, 0); ctx.stroke();

  // ---- 前の下ばり ----
  ctx.fillStyle = '#14161C';
  rr(ctx, -12.4, -32.2, 24.8, 3.0, 1.2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  rr(ctx, -12.4, -32.2, 24.8, 1.0, 0.8); ctx.fill();
  // 開口部
  ctx.fillStyle = '#0D0F14';
  rr(ctx, -6.0, -30.4, 12.0, 2.6, 1); ctx.fill();

  // ---- 長いボンネット ----
  ctx.strokeStyle = 'rgba(0,0,0,0.34)'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(-9.6, -28.0); ctx.lineTo(-9.2, -12.0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 9.6, -28.0); ctx.lineTo( 9.2, -12.0); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.58)';
  for (var v = 0; v < 3; v++){
    var vy = -23.0 + v * 2.3;
    rr(ctx, -7.0, vy, 5.6, 1.3, 0.6); ctx.fill();
    rr(ctx,  1.4, vy, 5.6, 1.3, 0.6); ctx.fill();
  }

  // ---- 窓と屋根 ----
  var glass = '#0A0C11';
  ctx.fillStyle = glass;
  ctx.beginPath();                                    // 前窓
  ctx.moveTo(-7.0, -11.0); ctx.lineTo(7.0, -11.0);
  ctx.lineTo(9.4, -2.0); ctx.lineTo(-9.4, -2.0); ctx.closePath(); ctx.fill();
  var rg = ctx.createLinearGradient(-9, 0, 9, 0);
  rg.addColorStop(0, shade(COL.body, -0.24));
  rg.addColorStop(0.36, shade(COL.body, 0.34));
  rg.addColorStop(1, shade(COL.body, -0.30));
  ctx.fillStyle = rg;                                 // 屋根
  rr(ctx, -8.4, -2.0, 16.8, 8.6, 1.4); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.42)';                 // 柱
  ctx.fillRect(-9.0, -2.4, 1.6, 9.4);
  ctx.fillRect( 7.4, -2.4, 1.6, 9.4);
  ctx.fillStyle = glass;                              // 後窓
  ctx.beginPath();
  ctx.moveTo(-8.6, 6.6); ctx.lineTo(8.6, 6.6);
  ctx.lineTo(6.8, 13.4); ctx.lineTo(-6.8, 13.4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.13)';           // 前窓の映り込み
  ctx.beginPath();
  ctx.moveTo(-6.8, -10.8); ctx.lineTo(-1.4, -10.8);
  ctx.lineTo(-4.6, -2.2); ctx.lineTo(-9.2, -2.2); ctx.closePath(); ctx.fill();

  // ---- 側面の帯・ドアミラー ----
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(-11.6, -1.6, 1.4, 8.0);
  ctx.fillRect( 10.2, -1.6, 1.4, 8.0);
  ctx.fillStyle = shade(COL.body, -0.40);
  rr(ctx, -14.6, -12.4, 2.8, 2.2, 0.9); ctx.fill();
  rr(ctx,  11.8, -12.4, 2.8, 2.2, 0.9); ctx.fill();

  // ---- 後ろの翼（立て板つき） ----
  ctx.fillStyle = 'rgba(0,0,0,0.55)';                 // 翼の下の影
  rr(ctx, -13.6, 20.0, 27.2, 4.0, 1.2); ctx.fill();
  var wg = ctx.createLinearGradient(0, 18.8, 0, 22.2);
  wg.addColorStop(0, shade(COL.body, -0.02));
  wg.addColorStop(1, shade(COL.body, -0.40));
  ctx.fillStyle = wg;
  rr(ctx, -13.6, 18.8, 27.2, 3.4, 1.2); ctx.fill();
  ctx.fillStyle = '#14161C';                          // 立て板
  rr(ctx, -13.8, 18.6, 1.8, 5.6, 0.7); ctx.fill();
  rr(ctx,  12.0, 18.6, 1.8, 5.6, 0.7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';                  // 支柱
  ctx.fillRect(-6.4, 16.8, 2.0, 3.0);
  ctx.fillRect( 4.4, 16.8, 2.0, 3.0);

  // ---- 前照灯 ----
  ctx.fillStyle = COL.lampCore;
  rr(ctx, -9.4, -30.0, 5.8, 2.8, 1.1); ctx.fill();
  rr(ctx,  3.6, -30.0, 5.8, 2.8, 1.1); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  rr(ctx, -9.4, -30.0, 5.8, 1.1, 0.7); ctx.fill();
  rr(ctx,  3.6, -30.0, 5.8, 1.1, 0.7); ctx.fill();

  // ---- 尾灯 ----
  var hot = brakeOn || sliding;
  if (hot){
    ctx.globalAlpha = 0.32; ctx.fillStyle = '#FF3B2E';
    rr(ctx, -12.0, 26.2, 9.8, 4.6, 1.8); ctx.fill();
    rr(ctx,   2.2, 26.2, 9.8, 4.6, 1.8); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = hot ? '#FF6A5C' : '#A02821';
  rr(ctx, -11.0, 27.0, 7.8, 2.8, 1); ctx.fill();
  rr(ctx,   3.2, 27.0, 7.8, 2.8, 1); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(-1.8, 27.0, 3.6, 2.8);
  ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = 0.9;   // 荷室のふた
  ctx.beginPath(); ctx.moveTo(-9.0, 25.6); ctx.lineTo(9.0, 25.6); ctx.stroke();

  // ---- 上の縁の照り返し ----
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(-6.0, -31.0); ctx.lineTo(6.0, -31.0); ctx.stroke();
}

function bodyPath(ctx, dx, dy){
  ctx.beginPath();
  ctx.moveTo(dx +  -6.2, dy + -31.2);
  ctx.lineTo(dx + -11.4, dy + -28.6);
  ctx.quadraticCurveTo(dx + -14.4, dy + -25.6, dx + -14.2, dy + -18.5);  // 前の張り出し
  ctx.quadraticCurveTo(dx + -11.8, dy +  -5.0, dx + -12.0, dy +   8.0);  // 胴を絞る
  ctx.quadraticCurveTo(dx + -15.2, dy +  13.0, dx + -15.0, dy +  21.0);  // 後ろの張り出し
  ctx.lineTo(dx + -11.2, dy +  30.0);
  ctx.lineTo(dx +  11.2, dy +  30.0);
  ctx.quadraticCurveTo(dx +  15.2, dy +  13.0, dx +  12.0, dy +   8.0);
  ctx.quadraticCurveTo(dx +  11.8, dy +  -5.0, dx +  14.2, dy + -18.5);
  ctx.quadraticCurveTo(dx +  14.4, dy + -25.6, dx +  11.4, dy + -28.6);
  ctx.closePath();
}

function rr(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function shade(hex, k){
  var n = parseInt(hex.slice(1), 16);
  var r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  if (k >= 0){ r += (255-r)*k; g += (255-g)*k; b += (255-b)*k; }
  else { r *= (1+k); g *= (1+k); b *= (1+k); }
  return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
}

  // ---------- 表示 ----------
  var prev = {};
  function syncDash(){
    var t = (st === 'play' || st === 'pause' || st === 'done') ? time : 0;
    var ts = fmt(t);
    if (prev.t !== ts) { vTime.textContent = ts; prev.t = ts; }
    var bs = best ? fmt(best) : '--';
    if (prev.b !== bs) { vBest.textContent = bs; prev.b = bs; }
    var ds = (score + Math.round(pending*mult)).toLocaleString('ja-JP');
    if (prev.d !== ds) { vDrift.textContent = ds; prev.d = ds; }
    var pg = Math.round(idx / Math.max(1, TRACK.length-1) * 100);
    if (prev.p !== pg) { progBar.style.width = pg + '%'; prev.p = pg; }
    if (prev.sl !== sliding) {
      dash.classList.toggle('sliding', sliding);
      glow.classList.toggle('on', sliding);
      prev.sl = sliding;
    }
    if (st === 'count') {
      var n = Math.ceil(countT - 0.2);
      var txt = n > 0 ? String(n) : 'GO';
      if (prev.c !== txt) {
        countN.textContent = txt;
        countEl.classList.toggle('go', txt === 'GO');
        countN.style.animation = 'none'; void countN.offsetHeight; countN.style.animation = '';
        prev.c = txt;
      }
    }
  }

  // ---------- まわす ----------
  var lastT = 0, acc = 0;
  function frame(now){
    requestAnimationFrame(frame);
    if (!lastT) { lastT = now; return; }
    var dt = Math.min(0.05, (now - lastT)/1000);
    lastT = now;
    if (window.WADACHI_AUDIO) WADACHI_AUDIO.tick(st, sliding, lastSlip, lastSp);
    if (st !== 'pause') {
      acc += dt;
      var g = 0;
      while (acc >= 1/60 && g < 6) { step(1/60); acc -= 1/60; g++; }
      if (g >= 6) acc = 0;
      draw();
    }
    syncDash();
  }

  function boot(saved){
    wiped = resetIfOldRules();
    loadBest();
    loadStory();
    syncGh();
    if (saved && saved.best && (!best || saved.best < best)) { best = saved.best; saveBest(); }
    layout();
    setCourse(0);
    syncDash();
    requestAnimationFrame(frame);
  }
  try {
    var hot = window.claude && window.claude.hot;
    if (hot && hot.snapshot) hot.snapshot(function(){ return { best: best }; });
    if (hot && hot.ready) hot.ready(boot);
    else boot((hot && hot.data) || {});
  } catch(e){ boot({}); }
})();
</script>

<script>
// ===== スマホの全画面 =====
// iPhone の Safari は、動画以外の全画面に対応していない。その場合はボタンを出さず、
// 「ホーム画面に追加」から開けば上下のバーが消える（公開サイト側で手当てしてある）。
(function(){
  var el = document.documentElement;
  var btn = document.getElementById('fsBtn');
  if (!btn) return;
  var req = el.requestFullscreen || el.webkitRequestFullscreen;
  var exi = document.exitFullscreen || document.webkitExitFullscreen;
  if (!req) return;                       // 対応していない端末ではボタンを出さない
  btn.classList.add('on');

  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function sync(){
    var on = isFs();
    el.classList.toggle('fs', on);
    btn.textContent = on ? '×' : '全';
    btn.title = on ? '全画面をやめる' : '全画面';
    btn.setAttribute('aria-label', btn.title);
    // 作品側に大きさを測り直させる
    setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 60);
    setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 360);
  }
  btn.addEventListener('click', function(e){
    e.preventDefault();
    try{
      if (isFs()) { if (exi) exi.call(document); }
      else { req.call(el, { navigationUI:'hide' }); }
    }catch(err){}
  });
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  sync();
})();
</script>
