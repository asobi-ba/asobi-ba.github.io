<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="左右のハンドルだけで走る夜の峠のドリフトタイムアタック。滑った跡が路面に黒く残る。">
  <meta name="theme-color" content="#12131A">
  <!-- スマホで「ホーム画面に追加」すると、上下のバーが消えて全画面で遊べる -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="黒い轍">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    /* 単体のページとして成立させるための最低限の土台 */
    :root{
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    body{ margin:0; font:14px system-ui,-apple-system,"Segoe UI",sans-serif; background:#12131A; }
    img{ max-width:100%; }
    [hidden]{ display:none !important; }
  </style>
<title>黒い轍</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  /* 夜の峠に振り切った配色。明暗の切り替えはせず、この一色で通す */
  :root{
    color-scheme: dark;
    --night:#0B0C10;
    --panel:#14161C;
    --line:rgba(232,228,216,.14);
    --text:#E8E4D8;
    --dim:#7C7A73;
    --amber:#F0873A;
    --amber-hi:#FFC27A;
    --cool:#5FD3E0;
    --red:#E0453A;
  }
  html,body{height:100%}
  /* スマホは上下のバーの出入りで高さが変わる。dvh なら実際に見えている高さになる */
  @supports (height:100dvh){ html,body{height:100dvh} }
  body{overscroll-behavior:none}

  /* 全画面のときは上下の飾りを消して、遊ぶ面だけにする */
  html.fs .masthead, html.fs .legend{display:none}
  html.fs .page{padding:4px 6px 6px}

  .fsbtn{
    position:fixed;right:8px;top:8px;z-index:60;
    width:34px;height:34px;padding:0;cursor:pointer;
    display:none;align-items:center;justify-content:center;
    font-family:'Zen Kaku Gothic New',system-ui,sans-serif;
    font-size:14px;font-weight:700;line-height:1;
    color:inherit;background:rgba(127,127,127,.20);
    border:1px solid rgba(127,127,127,.45);border-radius:4px;
    -webkit-tap-highlight-color:transparent;
  }
  .fsbtn.on{display:flex}
  .fsbtn:focus-visible{outline:2px solid currentColor;outline-offset:2px}
  body{
    margin:0;background:var(--night);color:var(--text);
    font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',system-ui,sans-serif;
  }
  .page{
    height:100%;box-sizing:border-box;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:10px 16px 14px;
  }

  .masthead{text-align:center;flex:0 0 auto}
  .masthead h1{
    margin:0;font-size:clamp(17px,4.6vw,22px);font-weight:700;
    letter-spacing:.42em;text-indent:.42em;
  }
  .masthead p{margin:2px 0 0;font-size:11px;color:var(--dim);letter-spacing:.1em}

  .stage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  .rig{display:inline-flex;flex-direction:column;gap:5px;max-width:100%}

  .tabs{display:flex;gap:4px}
  .tab{
    flex:1 1 0;min-width:0;
    font-family:'Zen Kaku Gothic New',sans-serif;font-size:12px;font-weight:500;
    letter-spacing:.08em;padding:6px 2px;cursor:pointer;
    color:var(--dim);background:var(--panel);
    border:1px solid var(--line);border-radius:0;
    display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.3;
  }
  .tab b{font-weight:700;font-size:13px;color:inherit}
  .tab i{font-style:normal;font-size:8.5px;opacity:.75}
  .tab.on{color:var(--amber);border-color:var(--amber);background:rgba(240,135,58,.10)}
  .tab:focus-visible{outline:2px solid var(--cool);outline-offset:2px}

  .dash{
    display:flex;align-items:center;gap:11px;
    background:var(--panel);border:1px solid var(--line);
    padding:6px 9px;
  }
  .dash .cell{display:flex;flex-direction:column;gap:1px;min-width:0}
  .dash .k{font-family:'Oxanium',monospace;font-size:7.5px;letter-spacing:.2em;color:var(--dim)}
  .dash .v{
    font-family:'Oxanium',monospace;font-weight:700;font-size:16px;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .dash .v.sm{font-size:12px}
  .dash .drift .v{color:var(--dim);transition:color .12s ease}
  .dash.sliding .drift .v{color:var(--amber-hi)}
  .dash .sp{flex:1}

  .prog{height:3px;background:var(--panel);border:1px solid var(--line);border-top:none}
  .prog i{display:block;height:100%;width:0;background:var(--cool)}

  .screen{
    position:relative;display:inline-block;line-height:0;
    border:1px solid var(--line);background:#000;max-width:100%;overflow:hidden;
  }
  canvas{display:block;touch-action:none}
  .glow{
    position:absolute;inset:0;pointer-events:none;opacity:0;
    box-shadow:inset 0 0 40px rgba(240,135,58,.55);
    transition:opacity .16s ease;
  }
  .glow.on{opacity:1}

  .count{
    position:absolute;inset:0;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
  }
  .count.off{display:none}
  .count span{
    display:grid;place-items:center;
    width:124px;height:124px;border-radius:50%;
    background:rgba(5,6,10,.82);
    border:3px solid rgba(240,135,58,.7);
    box-shadow:0 0 0 6px rgba(5,6,10,.45), 0 0 30px rgba(0,0,0,.7);
    font-family:'Oxanium',monospace;font-weight:700;font-size:60px;line-height:1;
    color:#FFF4E6;text-shadow:0 2px 10px rgba(0,0,0,.9);
    animation:pop .4s ease-out;
  }
  .count.go span{
    font-size:40px;letter-spacing:.12em;text-indent:.12em;
    color:#8CF0AE;border-color:rgba(140,240,174,.85);
  }
  @keyframes pop{ from{ transform:scale(1.35); opacity:.2 } to{ transform:scale(1); opacity:1 } }
  @media (prefers-reduced-motion:reduce){ .count span{animation:none} }

  .veil{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:11px;padding:20px;box-sizing:border-box;text-align:center;
    background:rgba(8,9,13,.92);line-height:1.75;
  }
  .veil.off{display:none}

  /* ===== 順位表 ===== */
  .lb{
    width:min(100%,320px);font-size:12px;line-height:1.5;color:inherit;
    display:flex;flex-direction:column;gap:6px;
  }
  .lb.hide{display:none}
  .lb .lb-t{font-size:10.5px;letter-spacing:.18em;opacity:.65}
  .lb ol{
    list-style:none;margin:0;padding:0;
    display:flex;flex-direction:column;gap:2px;
    font-variant-numeric:tabular-nums;
  }
  .lb li{display:flex;gap:8px;align-items:baseline}
  .lb li .p{width:2.2em;text-align:right;opacity:.55}
  .lb li .n{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb li .s{font-weight:700}
  .lb li.me{font-weight:700;text-decoration:underline;text-underline-offset:3px}
  .lb li.me .p,.lb li.me .n,.lb li.me .s{opacity:1}
  .lb .lb-form{display:flex;gap:6px;align-items:center}
  .lb .lb-form input{
    flex:1;min-width:0;font:inherit;font-size:13px;
    padding:6px 8px;box-sizing:border-box;color:inherit;
    background:rgba(127,127,127,.18);
    border:1px solid rgba(127,127,127,.5);border-radius:2px;
  }
  .lb .lb-form button{
    font:inherit;font-size:12px;font-weight:700;white-space:nowrap;
    padding:7px 12px;cursor:pointer;color:inherit;
    background:rgba(127,127,127,.3);
    border:1px solid rgba(127,127,127,.55);border-radius:2px;
  }
  .lb .lb-form button:disabled{opacity:.45;cursor:default}
  .lb .lb-msg{font-size:11px;opacity:.75;min-height:1.2em}
  .lb .lb-msg.ng{opacity:1;font-weight:700}
  .lb .lb-warn{font-size:10px;opacity:.55}
  .veil h2{
    margin:0;font-family:'Oxanium',monospace;font-weight:700;
    font-size:clamp(14px,4.4vw,19px);letter-spacing:.16em;color:var(--amber);
  }
  .veil p{margin:0;font-size:12px;color:#C4C0B6;max-width:22em}
  .veil .course{font-size:15px;font-weight:700;color:var(--text);letter-spacing:.14em}
  .veil .course em{font-style:normal;font-size:10px;font-weight:400;color:var(--cool);letter-spacing:.1em}
  .veil .big{
    font-family:'Oxanium',monospace;font-weight:700;font-size:34px;
    font-variant-numeric:tabular-nums;color:var(--text);line-height:1;
  }
  .veil .sub{font-family:'Oxanium',monospace;font-size:9px;letter-spacing:.18em;color:var(--cool)}
  .go{
    font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:13px;
    letter-spacing:.22em;text-indent:.22em;
    padding:9px 22px;cursor:pointer;
    color:#0B0C10;background:var(--amber);border:none;
  }
  .go:hover{background:var(--amber-hi)}
  .go:focus-visible{outline:2px solid var(--cool);outline-offset:3px}

  .vol{
    position:fixed;left:10px;bottom:10px;z-index:55;
    display:flex;align-items:center;gap:6px;
    font-family:'Oxanium',monospace;font-size:9px;letter-spacing:.14em;
    color:var(--cool);background:rgba(11,12,16,.55);
    border:1px solid rgba(196,192,182,.22);border-radius:3px;padding:5px 8px;
  }
  .veil .gh{ color:var(--cool);font-size:11px;letter-spacing:.04em; }
  .ghb{
    -webkit-appearance:none;appearance:none;cursor:pointer;
    font-family:'Oxanium',monospace;font-size:9px;letter-spacing:.14em;
    color:var(--dim);background:transparent;
    border:1px solid rgba(196,192,182,.22);border-radius:2px;padding:3px 6px;margin-left:4px;
  }
  .ghb.on{ color:var(--cool);border-color:rgba(95,211,224,.55); }
  .ghb.top{ color:#E8C07A;border-color:rgba(232,192,122,.6); }
  .vol input{
    -webkit-appearance:none;appearance:none;width:74px;height:3px;
    background:rgba(196,192,182,.3);border-radius:2px;outline:none;cursor:pointer;
  }
  .vol input::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;
    background:var(--amber);border:none;cursor:pointer;
  }
  .vol input::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:var(--amber);border:none;cursor:pointer;
  }
  .vol input:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

  .legend{
    flex:0 0 auto;width:100%;max-width:520px;
    border-top:1px solid var(--line);padding-top:7px;
    display:flex;flex-wrap:wrap;gap:3px 14px;
    font-size:11px;color:var(--dim);
  }
  .legend span{white-space:nowrap}
  @media (max-height:640px){ .masthead p{display:none} }
</style>
</head>
<body>
<button class="fsbtn" id="fsBtn" type="button" title="全画面" aria-label="全画面にする">全</button>
<div class="page">
  <div class="masthead">
    <h1>黒い轍</h1>
    <p>下りの峠をひとっ走り。ブレーキは無い、滑らせて止めろ</p>
  </div>

  <div class="stage" id="stage">
    <div class="rig" id="rig">
      <div class="tabs" id="tabs">
        <button class="tab on" type="button" data-c="0"><b>杉ノ沢</b><i>バランス</i></button>
        <button class="tab"    type="button" data-c="1"><b>鷹ノ巣</b><i>高速・長い</i></button>
        <button class="tab"    type="button" data-c="2"><b>蛇骨</b><i>ヘアピン連続</i></button>
      </div>

      <div class="dash" id="dash">
        <div class="cell"><span class="k">TIME</span><span class="v" id="vTime">0.00</span></div>
        <div class="cell"><span class="k">BEST</span><span class="v sm" id="vBest">--</span></div>
        <div class="cell drift"><span class="k">DRIFT</span><span class="v sm" id="vDrift">0</span></div>
        <div class="sp"></div>
        <div class="cell"><span class="k">KM/H</span><span class="v sm" id="vSpd">0</span></div>
      </div>
      <div class="prog"><i id="progBar"></i></div>

      <div class="screen" id="screen">
        <canvas id="game" aria-label="黒い轍 ゲーム画面"></canvas>
        <div class="glow" id="glow" aria-hidden="true"></div>
        <div class="count off" id="count" aria-hidden="true"><span id="countN">3</span></div>
        <div class="veil" id="veil">
          <h2 id="veilTitle">TOUGE TIME ATTACK</h2>
          <p id="veilBody">
            左右だけ。アクセルは自動、ブレーキは無い。<br>
            ヘアピンは曲がりきれない。<br>
            <b>滑らせて速度を落とす</b>のが唯一の減速。
          </p>
          <div class="lb hide" id="lbBox"></div>
          <button class="go" id="goBtn" type="button">スタート</button>
        </div>
      </div>
    </div>
  </div>

  <div class="vol"><span>SOUND</span><input id="volSl" type="range" min="0" max="100" step="5" value="50" aria-label="音量"><button class="ghb" id="ghBtn" type="button" aria-pressed="true">GHOST</button></div>

  <div class="legend">
    <span>← → / A D でハンドル</span>
    <span>スマホは画面の左半分・右半分をおす</span>
    <span>Space＝スタート／やり直し</span>
    <span>P＝やすみ</span>
    <span>G＝ゴースト</span>
  </div>
</div>

<script>
// ===== 黒い轍の音（ユーロビート）=====
// 音源ファイルは使わず、波形をその場で作る。
//   BGM  … コースごとに別の曲。四つ打ち・裏拍のオープンハイハット・
//           16分で転がるベース・ノコギリ波の主旋律という、ユーロビートの型。
//   タイヤの鳴き … 雑音を帯域で絞るだけでは「シャー」としか鳴らない。
//           実物は共鳴した音程を持ち、滑るほど高くなり、細かく震える。
//           そこで「高いQの帯域を3本＋低いうなり＋周波数と音量のゆらぎ」で作る。
(function(){
  var actx = null, master = null, musicG = null, seG = null;
  var vol = 0.5, ready = false;

  // ---------- 曲 ----------
  // 音度は base からの半音。-1 は休み。
  var TRACKS = [
    { // 0 杉ノ沢（バランス）イ短調
      bpm: 158, base: 220.00,
      root:  [110.00, 87.31, 130.81, 98.00, 110.00, 87.31, 130.81, 82.41],
      triad: [[220.00,261.63,329.63],[174.61,220.00,261.63],[261.63,329.63,392.00],
              [196.00,246.94,293.66],[220.00,261.63,329.63],[174.61,220.00,261.63],
              [261.63,329.63,392.00],[164.81,207.65,246.94]],
      bass:  [0,0,12,0, 0,0,12,0, 0,0,12,0, 0,12,0,12],
      lead: [
        [12,-1,10,-1, 7,-1,10,-1, 12,-1,-1,15, 14,-1,12,-1],
        [ 8,-1, 7,-1, 5,-1, 7,-1,  8,-1,-1,12, 10,-1, 8,-1],
        [ 7,-1, 5,-1, 3,-1, 5,-1,  7,-1,-1,10, 12,-1,10,-1],
        [10,-1,12,-1,14,-1,12,-1, 10,-1,-1, 7,  5,-1, 7,-1],
        [12,-1,10,-1, 7,-1,10,-1, 12,-1,-1,15, 14,-1,12,-1],
        [ 8,-1, 7,-1, 5,-1, 7,-1,  8,-1,-1,12, 10,-1, 8,-1],
        [ 7,-1, 5,-1, 3,-1, 5,-1,  7,-1,-1,10, 12,-1,10,-1],
        [ 7,-1, 8,-1,10,-1,12,-1, 14,-1,-1,-1, 11,-1, 7,-1]
      ]
    },
    { // 1 鷹ノ巣（高速・長い）ハ短調・速め。ベースは16分でまっすぐ転がす
      bpm: 168, base: 261.63,
      root:  [130.81, 103.83, 155.56, 116.54, 130.81, 103.83, 87.31, 98.00],
      triad: [[261.63,311.13,392.00],[207.65,261.63,311.13],[155.56,196.00,233.08],
              [233.08,293.66,349.23],[261.63,311.13,392.00],[207.65,261.63,311.13],
              [174.61,207.65,261.63],[196.00,246.94,293.66]],
      bass:  [0,12,0,12, 0,12,0,12, 0,12,0,12, 0,12,0,12],
      lead: [
        [12,-1,15,-1, 14,-1,12,-1, 10,12,-1,10,  7,-1,10,-1],
        [ 8,-1,12,-1, 15,-1,12,-1,  8,-1,-1, 7,  5,-1, 8,-1],
        [ 7,-1,10,-1, 12,-1,15,-1, 14,-1,-1,12, 10,-1, 7,-1],
        [10,-1,14,-1, 17,-1,14,-1, 10,-1,-1,12, 14,-1,10,-1],
        [12,-1,15,-1, 14,-1,12,-1, 10,12,-1,10,  7,-1,10,-1],
        [ 8,-1,12,-1, 15,-1,12,-1,  8,-1,-1, 7,  5,-1, 8,-1],
        [ 7,-1,10,-1, 12,-1,15,-1, 14,-1,-1,12, 10,-1, 7,-1],
        [ 7,-1, 8,-1, 11,-1,14,-1, 15,-1,-1,-1, 14,-1,11,-1]
      ]
    },
    { // 2 蛇骨（ヘアピン連続）ホ短調・やや遅め。重く、跳ねる
      bpm: 150, base: 164.81,
      root:  [82.41, 130.81, 98.00, 73.42, 82.41, 130.81, 110.00, 123.47],
      triad: [[164.81,196.00,246.94],[196.00,261.63,329.63],[196.00,246.94,293.66],
              [146.83,185.00,220.00],[164.81,196.00,246.94],[196.00,261.63,329.63],
              [220.00,261.63,329.63],[246.94,311.13,369.99]],
      bass:  [0,0,0,12, 0,0,7,12, 0,0,0,12, 0,7,0,12],
      lead: [
        [12,-1,-1,10,  7,-1,10,-1, 12,-1,15,-1, 14,-1,12,-1],
        [ 8,-1,-1, 7,  3,-1, 7,-1,  8,-1,12,-1, 15,-1,12,-1],
        [10,-1,-1, 7,  3,-1, 7,-1, 10,-1,14,-1, 12,-1,10,-1],
        [ 9,-1,-1,14, 12,-1, 9,-1,  5,-1, 9,-1, 12,-1, 9,-1],
        [12,-1,-1,10,  7,-1,10,-1, 12,-1,15,-1, 14,-1,12,-1],
        [ 8,-1,-1, 7,  3,-1, 7,-1,  8,-1,12,-1, 15,-1,12,-1],
        [10,-1,-1, 7,  5,-1, 7,-1, 10,-1,14,-1, 12,-1,10,-1],
        [11,-1,-1,14, 11,-1, 7,-1, 11,-1,-1,-1, 14,-1,11,-1]
      ]
    }
  ];

  var T = TRACKS[0];
  var SPB = 60 / T.bpm, STP = SPB / 4;
  var STEPS = 8 * 16;

  function semi(base, n){ return base * Math.pow(2, n / 12); }

  // ---------- 波形をつくる ----------
  function norm(d, pk){
    var m = 0;
    for (var i = 0; i < d.length; i++){ var v = Math.abs(d[i]); if (v > m) m = v; }
    if (m > 0){ var sc = pk / m; for (var j = 0; j < d.length; j++) d[j] *= sc; }
    return d;
  }
  function buf(d){
    var b = actx.createBuffer(1, d.length, actx.sampleRate);
    b.getChannelData(0).set(d);
    return b;
  }
  // ゆらぎ用：でたらめな値をゆっくり動かすだけの波。
  // きれいな正弦波でゆらすとビブラート＝歌声になるので、乱数で震わせる。
  function jitData(sr){
    var hz = 42, n = Math.round(sr * 2.0), d = new Float32Array(n);
    var step = Math.round(sr / hz), a = Math.random()*2-1, b = Math.random()*2-1, k = 0;
    for (var i = 0; i < n; i++){
      var u = k / step;
      d[i] = a + (b - a) * (u*u*(3-2*u));
      k++;
      if (k >= step){ k = 0; a = b; b = Math.random()*2-1; }
    }
    var f = Math.round(sr * 0.02);
    for (var j = 0; j < f; j++){ var g = j / f; d[j] = d[j]*g + d[n-1-j]*(1-g); }
    return d;
  }

  function kickData(sr){
    var dur = 0.30, n = Math.round(sr * dur), d = new Float32Array(n), ph = 0;
    for (var i = 0; i < n; i++){
      var t = i / sr;
      var f = 45 + 78 * Math.exp(-t / 0.028);
      ph += 2 * Math.PI * f / sr;
      d[i] = Math.sin(ph) * Math.exp(-t / 0.085)
           + (Math.random()*2-1) * Math.exp(-t / 0.004) * 0.35;
    }
    return norm(d, 0.95);
  }
  function clapData(sr){
    var dur = 0.26, n = Math.round(sr * dur), d = new Float32Array(n);
    var hits = [0, 0.011, 0.023], y = 0;
    for (var i = 0; i < n; i++){
      var t = i / sr, a = 0;
      for (var h = 0; h < hits.length; h++) if (t >= hits[h]) a += Math.exp(-(t - hits[h]) / 0.012);
      a += Math.exp(-t / 0.10) * 0.55;
      y += 0.55 * ((Math.random()*2-1) - y);
      d[i] = y * a;
    }
    return norm(d, 0.9);
  }
  function hatData(sr, open){
    var dur = open ? 0.24 : 0.055, n = Math.round(sr * dur), d = new Float32Array(n), prev = 0;
    for (var i = 0; i < n; i++){
      var t = i / sr, w = Math.random()*2-1;
      var hp = w - prev; prev = w;
      d[i] = hp * Math.exp(-t / (open ? 0.075 : 0.012));
    }
    return norm(d, 0.75);
  }
  function crashData(sr){
    var dur = 1.1, n = Math.round(sr * dur), d = new Float32Array(n), prev = 0;
    for (var i = 0; i < n; i++){
      var t = i / sr, w = Math.random()*2-1;
      var hp = w - prev * 0.6; prev = w;
      d[i] = hp * Math.exp(-t / 0.35) * Math.min(1, t / 0.004);
    }
    return norm(d, 0.7);
  }
  // 鳴きのもとになる雑音。低いほうを少し残して、帯域で絞ったときに芯が出るようにする
  function noiseData(sr){
    var n = Math.round(sr * 1.5), d = new Float32Array(n), y = 0;
    for (var i = 0; i < n; i++){
      var w = Math.random()*2-1;
      y += 0.5 * (w - y);
      d[i] = w * 0.65 + y * 0.35;
    }
    var f = Math.round(sr * 0.012);
    for (var k = 0; k < f; k++){
      var g = k / f;
      d[k] = d[k] * g + d[n-1-k] * (1-g);
    }
    return norm(d, 0.85);
  }
  function hitData(sr){
    var dur = 0.35, n = Math.round(sr * dur), d = new Float32Array(n), y = 0;
    for (var i = 0; i < n; i++){
      var t = i / sr, e = Math.exp(-t / 0.06);
      y += 0.2 * ((Math.random()*2-1) - y);
      d[i] = (y * 0.8 + Math.sin(2*Math.PI*84*t) * 0.5 + Math.sin(2*Math.PI*140*t) * 0.22) * e;
    }
    return norm(d, 0.92);
  }

  var B = {};

  // ---------- 音を出す道具 ----------
  function one(b, gain, rate, bus){
    if (!actx || !b) return;
    var s = actx.createBufferSource();
    s.buffer = b;
    if (rate) s.playbackRate.value = rate;
    var g = actx.createGain();
    g.gain.value = gain;
    s.connect(g); g.connect(bus || musicG);
    try { s.start(); } catch(e){}
  }
  function saw(freq, t, dur, gain, cut, detune, bus){
    if (!actx) return;
    var g = actx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.006);
    g.gain.setValueAtTime(gain, t + dur * 0.6);
    g.gain.linearRampToValueAtTime(0, t + dur);
    var f = actx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = cut; f.Q.value = 1.0;
    g.connect(f); f.connect(bus || musicG);
    var ds = detune ? [-detune, detune] : [0];
    for (var i = 0; i < ds.length; i++){
      var o = actx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = freq;
      o.detune.value = ds[i];
      o.connect(g);
      try { o.start(t); o.stop(t + dur + 0.02); } catch(e){}
    }
  }

  // ---------- 曲の進行 ----------
  var playing = false, nextStep = 0, nextTime = 0;

  function schedule(s, t){
    var bar = Math.floor(s / 16), k = s % 16;
    var root = T.root[bar];

    if (k % 4 === 0) one(B.kick, 0.85, 1, musicG);
    if (k === 4 || k === 12) one(B.clap, 0.55, 1, musicG);
    if (k % 2 === 0) one(B.hat, 0.26, 1, musicG);
    if (k % 4 === 2) one(B.hatO, 0.22, 1, musicG);
    if (s === 0) one(B.crash, 0.35, 1, musicG);

    var bn = T.bass[k];
    if (bn >= 0) saw(semi(root, bn), t, STP * 0.85, 0.30, 900, 0, musicG);

    var ln = T.lead[bar][k];
    if (ln >= 0) saw(semi(T.base, ln), t, STP * 1.7, 0.16, 3200, 9, musicG);

    if (k === 0){
      var c = T.triad[bar];
      for (var i = 0; i < 3; i++) saw(c[i], t, SPB * 0.42, 0.055, 2400, 6, musicG);
    }
  }

  function pump(){
    if (!playing || !actx) return;
    var ahead = actx.currentTime + 0.20;
    var guard = 0;
    while (nextTime < ahead && guard++ < 200){
      schedule(nextStep % STEPS, nextTime);
      nextStep++;
      nextTime += STP;
    }
  }

  // ---------- 効果音 ----------
  function beep(freq, dur, gain){
    if (!actx) return;
    var t = actx.currentTime;
    var o = actx.createOscillator();
    o.type = 'square'; o.frequency.value = freq;
    var g = actx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.006);
    g.gain.setValueAtTime(gain, t + dur * 0.7);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(seG);
    try { o.start(t); o.stop(t + dur + 0.02); } catch(e){}
  }
  function arp(list, step, dur, gain){
    if (!actx) return;
    var t0 = actx.currentTime;
    for (var i = 0; i < list.length; i++) saw(list[i], t0 + i * step, dur, gain, 3600, 8, seG);
  }

  // ---------- 走っている間の音 ----------
  var noiseSrc = null;
  var sqIn = null, sqBp = [], sqTrem = null, sqJit = [];
  var scrIn = null, scrBp = null;              // 路面をこするゴムの音
  var thIn = null, thBp = null;                // 車重の低い唸り
  var buzzO = null, buzzG = null, buzzBp = null, buzzTrem = null;  // ゴムのびびり
  var roarIn = null, roarBp = null;
  var engG = null, engO = [], engF = null, engMul = [];
  var engNz = null, engNzF = null, engLow = null;
  var engNzMod = null, engPulse = null, engMid = null;
  var engLoad = 0, engPrevSp = 0;
  // 変速機のつもり。速度のこの割合で次の段に入る（回転が落ちてまた上がる）
  var GEARS = [0, 0.15, 0.29, 0.46, 0.68];

  // 燃焼の一発ぶんの波。倍音を並べて、位相をずらして山を作る。
  // ノコギリ波のままだと滑らかにつながって電子音になる。
  // 位相を揃えると各周期に山がひとつ立つ＝一発の爆発になる。
  // 位相をばらすと山がほどけて「ビヨー」と鳴る（ゴムっぽく聞こえる）。
  function pulseWave(n, roll){
    var re = new Float32Array(n + 1), im = new Float32Array(n + 1);
    for (var i = 1; i <= n; i++){
      re[i] = Math.pow(i, roll) * (0.90 + Math.random() * 0.20);
      im[i] = 0;
    }
    try { return actx.createPeriodicWave(re, im); } catch(e){ return null; }
  }

  function makeLive(){
    noiseSrc = actx.createBufferSource();
    noiseSrc.buffer = B.noise; noiseSrc.loop = true;

    // --- タイヤの鳴き ---
    sqIn = actx.createGain(); sqIn.gain.value = 0;
    noiseSrc.connect(sqIn);
    // 低いところを落としてから共鳴させる。残すと胴鳴りして「ほえ」になる
    var sqHp = actx.createBiquadFilter();
    sqHp.type = 'highpass'; sqHp.frequency.value = 2500; sqHp.Q.value = 0.7;
    sqIn.connect(sqHp);

    sqTrem = actx.createGain(); sqTrem.gain.value = 0.90;
    sqTrem.connect(seG);

    // Qが低いと音程が消えて「シー」、高すぎると歌になる。
    // 1本目だけ強く尖らせて音程を作り、2本目で厚み、3本目は広く取って空気の音にする。
    var Qs = [30, 18, 6], gs = [0.77, 0.27, 0.19];
    for (var i = 0; i < 3; i++){
      var bp = actx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 900;
      bp.Q.value = Qs[i];
      var g = actx.createGain(); g.gain.value = gs[i];
      sqHp.connect(bp); bp.connect(g); g.connect(sqTrem);
      sqBp.push(bp);
    }

    // 周波数のゆらぎ（くっついては滑る のふるえ）
    // 正弦波だとビブラートになって歌声に聞こえるので、乱数の波で震わせる
    function jitter(param, amount, rate, offset){
      var src = actx.createBufferSource();
      src.buffer = B.jit; src.loop = true; src.playbackRate.value = rate;
      var g = actx.createGain(); g.gain.value = amount;
      src.connect(g); g.connect(param);
      try { src.start(0, offset); } catch(e){ try { src.start(); } catch(e2){} }
      return src;
    }
    // 音量のゆらぎは深く速くする。ゴムは滑らかに滑らず、食いついては離れる
    sqTrem.gain.value = 0.55;
    sqJit = [
      jitter(sqBp[0].frequency, 150, 1.00, 0.00),
      jitter(sqBp[1].frequency, 190, 1.37, 0.71),
      jitter(sqBp[2].frequency, 120, 0.83, 1.33),
      jitter(sqTrem.gain,      0.45, 2.30, 0.43)
    ];

    // --- ゴムが路面をこする低い音 ---
    scrIn = actx.createGain(); scrIn.gain.value = 0;
    noiseSrc.connect(scrIn);
    scrBp = actx.createBiquadFilter();
    scrBp.type = 'bandpass'; scrBp.frequency.value = 380; scrBp.Q.value = 0.9;
    scrIn.connect(scrBp); scrBp.connect(sqTrem);

    // --- 車重がタイヤを押しつける低い唸り ---
    thIn = actx.createGain(); thIn.gain.value = 0;
    noiseSrc.connect(thIn);
    thBp = actx.createBiquadFilter();
    thBp.type = 'bandpass'; thBp.frequency.value = 105; thBp.Q.value = 2.2;
    thIn.connect(thBp); thBp.connect(seG);

    // --- ゴムのびびり（倍音を持つ帯。これが「ゴムが鳴っている」感じを作る） ---
    buzzO = actx.createOscillator(); buzzO.type = 'sawtooth'; buzzO.frequency.value = 900;
    buzzBp = actx.createBiquadFilter();
    buzzBp.type = 'bandpass'; buzzBp.frequency.value = 2400; buzzBp.Q.value = 1.3;
    buzzG = actx.createGain(); buzzG.gain.value = 0;
    buzzTrem = actx.createGain(); buzzTrem.gain.value = 0.50;
    buzzO.connect(buzzBp); buzzBp.connect(buzzG); buzzG.connect(buzzTrem); buzzTrem.connect(seG);
    try { buzzO.start(); } catch(e){}
    jitter(buzzO.frequency, 70, 1.13, 0.9);
    jitter(buzzTrem.gain, 0.42, 2.00, 1.7);

    // --- 路面を転がるうなり ---
    roarIn = actx.createGain(); roarIn.gain.value = 0;
    noiseSrc.connect(roarIn);
    roarBp = actx.createBiquadFilter();
    roarBp.type = 'bandpass'; roarBp.frequency.value = 330; roarBp.Q.value = 1.1;
    roarIn.connect(roarBp); roarBp.connect(seG);

    try { noiseSrc.start(); } catch(e){}

    // --- エンジン ---
    // 固定のフィルターで上を切ると気の抜けた音になる。回転に合わせて開かせる。
    engG = actx.createGain(); engG.gain.value = 0;
    engF = actx.createBiquadFilter();
    engF.type = 'lowpass'; engF.frequency.value = 900; engF.Q.value = 0.8;
    // 低いところを持ち上げて野太くする
    engLow = actx.createBiquadFilter();
    engLow.type = 'lowshelf'; engLow.frequency.value = 190; engLow.gain.value = 2.5;
    // 排気の共鳴。位置を動かさないので掃引（ワウ）には聞こえない
    engMid = actx.createBiquadFilter();
    engMid.type = 'peaking'; engMid.frequency.value = 820; engMid.Q.value = 1.0;
    engMid.gain.value = 5.5;
    engG.connect(engF); engF.connect(engLow); engLow.connect(engMid); engMid.connect(seG);
    // 基音だけだと薄い。下の胴鳴り・排気の歯切れ・上の倍音を重ねて厚みを出す
    var wMain = pulseWave(18, -0.80);   // 主な爆発
    var wUp   = pulseWave(8,  -0.70);   // 上の鳴き
    var PARTS = [
      // 直列4気筒は均等に爆発する＝倍数がそろった成分しか出ない。
      // 0.5倍（1回転に1度の成分）を入れると不等間隔になってV8のドロドロになる。
      { wave:wMain, type:'sawtooth', mul:1.0, det:  -3, g:1.00 },
      { wave:wMain, type:'sawtooth', mul:1.0, det:   3, g:1.00 },
      { wave:wUp,   type:'sawtooth', mul:2.0, det:   0, g:0.42 },
      { wave:null,  type:'square',   mul:2.0, det:   4, g:0.28 },
      { wave:null,  type:'sawtooth', mul:3.0, det:  -4, g:0.14 }
    ];
    for (var j = 0; j < PARTS.length; j++){
      var o = actx.createOscillator();
      if (PARTS[j].wave) { try { o.setPeriodicWave(PARTS[j].wave); } catch(e){ o.type = PARTS[j].type; } }
      else o.type = PARTS[j].type;
      o.frequency.value = 70 * PARTS[j].mul;
      o.detune.value = PARTS[j].det;
      var pg = actx.createGain(); pg.gain.value = PARTS[j].g;
      o.connect(pg); pg.connect(engG);
      try { o.start(); } catch(e){}
      engO.push(o); engMul.push(PARTS[j].mul);
    }
    // 排気のざらつき。ただ流すだけだと「サー」で終わるので、
    // 爆発に合わせて脈打たせる。完全に同じ波が繰り返されると電子音に聞こえる。
    engNz = actx.createGain(); engNz.gain.value = 0;
    noiseSrc.connect(engNz);
    engNzMod = actx.createGain(); engNzMod.gain.value = 0.48;
    engPulse = actx.createOscillator();
    if (wMain) { try { engPulse.setPeriodicWave(wMain); } catch(e){ engPulse.type = 'sawtooth'; } }
    else engPulse.type = 'sawtooth';
    engPulse.frequency.value = 70;
    var pmG = actx.createGain(); pmG.gain.value = 0.52;
    engPulse.connect(pmG); pmG.connect(engNzMod.gain);
    try { engPulse.start(); } catch(e){}
    engNzF = actx.createBiquadFilter();
    engNzF.type = 'bandpass'; engNzF.frequency.value = 1200; engNzF.Q.value = 1.1;
    engNz.connect(engNzMod); engNzMod.connect(engNzF); engNzF.connect(seG);
    // 一発ごとのばらつき。ここが無いと判で押したような繰り返しになる
    jitter(engNzMod.gain, 0.16, 3.7, 0.27);
    for (var e2 = 0; e2 < engO.length; e2++) jitter(engO[e2].detune, 11, 2.9 + e2 * 0.31, e2 * 0.4);
    // 過給機の鳴きは入れない（掃引する正弦波は「ビヨー」に聞こえる）
  }

  // ---------- 外から呼ぶもの ----------
  function init(){
    if (actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { actx = new AC(); } catch(e){ actx = null; return; }
    master = actx.createGain(); master.gain.value = vol * 0.55;
    // 曲・エンジン・鳴きが同時に大きくなると振り切れる。念のため頭を押さえる
    var lim = null;
    try {
      lim = actx.createDynamicsCompressor();
      lim.threshold.value = -4; lim.knee.value = 6; lim.ratio.value = 12;
      lim.attack.value = 0.003; lim.release.value = 0.12;
    } catch(e){ lim = null; }
    if (lim){ master.connect(lim); lim.connect(actx.destination); }
    else master.connect(actx.destination);
    musicG = actx.createGain(); musicG.gain.value = 0.42; musicG.connect(master);
    seG = actx.createGain(); seG.gain.value = 0.5; seG.connect(master);

    var sr = actx.sampleRate;
    B.kick  = buf(kickData(sr));
    B.clap  = buf(clapData(sr));
    B.hat   = buf(hatData(sr, false));
    B.hatO  = buf(hatData(sr, true));
    B.crash = buf(crashData(sr));
    B.noise = buf(noiseData(sr));
    B.jit   = buf(jitData(sr));
    B.hit   = buf(hitData(sr));
    makeLive();
    ready = true;
  }

  var lastCount = 99;

  window.WADACHI_AUDIO = {
    init: function(){
      init();
      if (actx && actx.state === 'suspended'){ try { actx.resume(); } catch(e){} }
    },
    // コース番号で曲を選ぶ
    setTrack: function(i){
      T = TRACKS[Math.max(0, Math.min(TRACKS.length - 1, i | 0))];
      SPB = 60 / T.bpm; STP = SPB / 4;
    },
    trackInfo: function(){ return { bpm: T.bpm, base: T.base }; },
    start: function(course){
      this.init();
      if (typeof course === 'number') this.setTrack(course);
      if (!ready) return;
      playing = true;
      nextStep = 0;
      nextTime = actx.currentTime + 0.08;
      lastCount = 99;
      musicG.gain.setTargetAtTime(0.42, actx.currentTime, 0.05);
    },
    stop: function(){
      if (!ready) return;
      playing = false;
      musicG.gain.setTargetAtTime(0, actx.currentTime, 0.08);
      sqIn.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      scrIn.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      thIn.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      buzzG.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      roarIn.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      engG.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      engNz.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      engLoad = 0; engPrevSp = 0;
    },
    pause: function(on){
      if (!ready) return;
      musicG.gain.setTargetAtTime(on ? 0 : 0.42, actx.currentTime, 0.06);
      if (on){
        sqIn.gain.setTargetAtTime(0, actx.currentTime, 0.04);
        scrIn.gain.setTargetAtTime(0, actx.currentTime, 0.04);
        thIn.gain.setTargetAtTime(0, actx.currentTime, 0.04);
        buzzG.gain.setTargetAtTime(0, actx.currentTime, 0.04);
        roarIn.gain.setTargetAtTime(0, actx.currentTime, 0.04);
        engG.gain.setTargetAtTime(0, actx.currentTime, 0.04);
        engNz.gain.setTargetAtTime(0, actx.currentTime, 0.04);
      }
    },
    count: function(n){
      if (!ready || n === lastCount) return;
      lastCount = n;
      if (n > 0) beep(880, 0.10, 0.5);
      else beep(1320, 0.30, 0.55);
    },
    hitWall: function(){ if (ready) one(B.hit, 0.6, 0.9 + Math.random()*0.25, seG); },
    goal: function(isNew){
      if (!ready) return;
      if (isNew) arp([440, 554.37, 659.25, 880, 1108.73], 0.075, 0.32, 0.14);
      else arp([440, 523.25, 659.25], 0.085, 0.30, 0.13);
    },
    fail: function(){ if (ready) arp([330, 277.18, 220], 0.10, 0.34, 0.13); },

    // 毎こま。走っている状態を渡す
    tick: function(st, sliding, slip, sp){
      if (!ready) return;
      pump();
      var t = actx.currentTime;
      var run = (st === 'play');
      var fast = Math.min(1, sp / 260);

      // 鳴き：滑り具合で開き、滑るほど・速いほど高くなる
      var want = 0;
      if (run && sliding) want = Math.min(0.85, 0.22 + slip * 1.5) * Math.min(1, sp / 150);
      sqIn.gain.setTargetAtTime(want, t, 0.030);
      // こすれ：滑った量そのもの。速いほど強い
      scrIn.gain.setTargetAtTime(run && sliding ? Math.min(0.62, 0.20 + slip * 1.15) * Math.min(1, sp / 110) : 0, t, 0.04);
      scrBp.frequency.setTargetAtTime(165 + Math.min(1, slip * 2.2) * 150 + fast * 105, t, 0.06);
      // びびり：ゴムが食いついては離れる振動。倍音があるので「ゴム」に聞こえる
      var bf = 500 + Math.min(1.0, slip * 2.2) * 330 + fast * 180;
      buzzO.frequency.setTargetAtTime(bf, t, 0.05);
      buzzBp.frequency.setTargetAtTime(bf * 2.6, t, 0.05);
      buzzG.gain.setTargetAtTime(run && sliding ? Math.min(0.24, 0.08 + slip * 0.49) * Math.min(1, sp / 130) : 0, t, 0.035);
      thIn.gain.setTargetAtTime(run && sliding ? Math.min(0.85, 0.30 + slip * 1.5) * Math.min(1, sp / 100) : 0, t, 0.05);
      thBp.frequency.setTargetAtTime(78 + fast * 62, t, 0.08);
      var f0 = 4600 + Math.min(1.0, slip * 2.2) * 1600 + fast * 900;
      sqBp[0].frequency.setTargetAtTime(f0, t, 0.05);
      sqBp[1].frequency.setTargetAtTime(f0 * 1.49, t, 0.05);
      sqBp[2].frequency.setTargetAtTime(f0 * 1.90, t, 0.05);

      // 路面のうなり：速度だけで決まる
      roarIn.gain.setTargetAtTime(run ? 0.07 * fast : 0, t, 0.09);
      roarBp.frequency.setTargetAtTime(270 + fast * 190, t, 0.09);

      // エンジン：速度にまっすぐ比例させると間延びするので、変速を模して回転を上下させる
      var gi = 0;
      while (gi < GEARS.length - 1 && fast >= GEARS[gi + 1]) gi++;
      var glo = GEARS[gi], ghi = (gi + 1 < GEARS.length) ? GEARS[gi + 1] : 1.0;
      var rev = 0.16 + 0.84 * Math.min(1, Math.max(0, (fast - glo) / Math.max(0.01, ghi - glo)));
      // 踏み込み具合は速度の増え方から見る。滑っている間は踏んでいるものとして扱う
      var dsp = (sp - engPrevSp) * 60;
      engPrevSp = sp;
      var load = Math.max(0, Math.min(1, dsp / 90));
      if (sliding) load = Math.max(load, 0.55);
      engLoad += (load - engLoad) * 0.15;

      // 爆発の間隔。下を 26Hz まで落とすと一発ずつが粒として聞こえる（ドロドロ）
      var ef = 30 + rev * 245;
      for (var i = 0; i < engO.length; i++)
        engO[i].frequency.setTargetAtTime(ef * engMul[i], t, 0.05);
      engF.frequency.setTargetAtTime(380 + rev * 2400 + engLoad * 900, t, 0.07);
      engG.gain.setTargetAtTime(run ? (0.091 + engLoad * 0.081 + rev * 0.048) : 0, t, 0.08);
      engPulse.frequency.setTargetAtTime(ef, t, 0.05);
      engNz.gain.setTargetAtTime(run ? (0.26 + engLoad * 0.42) : 0, t, 0.08);
      engNzF.frequency.setTargetAtTime(820 + rev * 1900, t, 0.07);

    },
    setVol: function(v){
      vol = Math.max(0, Math.min(1, v));
      if (master) master.gain.value = vol * 0.55;
      try { localStorage.setItem('wadachi.vol', String(Math.round(vol * 100))); } catch(e){}
    },
    getVol: function(){
      try {
        var s = localStorage.getItem('wadachi.vol');
        if (s !== null) vol = Math.max(0, Math.min(1, parseInt(s, 10) / 100));
      } catch(e){}
      return vol;
    }
  };
})();
</script>

<script>
// ===== 順位表（みんなで共有）=====
// 送るのは「ゲーム名・入力した名前・点数」だけ。ほかは送らない。
(function(){
  var API = 'https://game-scores.pdylplplp.workers.dev';
  var box = document.getElementById('lbBox');
  if (!box) return;
  var KEY = 'score.name';

  var unit = '';
  var myName = '';
  try { myName = localStorage.getItem(KEY) || ''; } catch(e){}

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  function fmt(v){ return (Math.round(v * 100) / 100).toLocaleString('ja-JP'); }

  function listHTML(list, top){
    if (!list || !list.length) return '<div class="lb-msg">まだ誰も出していません</div>';
    var out = '<ol>';
    for (var i = 0; i < Math.min(list.length, top || 5); i++){
      var e = list[i];
      out += '<li' + (myName && e.n === myName ? ' class="me"' : '') + '>'
           + '<span class="p">' + (i+1) + '</span>'
           + '<span class="n">' + esc(e.n) + '</span>'
           + '<span class="s">' + fmt(e.s) + unit + '</span></li>';
    }
    return out + '</ol>';
  }

  // 題字の画面：上位だけ見せる
  function showTop(game){
    box.classList.remove('hide');
    box.innerHTML = '<div class="lb-t">ミンナノ ジュンイ</div><div class="lb-msg">読み込み中…</div>';
    fetch(API + '/board?game=' + encodeURIComponent(game), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.error) throw new Error(d.error);
        unit = d.unit || '';
        box.innerHTML = '<div class="lb-t">ミンナノ ジュンイ</div>' + listHTML(d.list, 5);
      })
      .catch(function(){
        box.innerHTML = '<div class="lb-t">ミンナノ ジュンイ</div>'
                      + '<div class="lb-msg">いまは見られません</div>';
      });
  }

  // 遊び終わり：名前を入れて送る
  function showSubmit(game, score){
    box.classList.remove('hide');
    box.innerHTML =
      '<div class="lb-t">ジュンイヒョウ ニ オクル</div>'
      + '<div class="lb-form">'
      +   '<input id="lbName" type="text" maxlength="12" placeholder="ニックネーム" '
      +     'value="' + esc(myName) + '" autocomplete="off">'
      +   '<button id="lbSend" type="button">送る</button>'
      + '</div>'
      + '<div class="lb-warn">本名は入れないでください。12文字まで。</div>'
      + '<div class="lb-msg" id="lbMsg"></div>';

    var inp = document.getElementById('lbName');
    var btn = document.getElementById('lbSend');
    var msg = document.getElementById('lbMsg');

    btn.addEventListener('click', function(){
      var nm = (inp.value || '').trim();
      if (!nm){ msg.textContent = '名前を入れてください'; msg.className = 'lb-msg ng'; inp.focus(); return; }
      // 送る前に覚える。通信が失敗しても名前が消えないように
      myName = nm;
      try { localStorage.setItem(KEY, myName); } catch(e){}
      btn.disabled = true;
      msg.className = 'lb-msg';
      msg.textContent = '送っています…';
      fetch(API + '/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify({ game: game, name: nm, score: score })
      }).then(function(r){ return r.json(); }).then(function(d){
        if (d.error){
          msg.textContent = d.error; msg.className = 'lb-msg ng';
          btn.disabled = false; return;
        }
        myName = d.name;
        try { localStorage.setItem(KEY, myName); } catch(e){}
        box.innerHTML = '<div class="lb-t">'
          + (d.inTop ? d.rank + 'イ' : d.rank + 'イ（20イ マデ ノラナイ）') + '</div>'
          + listHTML(d.list, 5);
      }).catch(function(){
        msg.textContent = '送れませんでした。あとでもう一度。';
        msg.className = 'lb-msg ng';
        btn.disabled = false;
      });
    });

    inp.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && !e.isComposing) btn.click();
    });
  }

  window.SCOREBOARD = {
    top: showTop,
    over: showSubmit,
    hide: function(){ box.classList.add('hide'); }
  };
})();
</script>

<script>
(function(){
  'use strict';

  var W = 240, H = 360;                 // 画面に映る広さ（せまくして車を大きく見せる）
  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');

  var stage = document.getElementById('stage');
  var dash  = document.getElementById('dash');
  var glow  = document.getElementById('glow');
  var countEl = document.getElementById('count');
  var countN  = document.getElementById('countN');
  var veil  = document.getElementById('veil');
  var veilTitle = document.getElementById('veilTitle');
  var veilBody  = document.getElementById('veilBody');
  var goBtn = document.getElementById('goBtn');
  var vTime = document.getElementById('vTime');
  var vBest = document.getElementById('vBest');
  var vDrift = document.getElementById('vDrift');
  var vSpd  = document.getElementById('vSpd');
  var progBar = document.getElementById('progBar');
  var tabsEl  = document.getElementById('tabs');

  var COL = {
    ground:'#0E1015', groundDot:'#171A22',
    road:'#22242B', edge:'#D9D5C8', center:'#5E5B54',
    mark:'rgba(0,0,0,0.6)',
    body:'#F0873A', bodyDark:'#8A421A', roof:'#241A12',
    lamp:'rgba(255,224,170,0.14)', lampCore:'#FFE9BC',
    smoke:'rgba(198,198,206,0.26)',
    wall:'#3A2E26'
  };

  // ---------- 車の性能 ----------
  var ACCEL = 155, MAXS = 244, TURN = 3.8;
  var GRIP = 2.0;        // 横に戻ろうとする強さ（小さいほど滑る）
  var SPEEDSLIP = 0.62;  // 速いときにどれだけグリップが落ちるか
  var PEAK = 105;        // 踏ん張りがいちばん強くなる横速度。ここを越えると落ちる
  var TAIL = 0.30;       // 振りきったときに残る踏ん張り（0だと戻らなくなる）
  var STEERUP = 8.0;     // ハンドルが切れていく速さ（大きいほど即座に最大舵角）
  var STEERDN = 11.0;    // 戻す速さ
  var HOLD = 0.58;       // ハンドルを切り続けたとき、どれだけ後ろが出るか（荷重移動）
  var SCRUB = 0.62;      // 滑るとスピードが落ちる量。ブレーキの代わり
  var HALF = 44;         // 道のはばの半分（道はば88 ＝ 車 約3.4台ぶん）
  var WALL = 28;         // 路肩の外、ここまで出ると壁

  // ---------- コース（直線と、半径を指定したカーブの列）----------
  // S=直線(長さ) / L=左カーブ(半径,角度) / R=右カーブ(半径,角度)
  var COURSES = [
    { name:'杉ノ沢', tag:'バランス', segs:[
      ['S',300],['L',175,55],['S',150],['R',62,168],['S',230],
      ['L',125,72],['R',125,72],['S',150],['L',210,84],['S',250],
      ['R',66,172],['S',300],['L',150,62],['R',150,62],['S',170],
      ['L',88,124],['S',210],['R',215,76],['S',240],['L',64,176],['S',430]
    ]},
    { name:'鷹ノ巣', tag:'高速・長い', segs:[
      ['S',520],['L',260,62],['S',380],['R',300,70],['S',300],
      ['L',230,95],['S',440],['R',240,80],['S',260],['L',74,170],
      ['S',520],['R',280,72],['S',360],['L',260,66],['S',560]
    ]},
    { name:'蛇骨', tag:'ヘアピン連続', segs:[
      ['S',210],['R',58,175],['S',130],['L',60,170],['S',150],
      ['R',72,140],['L',72,140],['S',120],['R',56,178],['S',170],
      ['L',84,120],['S',110],['R',64,165],['S',140],['L',58,172],
      ['S',190],['R',92,110],['S',130],['L',66,160],['S',280]
    ]}
  ];
  var courseIdx = 0;
  var TRACK = [], TRACKLEN = 0, STEP = 7;

  function buildTrack(){
    var COURSE = COURSES[courseIdx].segs;
    TRACK.length = 0;
    var x = 0, y = 0, a = 0, d = 0;      // a: 進行方向（0=上, 正=右回り）
    function push(){
      TRACK.push({ x:x, y:y, a:a, d:d, nx:Math.cos(a), ny:Math.sin(a) });
    }
    push();
    for (var i=0;i<COURSE.length;i++){
      var sg = COURSE[i];
      if (sg[0] === 'S') {
        var n = Math.max(1, Math.round(sg[1]/STEP));
        for (var j=0;j<n;j++){
          x += Math.sin(a)*STEP; y += -Math.cos(a)*STEP; d += STEP; push();
        }
      } else {
        var rad = sg[1], deg = sg[2] * Math.PI/180;
        var len = rad * deg;
        var n2 = Math.max(2, Math.round(len/STEP));
        var dA = (sg[0]==='R' ? deg : -deg) / n2;
        for (var k=0;k<n2;k++){
          a += dA;
          x += Math.sin(a)*STEP; y += -Math.cos(a)*STEP; d += STEP; push();
        }
      }
    }
    TRACKLEN = d;
    buildCheckpoints();
  }
  buildTrack();

  // 車に一番近いコース上の点を、前回の位置の近くから探す
  // 現在地は「前のコマの位置のすぐ近く」からしか探さない。
  // 広く探すと、ヘアピンで折り返した先の道へ飛び移れてしまう（＝ショートカット）
  function nearest(px, py, from){
    var lo = Math.max(0, from-12), hi = Math.min(TRACK.length-1, from+4);
    var bi = from, bd = 1e9, i, dx, dy, dd;
    for (i=lo;i<=hi;i++){
      dx = TRACK[i].x - px; dy = TRACK[i].y - py; dd = dx*dx + dy*dy;
      if (dd < bd) { bd = dd; bi = i; }
    }
    return bi;
  }

  // ---------- 関門（道を横切る線。順番にくぐらないとゴールと認めない）----------
  // 番号だけで見ると、ヘアピンの内側を突っ切っても「通った」ことになってしまう。
  // 関門の線を、道幅の中で、手前から先へ越えたときだけ通過と数える。
  var GATES = [], nextGate = 0, gatePrevS = null;
  function buildCheckpoints(){
    GATES = [];
    for (var c = 20; c < TRACK.length - 12; c += 22) GATES.push(TRACK[c]);
  }
  function checkGate(){
    if (nextGate >= GATES.length) return;
    var g = GATES[nextGate];
    var dx = car.x - g.x, dy = car.y - g.y;
    var sAlong = dx * Math.sin(g.a) + dy * (-Math.cos(g.a));   // 関門の手前か先か
    var tSide  = dx * g.nx + dy * g.ny;                        // 関門の左右のずれ
    if (gatePrevS !== null && gatePrevS < 0 && sAlong >= 0 && Math.abs(tSide) <= HALF + WALL + 6) {
      nextGate++; gatePrevS = null;                            // くぐった
    } else {
      gatePrevS = sAlong;
    }
  }

  // ---------- 大きさ ----------
  var dpr = 1, scale = 1, lastW = 0, lastH = 0;
  function layout(){
    var r = stage.getBoundingClientRect();
    var availW = (r.width  > 0 ? r.width  : 340) - 4;
    var availH = (r.height > 0 ? r.height : 520) - 44;
    var w = Math.min(availW, 380), h = w * H / W;
    if (h > availH) { h = availH; w = h * W / H; }
    if (!(w > 40)) { w = 280; h = w * H / W; }
    w = Math.round(w); h = Math.round(h);
    if (w === lastW && h === lastH) return;
    lastW = w; lastH = h;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    cv.width  = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    scale = w / W;
    ctx.setTransform(scale*dpr, 0, 0, scale*dpr, 0, 0);
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  try { new ResizeObserver(layout).observe(stage); } catch(e){}

  // ---------- 状態 ----------
  var st = 'title';                      // title / count / play / done / pause
  var car = { x:0, y:0, ang:0, vx:0, vy:0 };
  var camX = 0, camY = 0;
  var idx = 0, time = 0, best = 0, countT = 0;
  var score = 0, pending = 0, mult = 1, driftT = 0, idleT = 0, sliding = false;
  var marks = [], smoke = [], lastWheels = null, hitT = 0, stuckT = 0, holdT = 0, steerV = 0;
  var lastSlip = 0, lastSp = 0;          // 音に渡す用（sp は step() の中だけの変数なので写す）

  // ---------- ゴースト（自己ベストの走りを並走させる） ----------
  var GH_DT = 0.05;                    // 0.05秒ごとに位置を控える（毎秒20回）
  var rec = [];                        // いま走っている記録 x,y,向き,通過点
  var ghost = null;                    // 手本にする記録
  var ghosts = [null,null,null];
  var ghostT = [0,0,0];                // その手本を出したときのタイム
  // 0=切 1=自己ベスト 2=順位表1位
  var ghostMode = 1;
  var topG = [null,null,null];         // 順位表1位の走り {name, score, arr}
  var GAPI = 'https://game-scores.pdylplplp.workers.dev';
  var GCOL  = { body:'#5FD3E0', lampCore:'#CFEFF5' };   // 自分のベスト
  var GCOL2 = { body:'#E8C07A', lampCore:'#FFEBC4' };   // 1位の人

  function loadGhosts(){
    for (var i=0;i<3;i++){
      try {
        var v = localStorage.getItem('wadachi.ghost.' + i);
        ghosts[i] = v ? JSON.parse(v) : null;
        if (ghosts[i] && (!ghosts[i].length || ghosts[i].length % 4)) ghosts[i] = null;
        ghostT[i] = parseFloat(localStorage.getItem('wadachi.ghostT.' + i)) || 0;
      } catch(e){ ghosts[i] = null; ghostT[i] = 0; }
    }
    try {
      var m = localStorage.getItem('wadachi.ghostMode');
      if (m !== null) ghostMode = Math.max(0, Math.min(2, parseInt(m, 10) || 0));
      else if (localStorage.getItem('wadachi.ghostOn') === '0') ghostMode = 0;
    } catch(e){}
  }
  function saveGhost(t){
    ghosts[courseIdx] = rec.slice();
    ghostT[courseIdx] = Math.round(t * 1000) / 1000;
    try {
      localStorage.setItem('wadachi.ghost.' + courseIdx, JSON.stringify(ghosts[courseIdx]));
      localStorage.setItem('wadachi.ghostT.' + courseIdx, String(ghostT[courseIdx]));
    } catch(e){}                       // 入りきらなくても走行そのものは止めない
  }
  // いま並走させる手本と、その色・持ち主
  function curGhost(){
    if (ghostMode === 2) {
      var t = topG[courseIdx];
      return t ? { arr: t.arr, col: GCOL2, who: t.name, time: t.score } : null;
    }
    if (ghostMode === 1 && ghosts[courseIdx]) {
      return { arr: ghosts[courseIdx], col: GCOL, who: '自己ベスト', time: ghostT[courseIdx] };
    }
    return null;
  }

  // 手本の t 秒時点の姿。終わっていれば null
  function ghostPose(t){
    if (!ghost) return null;
    var n = ghost.length / 4;
    var f = t / GH_DT, i = Math.floor(f);
    if (i < 0) i = 0;
    if (i >= n - 1) return null;
    var u = f - i, a = i*4, b = a + 4;
    var da = ghost[b+2] - ghost[a+2];
    while (da >  Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    return { x: ghost[a] + (ghost[b] - ghost[a]) * u,
             y: ghost[a+1] + (ghost[b+1] - ghost[a+1]) * u,
             ang: ghost[a+2] + da * u };
  }
  // 手本が、いまの自分と同じ地点を通ったのは何秒のときか
  function ghostTimeAt(gi){
    if (!ghost) return -1;
    var n = ghost.length / 4, lo = 0, hi = n - 1;
    if (ghost[3] > gi) return 0;
    if (ghost[(n-1)*4 + 3] < gi) return -1;
    while (lo < hi){
      var mid = (lo + hi) >> 1;
      if (ghost[mid*4 + 3] < gi) lo = mid + 1; else hi = mid;
    }
    return lo * GH_DT;
  }

  // 送るときは整数だけの文字列にする（向きは100倍して整数に）
  function packRec(a){
    var o = [];
    for (var i = 0; i < a.length; i += 4){
      o.push(Math.round(a[i]), Math.round(a[i+1]), Math.round(a[i+2]*100), a[i+3]);
    }
    return o.join(',');
  }
  function unpackRec(str){
    if (typeof str !== 'string' || !str) return null;
    var p = str.split(','), o = [];
    if (p.length < 8 || p.length % 4) return null;
    for (var i = 0; i < p.length; i += 4){
      var x = parseFloat(p[i]), y = parseFloat(p[i+1]);
      var g = parseFloat(p[i+2]), k = parseInt(p[i+3], 10);
      if (!isFinite(x) || !isFinite(y) || !isFinite(g) || !isFinite(k)) return null;
      o.push(x, y, g/100, k);
    }
    return o;
  }
  function myName(){
    try { return localStorage.getItem('score.name') || ''; } catch(e){ return ''; }
  }
  function gameKey(){ return 'wadachi-' + (courseIdx + 1); }

  // 順位表1位の走りを取りに行く（つながらなくても遊べる）
  function fetchTop(i){
    var key = 'wadachi-' + (i + 1);
    try {
      fetch(GAPI + '/ghost?game=' + encodeURIComponent(key), { cache:'no-store' })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          if (!d || d.none) { topG[i] = null; return; }
          var arr = unpackRec(d.data);
          topG[i] = arr ? { name: d.name, score: d.score, arr: arr } : null;
          if (i === courseIdx && (st === 'title' || st === 'done')) showTitle2();
        })
        .catch(function(){});
    } catch(e){}
  }
  // 1位より速ければ走りを預ける
  function sendGhost(t){
    var nm = myName();
    if (!nm) return;                       // 名前を出していない人は送らない
    var cur = topG[courseIdx];
    if (cur && t >= cur.score) return;     // 1位より遅いなら送らない
    var data = packRec(rec);
    if (!data || data.length > 120000) return;
    var key = gameKey(), i = courseIdx;
    try {
      fetch(GAPI + '/ghost', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: key, name: nm, score: t, data: data })
      }).then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){ if (d && d.ok) fetchTop(i); })
        .catch(function(){});
    } catch(e){}
  }

  // 走り方（タイヤの踏ん張りの式）を変えたので、古い決まりで出した記録は
  // 一度だけ消す。名前と音量は残す。
  var RULES = '2';
  function resetIfOldRules(){
    try {
      if (localStorage.getItem('wadachi.rules') === RULES) return false;
      for (var i = 0; i < 3; i++){
        localStorage.removeItem('wadachi.time.' + i);
        localStorage.removeItem('wadachi.ghost.' + i);
        localStorage.removeItem('wadachi.ghostT.' + i);
      }
      localStorage.setItem('wadachi.rules', RULES);
      return true;
    } catch(e){ return false; }
  }

  var bests = [0,0,0];
  function loadBest(){
    try {
      for (var i=0;i<3;i++){ var v = localStorage.getItem('wadachi.time.'+i); if (v) bests[i] = parseFloat(v)||0; }
    } catch(e){}
    best = bests[courseIdx];
    loadGhosts();
    ghost = ghosts[courseIdx];
  }
  function saveBest(){
    bests[courseIdx] = best;
    try { localStorage.setItem('wadachi.time.'+courseIdx, String(best)); } catch(e){}
  }
  function fmt(t){ return t.toFixed(2); }

  function reset(){
    var s0 = TRACK[0];
    car.x = s0.x; car.y = s0.y; car.ang = s0.a; car.vx = 0; car.vy = 0;
    camX = car.x - W/2; camY = car.y - H/2;
    idx = 0; time = 0;
    nextGate = 0; gatePrevS = null;
    score = 0; pending = 0; mult = 1; driftT = 0; idleT = 0; sliding = false;
    marks.length = 0; smoke.length = 0; lastWheels = null; hitT = 0; stuckT = 0; holdT = 0; steerV = 0;
    lastSlip = 0; lastSp = 0;
    rec.length = 0;
  }
  function startGame(){ if (window.SCOREBOARD) SCOREBOARD.hide();
    if (window.WADACHI_AUDIO) WADACHI_AUDIO.start(courseIdx);
    reset(); st = 'count'; countT = 3.2; countEl.classList.remove('off'); veil.classList.add('off'); lastT = 0; }
  var wiped = false;
  function showTitle(){
    st = 'title'; reset();
    if (window.WADACHI_AUDIO) WADACHI_AUDIO.stop();
    if (window.SCOREBOARD) SCOREBOARD.top('wadachi-' + (courseIdx + 1));

    veilBody.innerHTML = '<span class="course">' + c.name + '　<em>' + c.tag + '　全長 ' + Math.round(TRACKLEN) + '</em></span><br>' +
      '左右だけ。アクセルは自動、ブレーキは無い。<br>' +
      'ヘアピンは曲がりきれない。<br><b>滑らせて速度を落とす</b>のが唯一の減速。<br>' +
      '<span class="gh">' + ghostLine() + '</span>' +
      (wiped ? '<br><span class="gh" style="color:#F0873A">走り方を変えたので、前の決まりで出した記録は消しました</span>' : '');
    goBtn.textContent = 'スタート';
    veil.classList.remove('off');
    countEl.classList.add('off');
  }
  function finish(miss){
    st = 'done';
    bank();
    if (miss > 0) {                       // 通過点を飛ばしている＝ショートカット
      if (window.WADACHI_AUDIO) { WADACHI_AUDIO.stop(); WADACHI_AUDIO.fail(); }
      veilTitle.textContent = 'SHORTCUT';
      veilBody.innerHTML = '<span class="course">' + COURSES[courseIdx].name + '</span><br>' +
        '<span class="big">' + fmt(time) + '</span><br>' +
        '<span class="sub" style="color:#E0453A">タイム無効　関門を ' + miss + ' 箇所 くぐっていません</span>';
      goBtn.textContent = 'もういちど';
      veil.classList.remove('off');
      countEl.classList.add('off');
      return;
    }
    if (window.SCOREBOARD) SCOREBOARD.over('wadachi-' + (courseIdx + 1), time);
    var isNew = (best === 0 || time < best);
    if (isNew) { best = time; saveBest(); }
    // 手本がまだ無ければ、ベスト更新でなくてもこの1本を手本にする。
    // そうしないと、すでにベストを持っている人には永久にゴーストが出ない。
    if (isNew || !ghosts[courseIdx]) { saveGhost(time); ghost = ghosts[courseIdx]; }
    sendGhost(time);
    if (window.WADACHI_AUDIO) { WADACHI_AUDIO.stop(); WADACHI_AUDIO.goal(isNew); }
    veilTitle.textContent = 'GOAL';
    veilBody.innerHTML = '<span class="course">' + COURSES[courseIdx].name + '</span><br>' +
      '<span class="big">' + fmt(time) + '</span><br>' +
      '<span class="sub">' + (isNew ? 'NEW BEST' : 'BEST ' + fmt(best)) + '</span><br>' +
      'ドリフト ' + score.toLocaleString('ja-JP') + ' 点';
    goBtn.textContent = 'もういちど';
    veil.classList.remove('off');
    countEl.classList.add('off');
  }
  function setPause(on){
    if (window.WADACHI_AUDIO) WADACHI_AUDIO.pause(on);
    if (on) { st = 'pause'; veilTitle.textContent = 'PAUSE'; veilBody.innerHTML = 'ひとやすみ'; goBtn.textContent = 'つづける'; veil.classList.remove('off'); }
    else { st = 'play'; veil.classList.add('off'); lastT = 0; }
  }
  function setCourse(i){
    courseIdx = i;
    buildTrack();
    best = bests[courseIdx];
    ghost = ghosts[courseIdx];
    if (!topG[courseIdx]) fetchTop(courseIdx);
    var btns = tabsEl.getElementsByTagName('button');
    for (var k=0;k<btns.length;k++) btns[k].classList.toggle('on', k === courseIdx);
    prev = {};
    showTitle();
  }
  tabsEl.addEventListener('click', function(e){
    var b = e.target;
    while (b && b !== tabsEl && !b.getAttribute('data-c')) b = b.parentNode;
    if (b && b !== tabsEl) setCourse(parseInt(b.getAttribute('data-c'), 10));
  });

  var ghBtn = document.getElementById('ghBtn');
  var GHLABEL = ['GHOST 切', 'GHOST 自己', 'GHOST 1位'];
  function syncGh(){
    if (!ghBtn) return;
    ghBtn.textContent = GHLABEL[ghostMode];
    ghBtn.classList.toggle('on', ghostMode !== 0);
    ghBtn.classList.toggle('top', ghostMode === 2);
    ghBtn.setAttribute('aria-pressed', ghostMode !== 0 ? 'true' : 'false');
    ghBtn.title = ['ゴーストを出さない', '自己ベストと並走', '順位表1位と勝負'][ghostMode];
  }
  function toggleGh(){
    ghostMode = (ghostMode + 1) % 3;
    try { localStorage.setItem('wadachi.ghostMode', String(ghostMode)); } catch(e){}
    syncGh();
    if (st === 'title' || st === 'done') showTitle2();
  }
  if (ghBtn) ghBtn.addEventListener('click', toggleGh);

  var volSl = document.getElementById('volSl');
  if (volSl && window.WADACHI_AUDIO){
    volSl.value = Math.round(WADACHI_AUDIO.getVol() * 100);
    volSl.addEventListener('input', function(){ WADACHI_AUDIO.setVol(volSl.value / 100); });
  }
  goBtn.addEventListener('click', function(){ if (st === 'pause') setPause(false); else startGame(); });

  // ---------- そうさ（左右だけ） ----------
  var keys = {}, touchDir = 0;
  window.addEventListener('keydown', function(e){
    var k = e.key;
    if (k === ' ' || k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') e.preventDefault();
    keys[k] = true;
    if (k === ' ' || k === 'Enter') {
      if (st === 'title' || st === 'done') startGame();
      else if (st === 'pause') setPause(false);
    }
    if (k === 'p' || k === 'P') { if (st === 'play') setPause(true); else if (st === 'pause') setPause(false); }
    if (k === 'g' || k === 'G') toggleGh();
  });
  window.addEventListener('keyup', function(e){ keys[e.key] = false; });
  window.addEventListener('blur', function(){ keys = {}; touchDir = 0; });

  function touchAt(e){
    var r = cv.getBoundingClientRect();
    touchDir = ((e.clientX - r.left) / r.width < 0.5) ? -1 : 1;
  }
  cv.addEventListener('pointerdown', function(e){
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    touchAt(e);
  });
  cv.addEventListener('pointermove', function(e){ if (e.buttons) touchAt(e); });
  cv.addEventListener('pointerup', function(){ touchDir = 0; });
  cv.addEventListener('pointercancel', function(){ touchDir = 0; });
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  function steerDir(){
    var d = 0;
    if (keys['ArrowLeft']  || keys['a'] || keys['A']) d -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) d += 1;
    if (d === 0) d = touchDir;
    return d;
  }

  function bank(){
    if (pending > 0) score += Math.round(pending * mult);
    pending = 0; mult = 1; driftT = 0;
  }

  // ---------- 1コマ ----------
  function step(dt){
    if (st === 'count') {
      countT -= dt;
      if (window.WADACHI_AUDIO) WADACHI_AUDIO.count(Math.max(0, Math.ceil(countT - 0.2)));
      if (countT <= 0) { st = 'play'; countEl.classList.add('off'); }
      return;
    }
    if (st !== 'play') return;

    time += dt;

    var d = steerDir();
    var sp = Math.hypot(car.vx, car.vy);
    // 切り続けるほど後ろが出る。戻すと素早く収まる
    if (d !== 0) holdT = Math.min(1, holdT + dt*1.7); else holdT = Math.max(0, holdT - dt*2.8);
    // ハンドルは一気にではなく、押している長さに応じて切れていく
    var rate = (d === 0 || d * steerV < 0) ? STEERDN : STEERUP;
    steerV += (d - steerV) * Math.min(1, rate * dt);
    car.ang += steerV * TURN * Math.max(0.32, Math.min(1, sp/70)) * dt;  // 止まっていても向きは変えられる

    var fx = Math.sin(car.ang), fy = -Math.cos(car.ang);
    var rx = Math.cos(car.ang), ry = Math.sin(car.ang);
    var fwd = car.vx*fx + car.vy*fy;
    var lat = car.vx*rx + car.vy*ry;

    // コース上のどこにいるか
    idx = nearest(car.x, car.y, idx);
    var sN = TRACK[idx];
    var offv = (car.x - sN.x)*sN.nx + (car.y - sN.y)*sN.ny;   // 中心からの横ずれ
    var off = Math.abs(offv) - HALF;
    var onRoad = off < 0;

    // 前へ
    fwd += ACCEL * dt;
    fwd -= fwd * (onRoad ? 0.16 : 1.1) * dt;
    if (fwd > MAXS) fwd = MAXS;
    // 滑ったぶんの減速＝これが唯一の減速。
    // 前向きの速度からだけ引くと、真横を向いた（前向きが0の）ときに減速が
    // 効かなくなり、勢いを保ったまま向きだけ戻って かえって速くなる。
    // 前向きで引ききれないぶんは、横向きの勢いから削る。
    var loss = Math.abs(lat) * SCRUB * dt;
    var take = Math.min(Math.max(0, fwd), loss);
    fwd -= take;
    if (fwd < 0) fwd = 0;
    var rest = loss - take;
    if (rest > 0){
      var cut = Math.min(Math.abs(lat), rest);
      lat -= (lat > 0 ? cut : -cut);
    }

    // 横のグリップ
    // タイヤの踏ん張りは PEAK でいちばん強く、そこを越えると落ちていく。
    // 横速度に比例させ続けると、大きく振るほど強く引き戻されて速くなってしまう。
    var fast = 1 - SPEEDSLIP * Math.min(1, sp / MAXS);
    var grip = GRIP * fast * (1 - HOLD*holdT) * (onRoad ? 1 : 0.5);
    var la = Math.abs(lat);
    var curve = la <= PEAK ? la : Math.max(PEAK * TAIL, PEAK * PEAK / la);
    var dLat = Math.min(la, grip * curve * dt);
    lat -= (lat > 0 ? dLat : -dLat);

    car.vx = fx*fwd + rx*lat;
    car.vy = fy*fwd + ry*lat;
    car.x += car.vx * dt;
    car.y += car.vy * dt;

    // 壁
    if (off > WALL) {
      var sgn = offv > 0 ? 1 : -1;
      // 壁の内側へ少し戻す（ちょうどの位置に置くと張り付く）
      car.x = sN.x + sN.nx * sgn * (HALF + WALL - 7);
      car.y = sN.y + sN.ny * sgn * (HALF + WALL - 7);
      // 壁へ向かう成分だけ消す。前へ進む成分は残すので、壁ぞいに流れて復帰できる
      var vn = car.vx*sN.nx + car.vy*sN.ny;
      if (vn * sgn > 0) { car.vx -= sN.nx * vn; car.vy -= sN.ny * vn; }
      car.vx *= 0.72; car.vy *= 0.72;
      hitT = 0.35;
      if (window.WADACHI_AUDIO) WADACHI_AUDIO.hitWall();
      pending = 0; mult = 1; driftT = 0;
      for (var i=0;i<8;i++) smoke.push({ x:car.x, y:car.y, r:4+Math.random()*7, life:1 });
    }
    if (hitT > 0) hitT -= dt;

    // どうにも動けなくなったら、コースの中心へ戻して立て直す
    if (Math.hypot(car.vx, car.vy) < 16) stuckT += dt; else stuckT = 0;
    if (stuckT > 1.1) {
      stuckT = 0;
      car.x = sN.x; car.y = sN.y; car.ang = sN.a;
      car.vx = Math.sin(sN.a)*55; car.vy = -Math.cos(sN.a)*55;
      hitT = 0.5;
    }

    // 滑り具合
    sp = Math.hypot(car.vx, car.vy);
    lastSp = sp;
    var slip = Math.abs(Math.atan2(lat, Math.max(18, fwd)));
    lastSlip = slip;
    sliding = (slip > 0.18 && sp > 80 && onRoad);

    if (sliding) {
      driftT += dt; idleT = 0;
      mult = Math.min(8, 1 + Math.floor(driftT / 1.5));
      pending += slip * sp * dt * 1.6;
    } else {
      idleT += dt;
      if (pending > 0 && idleT > 0.4) bank();
    }

    // 轍と煙
    // 新しい車の後輪の位置（左右13.8・後ろ18）に合わせる
    var wl = { x: car.x - rx*13.8 - fx*18, y: car.y - ry*13.8 - fy*18 };
    var wr = { x: car.x + rx*13.8 - fx*18, y: car.y + ry*13.8 - fy*18 };
    if (Math.abs(lat) > 34) {
      if (lastWheels) {
        marks.push({ x1:lastWheels.l.x, y1:lastWheels.l.y, x2:wl.x, y2:wl.y });
        marks.push({ x1:lastWheels.r.x, y1:lastWheels.r.y, x2:wr.x, y2:wr.y });
        while (marks.length > 1400) marks.shift();
      }
      if (Math.random() < dt*30) smoke.push({ x:(wl.x+wr.x)/2, y:(wl.y+wr.y)/2, r:3+Math.random()*5, life:1 });
      lastWheels = { l:wl, r:wr };
    } else lastWheels = null;

    for (var s=smoke.length-1;s>=0;s--){
      var sm = smoke[s];
      sm.r += 20*dt; sm.life -= dt*1.2;
      if (sm.life <= 0) smoke.splice(s,1);
    }

    checkGate();

    // ゴーストのために位置を控える（0.05秒ごと）
    while (rec.length / 4 * GH_DT <= time && rec.length < 4 * 4000) {
      rec.push(Math.round(car.x*10)/10, Math.round(car.y*10)/10,
               Math.round(car.ang*1000)/1000, idx);
    }

    // ゴール（関門を全部くぐっているか確認する）
    if (idx >= TRACK.length - 3) finish(GATES.length - nextGate);

    // 画面の追従（速度のぶんだけ先を見る）
    var tx = car.x + car.vx*0.42 - W/2;
    var ty = car.y + car.vy*0.42 - H/2;
    var k = Math.min(1, 6.5*dt);
    camX += (tx - camX) * k;
    camY += (ty - camY) * k;
  }

  // ---------- 絵 ----------
  function visibleRuns(){
    var cx = camX + W/2, cy = camY + H/2, lim = (W+H)/2 + 140;
    var runs = [], cur = null;
    for (var i=0;i<TRACK.length;i++){
      var s = TRACK[i];
      if (Math.abs(s.x-cx) < lim && Math.abs(s.y-cy) < lim) {
        if (!cur) { cur = []; runs.push(cur); }
        cur.push(s);
      } else cur = null;
    }
    return runs;
  }

  function strokeRuns(runs, width, color, dash){
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
    for (var r=0;r<runs.length;r++){
      var run = runs[r];
      if (run.length < 2) continue;
      // 破線は道の始点からの距離に合わせる（画面が動いても模様がずれない）
      ctx.lineDashOffset = dash ? run[0].d : 0;   // 符号に注意。マイナスだと逆に2倍ずれる
      ctx.beginPath();
      ctx.moveTo(run[0].x - camX, run[0].y - camY);
      for (var i=1;i<run.length;i++) ctx.lineTo(run[i].x - camX, run[i].y - camY);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  function draw(){
    ctx.fillStyle = COL.ground;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = COL.groundDot;
    for (var g=0; g<44; g++){
      var gx = (((g*137) % 400) - camX*0.35) % 400, gy = (((g*211) % 400) - camY*0.35) % 400;
      gx = ((gx % 400)+400)%400; gy = ((gy % 400)+400)%400;
      if (gx < W && gy < H) ctx.fillRect(gx, gy, 2, 2);
    }

    var runs = visibleRuns();
    strokeRuns(runs, (HALF+WALL)*2, COL.wall);       // 路肩
    strokeRuns(runs, HALF*2 + 5, COL.edge);          // 白線
    strokeRuns(runs, HALF*2, COL.road);              // 路面

    // 轍
    if (marks.length) {
      ctx.strokeStyle = COL.mark; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath();
      for (var m=0;m<marks.length;m++){
        var mk = marks[m];
        var sx = mk.x1 - camX, sy = mk.y1 - camY;
        if (sx < -50 || sx > W+50 || sy < -50 || sy > H+50) continue;
        ctx.moveTo(sx, sy); ctx.lineTo(mk.x2 - camX, mk.y2 - camY);
      }
      ctx.stroke();
    }

    strokeRuns(runs, 2, COL.center, [12,16]);        // 中央線

    // スタート／ゴール
    drawGate(TRACK[0], '#E8E4D8');
    drawGate(TRACK[TRACK.length-1], '#5FD3E0');

    // 煙
    for (var s=0;s<smoke.length;s++){
      var sm = smoke[s];
      ctx.globalAlpha = Math.max(0, sm.life) * 0.5;
      ctx.fillStyle = COL.smoke;
      ctx.beginPath(); ctx.arc(sm.x - camX, sm.y - camY, sm.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawGhost();
    drawCar();
    drawGhostGap();
  }

  function showTitle2(){
    var e = veilBody.getElementsByClassName('gh')[0];
    if (e) e.textContent = ghostLine();
  }
  function ghostLine(){
    var tail = '　（画面下の GHOST／G キーで 切→自己→1位）';
    if (ghostMode === 0) return 'ゴースト：切' + tail;
    if (ghostMode === 2) {
      var t = topG[courseIdx];
      if (!t) return 'ゴースト：1位と勝負 — まだ誰も記録を出していません' + tail;
      return 'ゴースト：1位と勝負　' + t.name + '　' + fmt(t.score) + tail;
    }
    if (!ghosts[courseIdx]) return 'ゴースト：自己ベスト — まだ記録なし（1本 完走すると記録されます）' + tail;
    return 'ゴースト：自己ベスト　' + fmt(ghostT[courseIdx]) + tail;
  }

  function drawGhost(){
    if (st !== 'play') return;
    var c = curGhost();
    if (!c) return;
    ghost = c.arr;
    var g = ghostPose(time);
    if (!g) return;
    var x = g.x - camX, y = g.y - camY;
    if (x < -60 || x > W+60 || y < -60 || y > H+60) return;
    ctx.save();
    ctx.globalAlpha = 0.34;
    ctx.translate(x, y);
    ctx.rotate(g.ang);
    drawCarNew(ctx, c.col, 0, false, 0, false, false);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 手本との差。マイナスなら自分が前に出ている
  function drawGhostGap(){
    if (st !== 'play') return;
    var c = curGhost();
    if (!c) return;
    ghost = c.arr;
    var gt = ghostTimeAt(idx);
    if (gt < 0) return;
    var d = time - gt;
    var txt = (d >= 0 ? '+' : '-') + Math.abs(d).toFixed(2);
    ctx.save();
    ctx.font = 'bold 11px Oxanium, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(11,12,16,0.55)';
    ctx.fillRect(W/2 - 25, 5, 50, 14);
    ctx.fillStyle = d <= 0 ? c.col.body : '#E0453A';
    ctx.fillText(txt, W/2, 15.5);
    ctx.restore();
  }

  function drawGate(s, color){
    var x = s.x - camX, y = s.y - camY;
    if (x < -80 || x > W+80 || y < -80 || y > H+80) return;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(s.a);
    ctx.fillStyle = color;
    for (var i=-HALF;i<HALF;i+=11) ctx.fillRect(i, -3, 5.5, 6);
    ctx.restore();
  }

  function drawCar(){
    var blink = hitT > 0 && Math.floor(hitT*20) % 2 === 0;
    ctx.save();
    ctx.translate(car.x - camX, car.y - camY);
    ctx.rotate(car.ang);

    // 前照灯の光
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = COL.lamp;
    ctx.beginPath();
    ctx.moveTo(-9, -26); ctx.lineTo(-48, -196); ctx.lineTo(48, -196); ctx.lineTo(9, -26);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;

    drawCarNew(ctx, COL, steerV, sliding, lastSlip, blink, false);
    ctx.restore();
  }

// 真上から見たドリフト車。全長62・全幅31。前は -Y 方向。
// タイヤは張り出した泥よけの下に収め、端だけ見せる（実車の見え方）。
function drawCarNew(ctx, COL, steerV, sliding, slip, blink, brakeOn){
  if (blink) return;
  var st = Math.max(-1, Math.min(1, steerV));
  var sa = st * 0.55;

  // ---- タイヤ（車体の下。泥よけからわずかに覗く） ----
  function wheel(x, y, rot, wide, long, smear){
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    if (smear > 0){
      ctx.globalAlpha = 0.28; ctx.fillStyle = '#07080B';
      rr(ctx, -wide/2 - smear, -long/2, wide + smear*2, long, 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = '#0B0C10';
    rr(ctx, -wide/2, -long/2, wide, long, 1.6); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';                 // 溝
    ctx.fillRect(-wide/2 + 1.4, -long/2 + 1.0, 0.9, long - 2.0);
    ctx.fillRect( wide/2 - 2.3, -long/2 + 1.0, 0.9, long - 2.0);
    ctx.fillStyle = 'rgba(206,202,190,0.12)';           // 肩の照り
    ctx.fillRect(-wide/2 + 0.5, -long/2 + 1.4, wide - 1.0, 0.9);
    ctx.restore();
  }
  var sm = sliding ? 0.8 + slip * 1.5 : 0;
  wheel(-11.9, -18.5, sa, 6.2, 13.0, sm * 0.5);
  wheel( 11.9, -18.5, sa, 6.2, 13.0, sm * 0.5);
  wheel(-12.4,  18.5, 0,  7.2, 13.6, sm);
  wheel( 12.4,  18.5, 0,  7.2, 13.6, sm);

  // ---- 影 ----
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  bodyPath(ctx, 1.8, 3.0); ctx.fill();

  // ---- 車体 ----
  var grd = ctx.createLinearGradient(-15, 0, 15, 0);
  grd.addColorStop(0,    shade(COL.body, -0.50));
  grd.addColorStop(0.16, shade(COL.body, -0.16));
  grd.addColorStop(0.34, shade(COL.body,  0.30));   // 縦に走る照り
  grd.addColorStop(0.46, COL.body);
  grd.addColorStop(0.78, shade(COL.body, -0.22));
  grd.addColorStop(1,    shade(COL.body, -0.54));
  ctx.fillStyle = grd;
  bodyPath(ctx, 0, 0); ctx.fill();

  ctx.save(); bodyPath(ctx, 0, 0); ctx.clip();

  // 泥よけの張り出し
  ctx.fillStyle = 'rgba(0,0,0,0.26)';
  rr(ctx, -15.2, -25.0, 4.6, 14.0, 2.2); ctx.fill();
  rr(ctx,  10.6, -25.0, 4.6, 14.0, 2.2); ctx.fill();
  rr(ctx, -15.6,  11.5, 5.0, 14.5, 2.2); ctx.fill();
  rr(ctx,  10.6,  11.5, 5.0, 14.5, 2.2); ctx.fill();
  // 泥よけの縁の線
  ctx.strokeStyle = 'rgba(0,0,0,0.42)'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(-10.8, -25.0); ctx.lineTo(-10.8, -11.0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 10.8, -25.0); ctx.lineTo( 10.8, -11.0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-11.0,  11.5); ctx.lineTo(-11.0,  26.0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 11.0,  11.5); ctx.lineTo( 11.0,  26.0); ctx.stroke();
  // 横に走る細い帯
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  ctx.fillRect(-13.0, -3.0, 2.2, 12.0);
  ctx.fillRect( 10.8, -3.0, 2.2, 12.0);
  ctx.restore();

  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1.1;
  bodyPath(ctx, 0, 0); ctx.stroke();

  // ---- 前の下ばり ----
  ctx.fillStyle = '#14161C';
  rr(ctx, -12.4, -32.2, 24.8, 3.0, 1.2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  rr(ctx, -12.4, -32.2, 24.8, 1.0, 0.8); ctx.fill();
  // 開口部
  ctx.fillStyle = '#0D0F14';
  rr(ctx, -6.0, -30.4, 12.0, 2.6, 1); ctx.fill();

  // ---- 長いボンネット ----
  ctx.strokeStyle = 'rgba(0,0,0,0.34)'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(-9.6, -28.0); ctx.lineTo(-9.2, -12.0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 9.6, -28.0); ctx.lineTo( 9.2, -12.0); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.58)';
  for (var v = 0; v < 3; v++){
    var vy = -23.0 + v * 2.3;
    rr(ctx, -7.0, vy, 5.6, 1.3, 0.6); ctx.fill();
    rr(ctx,  1.4, vy, 5.6, 1.3, 0.6); ctx.fill();
  }

  // ---- 窓と屋根 ----
  var glass = '#0A0C11';
  ctx.fillStyle = glass;
  ctx.beginPath();                                    // 前窓
  ctx.moveTo(-7.0, -11.0); ctx.lineTo(7.0, -11.0);
  ctx.lineTo(9.4, -2.0); ctx.lineTo(-9.4, -2.0); ctx.closePath(); ctx.fill();
  var rg = ctx.createLinearGradient(-9, 0, 9, 0);
  rg.addColorStop(0, shade(COL.body, -0.24));
  rg.addColorStop(0.36, shade(COL.body, 0.34));
  rg.addColorStop(1, shade(COL.body, -0.30));
  ctx.fillStyle = rg;                                 // 屋根
  rr(ctx, -8.4, -2.0, 16.8, 8.6, 1.4); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.42)';                 // 柱
  ctx.fillRect(-9.0, -2.4, 1.6, 9.4);
  ctx.fillRect( 7.4, -2.4, 1.6, 9.4);
  ctx.fillStyle = glass;                              // 後窓
  ctx.beginPath();
  ctx.moveTo(-8.6, 6.6); ctx.lineTo(8.6, 6.6);
  ctx.lineTo(6.8, 13.4); ctx.lineTo(-6.8, 13.4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.13)';           // 前窓の映り込み
  ctx.beginPath();
  ctx.moveTo(-6.8, -10.8); ctx.lineTo(-1.4, -10.8);
  ctx.lineTo(-4.6, -2.2); ctx.lineTo(-9.2, -2.2); ctx.closePath(); ctx.fill();

  // ---- 側面の帯・ドアミラー ----
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(-11.6, -1.6, 1.4, 8.0);
  ctx.fillRect( 10.2, -1.6, 1.4, 8.0);
  ctx.fillStyle = shade(COL.body, -0.40);
  rr(ctx, -14.6, -12.4, 2.8, 2.2, 0.9); ctx.fill();
  rr(ctx,  11.8, -12.4, 2.8, 2.2, 0.9); ctx.fill();

  // ---- 後ろの翼（立て板つき） ----
  ctx.fillStyle = 'rgba(0,0,0,0.55)';                 // 翼の下の影
  rr(ctx, -13.6, 20.0, 27.2, 4.0, 1.2); ctx.fill();
  var wg = ctx.createLinearGradient(0, 18.8, 0, 22.2);
  wg.addColorStop(0, shade(COL.body, -0.02));
  wg.addColorStop(1, shade(COL.body, -0.40));
  ctx.fillStyle = wg;
  rr(ctx, -13.6, 18.8, 27.2, 3.4, 1.2); ctx.fill();
  ctx.fillStyle = '#14161C';                          // 立て板
  rr(ctx, -13.8, 18.6, 1.8, 5.6, 0.7); ctx.fill();
  rr(ctx,  12.0, 18.6, 1.8, 5.6, 0.7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';                  // 支柱
  ctx.fillRect(-6.4, 16.8, 2.0, 3.0);
  ctx.fillRect( 4.4, 16.8, 2.0, 3.0);

  // ---- 前照灯 ----
  ctx.fillStyle = COL.lampCore;
  rr(ctx, -9.4, -30.0, 5.8, 2.8, 1.1); ctx.fill();
  rr(ctx,  3.6, -30.0, 5.8, 2.8, 1.1); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  rr(ctx, -9.4, -30.0, 5.8, 1.1, 0.7); ctx.fill();
  rr(ctx,  3.6, -30.0, 5.8, 1.1, 0.7); ctx.fill();

  // ---- 尾灯 ----
  var hot = brakeOn || sliding;
  if (hot){
    ctx.globalAlpha = 0.32; ctx.fillStyle = '#FF3B2E';
    rr(ctx, -12.0, 26.2, 9.8, 4.6, 1.8); ctx.fill();
    rr(ctx,   2.2, 26.2, 9.8, 4.6, 1.8); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = hot ? '#FF6A5C' : '#A02821';
  rr(ctx, -11.0, 27.0, 7.8, 2.8, 1); ctx.fill();
  rr(ctx,   3.2, 27.0, 7.8, 2.8, 1); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(-1.8, 27.0, 3.6, 2.8);
  ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = 0.9;   // 荷室のふた
  ctx.beginPath(); ctx.moveTo(-9.0, 25.6); ctx.lineTo(9.0, 25.6); ctx.stroke();

  // ---- 上の縁の照り返し ----
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(-6.0, -31.0); ctx.lineTo(6.0, -31.0); ctx.stroke();
}

function bodyPath(ctx, dx, dy){
  ctx.beginPath();
  ctx.moveTo(dx +  -6.2, dy + -31.2);
  ctx.lineTo(dx + -11.4, dy + -28.6);
  ctx.quadraticCurveTo(dx + -14.4, dy + -25.6, dx + -14.2, dy + -18.5);  // 前の張り出し
  ctx.quadraticCurveTo(dx + -11.8, dy +  -5.0, dx + -12.0, dy +   8.0);  // 胴を絞る
  ctx.quadraticCurveTo(dx + -15.2, dy +  13.0, dx + -15.0, dy +  21.0);  // 後ろの張り出し
  ctx.lineTo(dx + -11.2, dy +  30.0);
  ctx.lineTo(dx +  11.2, dy +  30.0);
  ctx.quadraticCurveTo(dx +  15.2, dy +  13.0, dx +  12.0, dy +   8.0);
  ctx.quadraticCurveTo(dx +  11.8, dy +  -5.0, dx +  14.2, dy + -18.5);
  ctx.quadraticCurveTo(dx +  14.4, dy + -25.6, dx +  11.4, dy + -28.6);
  ctx.closePath();
}

function rr(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function shade(hex, k){
  var n = parseInt(hex.slice(1), 16);
  var r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  if (k >= 0){ r += (255-r)*k; g += (255-g)*k; b += (255-b)*k; }
  else { r *= (1+k); g *= (1+k); b *= (1+k); }
  return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
}

  // ---------- 表示 ----------
  var prev = {};
  function syncDash(){
    var t = (st === 'play' || st === 'pause' || st === 'done') ? time : 0;
    var ts = fmt(t);
    if (prev.t !== ts) { vTime.textContent = ts; prev.t = ts; }
    var bs = best ? fmt(best) : '--';
    if (prev.b !== bs) { vBest.textContent = bs; prev.b = bs; }
    var ds = (score + Math.round(pending*mult)).toLocaleString('ja-JP');
    if (prev.d !== ds) { vDrift.textContent = ds; prev.d = ds; }
    var kmh = Math.round(Math.hypot(car.vx, car.vy) * 0.62);
    if (prev.s !== kmh) { vSpd.textContent = kmh; prev.s = kmh; }
    var pg = Math.round(idx / Math.max(1, TRACK.length-1) * 100);
    if (prev.p !== pg) { progBar.style.width = pg + '%'; prev.p = pg; }
    if (prev.sl !== sliding) {
      dash.classList.toggle('sliding', sliding);
      glow.classList.toggle('on', sliding);
      prev.sl = sliding;
    }
    if (st === 'count') {
      var n = Math.ceil(countT - 0.2);
      var txt = n > 0 ? String(n) : 'GO';
      if (prev.c !== txt) {
        countN.textContent = txt;
        countEl.classList.toggle('go', txt === 'GO');
        countN.style.animation = 'none'; void countN.offsetHeight; countN.style.animation = '';
        prev.c = txt;
      }
    }
  }

  // ---------- まわす ----------
  var lastT = 0, acc = 0;
  function frame(now){
    requestAnimationFrame(frame);
    if (!lastT) { lastT = now; return; }
    var dt = Math.min(0.05, (now - lastT)/1000);
    lastT = now;
    if (window.WADACHI_AUDIO) WADACHI_AUDIO.tick(st, sliding, lastSlip, lastSp);
    if (st !== 'pause') {
      acc += dt;
      var g = 0;
      while (acc >= 1/60 && g < 6) { step(1/60); acc -= 1/60; g++; }
      if (g >= 6) acc = 0;
      draw();
    }
    syncDash();
  }

  function boot(saved){
    wiped = resetIfOldRules();
    loadBest();
    syncGh();
    if (saved && saved.best && (!best || saved.best < best)) { best = saved.best; saveBest(); }
    layout();
    setCourse(0);
    syncDash();
    requestAnimationFrame(frame);
  }
  try {
    var hot = window.claude && window.claude.hot;
    if (hot && hot.snapshot) hot.snapshot(function(){ return { best: best }; });
    if (hot && hot.ready) hot.ready(boot);
    else boot((hot && hot.data) || {});
  } catch(e){ boot({}); }
})();
</script>

<script>
// ===== スマホの全画面 =====
// iPhone の Safari は、動画以外の全画面に対応していない。その場合はボタンを出さず、
// 「ホーム画面に追加」から開けば上下のバーが消える（公開サイト側で手当てしてある）。
(function(){
  var el = document.documentElement;
  var btn = document.getElementById('fsBtn');
  if (!btn) return;
  var req = el.requestFullscreen || el.webkitRequestFullscreen;
  var exi = document.exitFullscreen || document.webkitExitFullscreen;
  if (!req) return;                       // 対応していない端末ではボタンを出さない
  btn.classList.add('on');

  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function sync(){
    var on = isFs();
    el.classList.toggle('fs', on);
    btn.textContent = on ? '×' : '全';
    btn.title = on ? '全画面をやめる' : '全画面';
    btn.setAttribute('aria-label', btn.title);
    // 作品側に大きさを測り直させる
    setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 60);
    setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 360);
  }
  btn.addEventListener('click', function(e){
    e.preventDefault();
    try{
      if (isFs()) { if (exi) exi.call(document); }
      else { req.call(el, { navigationUI:'hide' }); }
    }catch(err){}
  });
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  sync();
})();
</script>
