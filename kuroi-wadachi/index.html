  function SL(){ var sl = String(courseIdx) + cond(); slotLoad(sl); return sl; }
  function slotLoad(sl){
    if (sl in ghosts) return;
    try {
      var v = localStorage.getItem('wadachi.ghost.' + sl);
      ghosts[sl] = v ? JSON.parse(v) : null;
      if (ghosts[sl] && (!ghosts[sl].length || ghosts[sl].length % 4)) ghosts[sl] = null;
      ghostT[sl] = parseFloat(localStorage.getItem('wadachi.ghostT.' + sl)) || 0;
      var b = localStorage.getItem('wadachi.time.' + sl);
      bests[sl] = b ? (parseFloat(b) || 0) : 0;
    } catch(e){ ghosts[sl] = null; ghostT[sl] = 0; bests[sl] = 0; }
  }
  // 天気や車の仕上げを変えたら、その条件のベスト・ゴーストに入れ替える
  function condChanged(){
    best = bests[SL()] || 0;
    ghost = ghosts[SL()];
    if (!topG[gameKey()]) fetchTop();
    prev = {};
  }
  function loadGhosts(){
    try {
      var m = localStorage.getItem('wadachi.ghostMode');
      if (m !== null) ghostMode = Math.max(0, Math.min(2, parseInt(m, 10) || 0));
      else if (localStorage.getItem('wadachi.ghostOn') === '0') ghostMode = 0;
    } catch(e){}
  }
  function saveGhost(t){
    var sl = SL();
    ghosts[sl] = rec.slice();
    ghostT[sl] = Math.round(t * 1000) / 1000;
    try {
      localStorage.setItem('wadachi.ghost.' + sl, JSON.stringify(ghosts[sl]));
      localStorage.setItem('wadachi.ghostT.' + sl, String(ghostT[sl]));
    } catch(e){}                       // 入りきらなくても走行そのものは止めない
  }
  // いま並走させる手本と、その色・持ち主
  function curGhost(){
    if (ghostMode === 2) {
      var t = topG[gameKey()];
      return t ? { arr: t.arr, col: GCOL2, who: t.name, time: t.score } : null;
    }
    var sl = SL();
    if (ghostMode === 1 && ghosts[sl]) {
      return { arr: ghosts[sl], col: GCOL, who: '自己ベスト', time: ghostT[sl] };
    }
    return null;
  }

  // 手本の t 秒時点の姿。終わっていれば null
  function ghostPose(t){
    if (!ghost) return null;
    var n = ghost.length / 4;
    var f = t / GH_DT, i = Math.floor(f);
    if (i < 0) i = 0;
    if (i >= n - 1) return null;
    var u = f - i, a = i*4, b = a + 4;
    var da = ghost[b+2] - ghost[a+2];
    while (da >  Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    return { x: ghost[a] + (ghost[b] - ghost[a]) * u,
             y: ghost[a+1] + (ghost[b+1] - ghost[a+1]) * u,
             ang: ghost[a+2] + da * u };
  }
  // 手本が、いまの自分と同じ地点を通ったのは何秒のときか
  function ghostTimeAt(gi){
    if (!ghost) return -1;
    var n = ghost.length / 4, lo = 0, hi = n - 1;
    if (ghost[3] > gi) return 0;
    if (ghost[(n-1)*4 + 3] < gi) return -1;
    while (lo < hi){
      var mid = (lo + hi) >> 1;
      if (ghost[mid*4 + 3] < gi) lo = mid + 1; else hi = mid;
    }
    return lo * GH_DT;
  }

  // 送るときは整数だけの文字列にする（向きは100倍して整数に）
  function packRec(a){
    var o = [];
    for (var i = 0; i < a.length; i += 4){
      o.push(Math.round(a[i]), Math.round(a[i+1]), Math.round(a[i+2]*100), a[i+3]);
    }
    return o.join(',');
  }
  function unpackRec(str){
    if (typeof str !== 'string' || !str) return null;
    var p = str.split(','), o = [];
    if (p.length < 8 || p.length % 4) return null;
    for (var i = 0; i < p.length; i += 4){
      var x = parseFloat(p[i]), y = parseFloat(p[i+1]);
      var g = parseFloat(p[i+2]), k = parseInt(p[i+3], 10);
      if (!isFinite(x) || !isFinite(y) || !isFinite(g) || !isFinite(k)) return null;
      o.push(x, y, g/100, k);
    }
    return o;
  }
  function myName(){
    try { return localStorage.getItem('score.name') || ''; } catch(e){ return ''; }
  }
  function gameKey(){ return 'wadachi-' + (courseIdx + 1) + cond(); }

  // 順位表1位の走りを取りに行く（つながらなくても遊べる）
  function fetchTop(){
    var key = gameKey();
    try {
      fetch(GAPI + '/ghost?game=' + encodeURIComponent(key), { cache:'no-store' })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          if (!d || d.none) { topG[key] = null; return; }
          var arr = unpackRec(d.data);
          topG[key] = arr ? { name: d.name, score: d.score, arr: arr } : null;
          if (key === gameKey() && (st === 'title' || st === 'done')) showTitle2();
        })
        .catch(function(){});
    } catch(e){}
  }
  // 1位より速ければ走りを預ける
  function sendGhost(t){
    var nm = myName();
    if (!nm) return;                       // 名前を出していない人は送らない
    var cur = topG[gameKey()];
    if (cur && t >= cur.score) return;     // 1位より遅いなら送らない
    var data = packRec(rec);
    if (!data || data.length > 120000) return;
    var key = gameKey();
    try {
      fetch(GAPI + '/ghost', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: key, name: nm, score: t, data: data })
      }).then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){ if (d && d.ok && key === gameKey()) fetchTop(); })
        .catch(function(){});
    } catch(e){}
  }

  // 走り方（タイヤの踏ん張りの式）を変えたので、古い決まりで出した記録は
  // 一度だけ消す。名前と音量は残す。
  var RULES = '5';   // 峠のアップダウンを入れた。前の記録は比べられない
  function resetIfOldRules(){
    try {
      if (localStorage.getItem('wadachi.rules') === RULES) return false;
      for (var i = 0; i < 6; i++){
        localStorage.removeItem('wadachi.time.' + i);
        localStorage.removeItem('wadachi.ghost.' + i);
        localStorage.removeItem('wadachi.ghostT.' + i);
      }
      localStorage.setItem('wadachi.rules', RULES);
      return true;
    } catch(e){ return false; }
  }

  var bests = {};
  function loadBest(){
    loadGhosts();
    best = bests[SL()] || 0;
    ghost = ghosts[SL()];
  }
  function saveBest(){
    var sl = SL();
    bests[sl] = best;
    try { localStorage.setItem('wadachi.time.' + sl, String(best)); } catch(e){}
  }
  function fmt(t){ return t.toFixed(2); }

  function reset(){
    var s0 = TRACK[0];
    car.x = s0.x; car.y = s0.y; car.ang = s0.a; car.vx = 0; car.vy = 0;
    camX = car.x - W/2; camY = car.y - H/2;
    idx = 0; time = 0;
    nextGate = 0; gatePrevS = null;
    score = 0; pending = 0; mult = 1; driftT = 0; idleT = 0; sliding = false;
    marks.length = 0; smoke.length = 0; lastWheels = null; hitT = 0; stuckT = 0; holdT = 0; steerV = 0;
    lastSlip = 0; lastSp = 0;
    rec.length = 0; rivRec.length = 0;
    riv = null; rivFin = 0; rivWheels = null; bumpT = 0;
    rivAt.length = 0; myAt.length = 0;
    if (story) {
      // 並んでスタート。自分が右、ライバルが左
      var R = 20;
      car.x = s0.x + s0.nx * R; car.y = s0.y + s0.ny * R;
      riv = { x: s0.x - s0.nx * R, y: s0.y - s0.ny * R, ang: s0.a, vx:0, vy:0,
              steerV:0, holdT:0, idx:0, hitT:0, stuckT:0, lat:0, fwd:0, onRoad:true, wall:false,
              seen: -1, mySeen: -1, top: CH().top || 0, pow: CH().pow || 0, tight: true,
              col: { body: CH().col, lampCore: '#FFE9BC' } };
      camX = s0.x - W/2; camY = s0.y - H/2;
    }
    cabYaw = car.ang; cabPitch = pitchAt(0);
    resetChase();
  }
  function startGame(){ if (window.SCOREBOARD) SCOREBOARD.hide();
    if (window.WADACHI_AUDIO) WADACHI_AUDIO.start(courseIdx % 3);
    reset(); st = 'count'; countT = 3.2; countEl.classList.remove('off'); veil.classList.add('off'); lastT = 0;
    if (tiltOn && tiltSeen) tiltZero = tiltNow; }
  var wiped = false;
  function showTitle(){
    if (story) { showStory(); return; }
    ending = false;
    st = 'title'; reset();
    if (window.WADACHI_AUDIO) WADACHI_AUDIO.stop();
    if (window.SCOREBOARD) SCOREBOARD.top(boardKey());
    var c = COURSES[courseIdx];
    veilTitle.textContent = 'TOUGE TIME ATTACK';
    veilBody.innerHTML = '<span class="dirrow"><button type="button" class="dirb' + (c.rev ? '' : ' on') + '" data-dir="0">▼ 下り</button>' +
      '<button type="button" class="dirb' + (c.rev ? ' on' : '') + '" data-dir="1">▲ 上り</button></span>　' +
      '<span class="dirrow"><button type="button" class="dirb' + (mode === 'time' ? ' on' : '') + '" data-mode="time">タイム</button>' +
      '<button type="button" class="dirb' + (mode === 'drift' ? ' on' : '') + '" data-mode="drift">ドリフト点</button></span><br>' +
      '<span class="course">' + c.name + '　<em>' + c.tag + '　全長 ' + Math.round(TRACKLEN) + '</em></span><br>' +
      '左右だけ。アクセルは自動、ブレーキは無い。<br>' +
      'ヘアピンは曲がりきれない。<br><b>滑らせて速度を落とす</b>のが唯一の減速。<br>' +
      '<span class="gh">' + ghostLine() + '</span>' +
      (wiped ? '<br><span class="gh" style="color:#F0873A">走り方を変えたので、前の決まりで出した記録は消しました</span>' : '') +
      (mode === 'drift' ? '<br><span class="gh">ドリフト点で競う　自己ベスト ' + driftBest().toLocaleString('ja-JP') + ' 点</span>' : '') +
      condNote() + replayRow();
    goBtn.textContent = 'スタート';
    veil.classList.remove('off');
    countEl.classList.add('off');
  }
  function finish(miss){
    st = 'done';
    bank();
    // リプレイ用にこの走りを取っておく（いま並走していたゴーストも。このあとベスト更新で入れ替わるため先に）
    var gNow = (!story && curGhost()) ? curGhost() : null;
    lastRun = { course: courseIdx, story: story, rec: rec.slice(),
                riv: story && rivRec.length ? rivRec.slice() : null,
                gh: gNow ? { arr: gNow.arr, col: gNow.col } : null };
    if (story) { storyResult(miss); return; }
    if (miss > 0) {                       // 通過点を飛ばしている＝ショートカット
      if (window.WADACHI_AUDIO) { WADACHI_AUDIO.stop(); WADACHI_AUDIO.fail(); }
      veilTitle.textContent = 'SHORTCUT';
      veilBody.innerHTML = '<span class="course">' + COURSES[courseIdx].name + '</span><br>' +
        '<span class="big">' + fmt(time) + '</span><br>' +
        '<span class="sub" style="color:#E0453A">タイム無効　関門を ' + miss + ' 箇所 くぐっていません</span>' + replayRow();
      goBtn.textContent = 'もういちど';
      veil.classList.remove('off');
      countEl.classList.add('off');
      return;
    }
    if (window.SCOREBOARD) SCOREBOARD.over(boardKey(), mode === 'drift' ? score : time);
    var dNew = false;
    if (mode === 'drift' && score > driftBest()) {
      dNew = true;
      try { localStorage.setItem('wadachi.drift.' + SL(), String(score)); } catch(e){}
    }
    var isNew = (best === 0 || time < best);
    if (isNew) { best = time; saveBest(); }
    // 手本がまだ無ければ、ベスト更新でなくてもこの1本を手本にする。
    // そうしないと、すでにベストを持っている人には永久にゴーストが出ない。
    if (isNew || !ghosts[SL()]) { saveGhost(time); ghost = ghosts[SL()]; }
    sendGhost(time);
    if (window.WADACHI_AUDIO) { WADACHI_AUDIO.stop(); WADACHI_AUDIO.goal(isNew); }
    veilTitle.textContent = 'GOAL';
    if (mode === 'drift') {
      veilBody.innerHTML = '<span class="course">' + COURSES[courseIdx].name + '</span><br>' +
        '<span class="big">' + score.toLocaleString('ja-JP') + '</span><br>' +
        '<span class="sub">' + (dNew ? 'NEW BEST' : 'BEST ' + driftBest().toLocaleString('ja-JP')) + '</span><br>' +
        'タイム ' + fmt(time) + (isNew ? '（ベスト更新）' : '') + condNote() + replayRow();
    } else {
      veilBody.innerHTML = '<span class="course">' + COURSES[courseIdx].name + '</span><br>' +
        '<span class="big">' + fmt(time) + '</span><br>' +
        '<span class="sub">' + (isNew ? 'NEW BEST' : 'BEST ' + fmt(best)) + '</span><br>' +
        'ドリフト ' + score.toLocaleString('ja-JP') + ' 点' + condNote() + replayRow();
    }
    goBtn.textContent = 'もういちど';
    veil.classList.remove('off');
    countEl.classList.add('off');
  }
  function setPause(on){
    if (window.WADACHI_AUDIO) WADACHI_AUDIO.pause(on);
    if (on) { st = 'pause'; veilTitle.textContent = 'PAUSE'; veilBody.innerHTML = 'ひとやすみ'; goBtn.textContent = 'つづける'; veil.classList.remove('off'); }
    else { st = 'play'; veil.classList.add('off'); lastT = 0; }
  }
  function setCourse(i){
    courseIdx = i;
    setWeather(story ? CH().wx : userWx, true);
    if (typeof syncWx === 'function') syncWx();
    buildTrack();
    best = bests[SL()] || 0;
    ghost = ghosts[SL()];
    if (!topG[gameKey()]) fetchTop();
    var btns = tabsEl.getElementsByTagName('button');
    for (var k=0;k<btns.length;k++){
      var isS = btns[k].getAttribute('data-c') === 's';
      btns[k].classList.toggle('on', story ? isS : (!isS && k === courseIdx % 3));
    }
    prev = {};
    showTitle();
  }
  tabsEl.addEventListener('click', function(e){
    var b = e.target;
    while (b && b !== tabsEl && !b.getAttribute('data-c')) b = b.parentNode;
    if (!b || b === tabsEl) return;
    var v = b.getAttribute('data-c');
    if (v === 's') { story = true; setCourse(CH().c); }
    else { story = false; setCourse(parseInt(v, 10) + (courseIdx >= 3 ? 3 : 0)); }   // 上りを選んでいたら上りのまま
  });

  // ---------- 物語の画面 ----------
  function chapHead(){
    return '<span class="chap">' +
      '<button type="button" class="nav" data-nav="-1"' + (chap > 0 ? '' : ' disabled') + ' aria-label="前の章">◀</button>' +
      '<span>第' + (chap + 1) + '戦 ／ ' + CHAPTERS.length + '　' + COURSES[CH().c].name + '・' + (COURSES[CH().c].rev ? '上り' : '下り') + '・' + WXNAME[CH().wx] + '</span>' +
      '<button type="button" class="nav" data-nav="1"' + (chap < Math.min(cleared, CHAPTERS.length - 1) ? '' : ' disabled') + ' aria-label="次の章">▶</button>' +
      '</span>';
  }
  function whoLine(){
    var c = CH();
    return '<span class="who"><i style="background:' + c.col + '"></i>' + c.tag + '　<b>' + c.who + '</b></span>';
  }
  function showStory(){
    ending = false;
    st = 'title'; reset();
    if (window.WADACHI_AUDIO) WADACHI_AUDIO.stop();
    if (window.SCOREBOARD) SCOREBOARD.hide();
    var c = CH();
    veilTitle.textContent = c.boss ? 'FINAL BATTLE' : 'TOUGE BATTLE';
    veilBody.innerHTML = chapHead() + '<br>' +
      (chap === 0 && cleared === 0 ? '<span class="narr">' + PROLOGUE + '</span><br>' : '') +
      whoLine() + '<br>' +
      (c.boss ? '<span class="narr">' + c.pre + '</span>' : '<span class="line">「' + c.pre + '」</span>') + '<br>' +
      '<span class="gh">並んでスタート。相手より先にゴールすれば勝ち。車はぶつかる。</span>' +
      (cleared > chap ? '<br><span class="gh">勝ち抜き済み</span>' : '') +
      (cleared >= CHAPTERS.length ? '<br><button type="button" class="nav endbtn" data-end="1">エンディングを見る</button>' : '') +
      colorRow() + tuneRow();
    goBtn.textContent = 'バトル開始';
    veil.classList.remove('off');
    countEl.classList.add('off');
  }
  function storyResult(miss){
    var c = CH();
    var win = miss === 0 && (!rivFin || time < rivFin);
    lastWin = win;
    if (win && cleared <= chap) { cleared = chap + 1; saveStory(); }
    if (window.WADACHI_AUDIO) { WADACHI_AUDIO.stop(); if (win) WADACHI_AUDIO.goal(true); else WADACHI_AUDIO.fail(); }
    var last = win && chap === CHAPTERS.length - 1;
    veilTitle.textContent = win ? 'WIN' : 'LOSE';
    var res = miss > 0 ? '<span class="sub" style="color:#E0453A">関門を ' + miss + ' 箇所 くぐっていません（反則負け）</span>'
            : '<span class="sub">あいて ' + (rivFin ? fmt(rivFin) : 'まだ走っている') + '</span>';
    var talk = win ? c.win : c.lose;
    veilBody.innerHTML = chapHead() + '<br>' +
      '<span class="big">' + fmt(time) + '</span><br>' + res + '<br>' +
      whoLine() + '<br>' +
      (c.boss ? '<span class="narr">' + talk + '</span>' : '<span class="line">「' + talk + '」</span>') + replayRow();
    goBtn.textContent = win ? (last ? 'エンディングへ' : '次の相手へ') : 'もういちど';
    veil.classList.remove('off');
    countEl.classList.add('off');
  }
  // 「スタート」ボタン・Space キーで行うこと
  var goAt = 0;
  function goAction(){
    // キーとボタンの両方から同時に来ても、1回ぶんだけ進める
    var now = Date.now();
    if (now - goAt < 350) return;
    goAt = now;
    if (st === 'replay') { endReplay(); return; }
    if (st === 'pause') { setPause(false); return; }
    if (ending) { showStory(); return; }
    if (story && st === 'done' && lastWin) {
      if (chap < CHAPTERS.length - 1) { chap++; lastWin = false; setCourse(CH().c); }
      else { lastWin = false; showEnding(); }
      return;
    }
    startGame();
  }

  // ---------- エンディング ----------
  // 1行ずつ ゆっくり浮かび上がらせる（動きを減らす設定の人には最初から全部出す）
  var ending = false;
  var EPILOGUE = [
    'それから――',
    'タケは今も、週末になると杉ノ沢にいる。<br>新顔を見つけては、橙色の車の話をするらしい。',
    '蛇骨の双子は、ヘアピンの入り方を一から組み直しているという。',
    '鷹ノ巣のカシワギは、十年ぶりに自分の走りを見直しはじめた。',
    '上りの三人は、今度は上りで勝負しろと言ってきかない。',
    'あの黒い車を見た者は、それきりいない。',
    'そして深夜の峠には、新しい噂が立ちはじめた。<br>――ブレーキを踏まずに曲がる、橙色の車がいる、と。'
  ];
  function showEnding(){
    ending = true;
    st = 'title';
    if (window.SCOREBOARD) SCOREBOARD.hide();
    veilTitle.textContent = 'ENDING';
    var h = '', i, d = 0;
    for (i = 0; i < EPILOGUE.length; i++, d += 1.6) {
      h += '<span class="narr fade" style="animation-delay:' + d.toFixed(1) + 's">' + EPILOGUE[i] + '</span><br>';
    }
    var chips = '';
    for (i = 0; i < CHAPTERS.length; i++) {
      chips += '<span class="chip"><i style="background:' + CHAPTERS[i].col + '"></i>' + CHAPTERS[i].who + '</span>';
    }
    h += '<span class="fade" style="animation-delay:' + d.toFixed(1) + 's"><span class="gh">勝ち抜いた相手</span><br>' +
         '<span class="chips">' + chips + '</span></span><br>';
    d += 1.4;
    h += '<span class="narr end fade" style="animation-delay:' + d.toFixed(1) + 's">黒い轍　― 完 ―<br>遊んでくれて、ありがとう。</span>' +
         '<br><span class="gh fade" style="animation-delay:' + (d + 1.2).toFixed(1) + 's">車の色を選べるようになりました（物語の画面から）</span>';
    veilBody.innerHTML = h;
    goBtn.textContent = 'おわり';
    veil.classList.remove('off');
    countEl.classList.add('off');
  }
  veilBody.addEventListener('click', function(e){
    var b = e.target;
    if (b && b.getAttribute && b.getAttribute('data-replay')) { startReplay(b.getAttribute('data-replay')); return; }
    if (b && b.getAttribute && b.getAttribute('data-mode')) {
      mode = b.getAttribute('data-mode') === 'drift' ? 'drift' : 'time';
      try { localStorage.setItem('wadachi.mode', mode); } catch(e2){}
      showTitle(); return;
    }
    if (b && b.getAttribute && b.getAttribute('data-tune')) {
      if (TUNES[b.getAttribute('data-tune')]) tune = b.getAttribute('data-tune');
      try { localStorage.setItem('wadachi.tune', tune); } catch(e3){}
      condChanged();
      showStory(); return;
    }
    if (b && b.getAttribute && b.getAttribute('data-dir')) { setCourse(courseIdx % 3 + (b.getAttribute('data-dir') === '1' ? 3 : 0)); return; }
    if (b && b.getAttribute && b.getAttribute('data-col')) {
      setMyCol(b.getAttribute('data-col'), true);
      showStory();
      return;
    }
    if (b && b.getAttribute && b.getAttribute('data-end')) { showEnding(); return; }
    if (!b || !b.getAttribute || !b.getAttribute('data-nav') || b.disabled) return;
    var n = chap + parseInt(b.getAttribute('data-nav'), 10);
    if (n < 0 || n > Math.min(cleared, CHAPTERS.length - 1)) return;
    chap = n; lastWin = false;
    setCourse(CH().c);
  });

  var ghBtn = document.getElementById('ghBtn');
  var GHLABEL = ['GHOST 切', 'GHOST 自己', 'GHOST 1位'];
  function syncGh(){
    if (!ghBtn) return;
    ghBtn.textContent = GHLABEL[ghostMode];
    ghBtn.classList.toggle('on', ghostMode !== 0);
    ghBtn.classList.toggle('top', ghostMode === 2);
    ghBtn.setAttribute('aria-pressed', ghostMode !== 0 ? 'true' : 'false');
    ghBtn.title = ['ゴーストを出さない', '自己ベストと並走', '順位表1位と勝負'][ghostMode];
  }
  function toggleGh(){
    ghostMode = (ghostMode + 1) % 3;
    try { localStorage.setItem('wadachi.ghostMode', String(ghostMode)); } catch(e){}
    syncGh();
    if (st === 'title' || st === 'done') showTitle2();
  }
  if (ghBtn) ghBtn.addEventListener('click', toggleGh);

  // 視点（上から／運転席）。選んだほうはブラウザに残す
  var vwBtn = document.getElementById('vwBtn');
  function syncView(){
    if (!vwBtn) return;
    vwBtn.textContent = '視点 ' + RVNAME[view];
    vwBtn.title = 'V キーでも切り替え';
  }
  function toggleView(){
    view = view === 'top' ? 'cab' : view === 'cab' ? 'chase' : 'top';
    try { localStorage.setItem('wadachi.view', view); } catch(e){}
    syncView();
    layout();
  }
  if (vwBtn) vwBtn.addEventListener('click', function(){ toggleView(); vwBtn.blur(); });
  var wxBtn = document.getElementById('wxBtn');
  function syncWx(){ if (wxBtn) { wxBtn.textContent = '天気 ' + WXNAME[weather]; wxBtn.title = story ? '物語の天気は戦ごとに決まっています' : '晴れ→雨→霧（W キーでも）'; } }
  function cycleWx(){
    if (st === 'play' || st === 'count') return;          // 走っている途中では変えない
    if (story) return;                                     // 物語の天気は戦ごとに決まっている
    setWeather(weather === 'clear' ? 'rain' : weather === 'rain' ? 'fog' : 'clear');
    syncWx();
    condChanged();
    if (st === 'title') showTitle();
  }
  if (wxBtn) wxBtn.addEventListener('click', function(){ cycleWx(); wxBtn.blur(); });

  var volSl = document.getElementById('volSl');
  if (volSl && window.WADACHI_AUDIO){
    volSl.value = Math.round(WADACHI_AUDIO.getVol() * 100);
    volSl.addEventListener('input', function(){ WADACHI_AUDIO.setVol(volSl.value / 100); });
  }
  goBtn.addEventListener('click', goAction);

  // ---------- そうさ（左右だけ） ----------
  var keys = {}, touchDir = 0;
  window.addEventListener('keydown', function(e){
    var k = e.key;
    if (k === ' ' || k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') e.preventDefault();
    keys[k] = true;
    // ボタンにフォーカスがあるときの Enter はボタン側の click で動く（二重に進めない）
    var onBtn = e.target && e.target.tagName === 'BUTTON';
    if (k === ' ' || (k === 'Enter' && !onBtn)) {
      if (st === 'title' || st === 'done' || st === 'pause' || st === 'replay') goAction();
    }
    if (k === 'p' || k === 'P') { if (st === 'play') setPause(true); else if (st === 'pause') setPause(false); }
    if (k === 'g' || k === 'G') toggleGh();
    if (k === 'v' || k === 'V') { if (st === 'replay') cycleRview(); else toggleView(); }
    if ((k === 's' || k === 'S') && st === 'replay') toggleSlow();
    if (k === 'w' || k === 'W') cycleWx();
    if (k === 'Escape' && st === 'replay') endReplay();
  });
  window.addEventListener('keyup', function(e){ keys[e.key] = false; });
  window.addEventListener('blur', function(){ keys = {}; touchDir = 0; });

  function touchAt(e){
    var r = cv.getBoundingClientRect();
    touchDir = ((e.clientX - r.left) / r.width < 0.5) ? -1 : 1;
  }
  cv.addEventListener('pointerdown', function(e){
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    touchAt(e);
  });
  cv.addEventListener('pointermove', function(e){ if (e.buttons) touchAt(e); });
  cv.addEventListener('pointerup', function(){ touchDir = 0; });
  cv.addEventListener('pointercancel', function(){ touchDir = 0; });
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  function steerDir(){
    var d = 0;
    if (keys['ArrowLeft']  || keys['a'] || keys['A']) d -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) d += 1;
    if (d === 0) d = touchDir;
    if (d === 0 && tiltOn) d = tiltDir();
    return d;
  }

  // ---------- スマホを傾けてハンドル ----------
  // スタートの瞬間の傾きを「まっすぐ」とし、そこから左右へ傾けた角度で切る。
  // 少しの傾きは無視し（4度まで）、22度で目いっぱい。押している長さではなく角度で切れる。
  var tiltOn = false, tiltNow = 0, tiltZero = 0, tiltSeen = false;
  var tiltBtn = document.getElementById('tiltBtn');
  function tiltDir(){
    if (!tiltSeen) return 0;
    var v = tiltNow - tiltZero, a = Math.abs(v);
    if (a < 4) return 0;
    return (v > 0 ? 1 : -1) * Math.min(1, (a - 4) / 18);
  }
  function onOrient(e){
    var sc = window.screen;
    var ang = (sc && sc.orientation && typeof sc.orientation.angle === 'number') ? sc.orientation.angle
            : (typeof window.orientation === 'number' ? window.orientation : 0);
    var t;
    if (ang === 90) t = e.beta;              // 横向き（左に倒した持ち方）
    else if (ang === -90 || ang === 270) t = -e.beta;
    else t = e.gamma;                        // 縦向き
    if (typeof t !== 'number' || !isFinite(t)) return;
    if (!tiltSeen) { tiltZero = t; tiltSeen = true; }
    tiltNow = t;
  }
  function syncTilt(){ if (tiltBtn) { tiltBtn.textContent = tiltOn ? '傾き 入' : '傾き 切'; tiltBtn.classList.toggle('on', tiltOn); } }
  function setTilt(on){
    tiltOn = on; tiltSeen = false;
    if (on) window.addEventListener('deviceorientation', onOrient);
    else window.removeEventListener('deviceorientation', onOrient);
    syncTilt();
  }
  if (tiltBtn) {
    // 指で操作する端末で、傾きが取れるときだけボタンを出す
    var coarse = false;
    try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch(e){}
    if (coarse && 'DeviceOrientationEvent' in window) tiltBtn.hidden = false;
    tiltBtn.addEventListener('click', function(){
      tiltBtn.blur();
      if (tiltOn) { setTilt(false); return; }
      // iPhone は、押したその場で使ってよいか聞く必要がある
      var D = window.DeviceOrientationEvent;
      if (D && typeof D.requestPermission === 'function') {
        D.requestPermission().then(function(r){ if (r === 'granted') setTilt(true); else alertTilt(); }).catch(alertTilt);
      } else setTilt(true);
    });
  }
  function alertTilt(){ if (tiltBtn) tiltBtn.textContent = '傾き 許可なし'; }

  function bank(){
    if (pending > 0) score += Math.round(pending * mult);
    pending = 0; mult = 1; driftT = 0;
  }

  // ---------- 1コマ ----------
  function step(dt){
    if (st === 'count') {
      countT -= dt;
      if (window.WADACHI_AUDIO) WADACHI_AUDIO.count(Math.max(0, Math.ceil(countT - 0.2)));
      if (countT <= 0) { st = 'play'; countEl.classList.add('off'); }
      return;
    }
    if (st === 'replay') { stepReplay(dt); return; }
    if (st !== 'play') return;

    time += dt;

    car.steerV = steerV; car.holdT = holdT; car.idx = idx; car.hitT = hitT; car.stuckT = stuckT;
    applyTune(car);
    drive(car, steerDir(), dt);
    steerV = car.steerV; holdT = car.holdT; idx = car.idx; hitT = car.hitT; stuckT = car.stuckT;
    if (story && riv) stepRival(dt);
    var fx = Math.sin(car.ang), fy = -Math.cos(car.ang);
    var rx = Math.cos(car.ang), ry = Math.sin(car.ang);
    var lat = car.lat, fwd = car.fwd, onRoad = car.onRoad;

    if (car.wall) {
      if (window.WADACHI_AUDIO) WADACHI_AUDIO.hitWall();
      pending = 0; mult = 1; driftT = 0;
      for (var i=0;i<8;i++) smoke.push({ x:car.x, y:car.y, r:4+Math.random()*7, life:1, h:TRACK[idx].h });
    }

    // 滑り具合
    var sp = Math.hypot(car.vx, car.vy);
    lastSp = sp;
    var slip = Math.abs(Math.atan2(lat, Math.max(18, fwd)));
    lastSlip = slip;
    sliding = (slip > 0.18 && sp > 80 && onRoad);

    if (sliding) {
      driftT += dt; idleT = 0;
      mult = Math.min(8, 1 + Math.floor(driftT / 1.5));
      pending += slip * sp * dt * 1.6;
    } else {
      idleT += dt;
      if (pending > 0 && idleT > 0.4) bank();
    }

    // 轍と煙
    // 新しい車の後輪の位置（左右13.8・後ろ18）に合わせる
    var wl = { x: car.x - rx*13.8 - fx*18, y: car.y - ry*13.8 - fy*18 };
    var wr = { x: car.x + rx*13.8 - fx*18, y: car.y + ry*13.8 - fy*18 };
    if (Math.abs(lat) > 34) {
      if (lastWheels) {
        marks.push({ x1:lastWheels.l.x, y1:lastWheels.l.y, x2:wl.x, y2:wl.y, h:TRACK[idx].h });
        marks.push({ x1:lastWheels.r.x, y1:lastWheels.r.y, x2:wr.x, y2:wr.y, h:TRACK[idx].h });
        while (marks.length > 1400) marks.shift();
      }
      if (Math.random() < dt*30) smoke.push({ x:(wl.x+wr.x)/2, y:(wl.y+wr.y)/2, r:3+Math.random()*5, life:1, h:TRACK[idx].h });
      lastWheels = { l:wl, r:wr };
    } else lastWheels = null;

    for (var s=smoke.length-1;s>=0;s--){
      var sm = smoke[s];
      sm.r += 20*dt; sm.life -= dt*1.2;
      if (sm.life <= 0) smoke.splice(s,1);
    }

    checkGate();

    // ゴーストのために位置を控える（0.05秒ごと）
    while (rec.length / 4 * GH_DT <= time && rec.length < 4 * 4000) {
      rec.push(Math.round(car.x*10)/10, Math.round(car.y*10)/10,
               Math.round(car.ang*1000)/1000, idx);
      // リプレイ用に、物語の相手の走りも同じ形で控える
      if (story && riv) rivRec.push(Math.round(riv.x*10)/10, Math.round(riv.y*10)/10,
                                    Math.round(riv.ang*1000)/1000, riv.idx);
    }

    // ゴール（関門を全部くぐっているか確認する）
    if (idx >= TRACK.length - 3) finish(GATES.length - nextGate);

    // 画面の追従（速度のぶんだけ先を見る）
    var tx = car.x + car.vx*0.42 - W/2;
    var ty = car.y + car.vy*0.42 - H/2;
    var k = Math.min(1, 6.5*dt);
    camX += (tx - camX) * k;
    camY += (ty - camY) * k;
    followCab(dt);
    followChase(dt);
  }

  // ---------- 車を1コマ動かす（自分の車もライバルの車も、この同じ式で走る）----------
  // c: 車（x,y,ang,vx,vy と steerV,holdT,idx,hitT,stuckT を持つ）、d: ハンドル -1/0/1
  // 結果として c.lat, c.fwd, c.onRoad, c.wall（このコマで壁に当たったか）を残す。
  function drive(c, d, dt){
    var sp = Math.hypot(c.vx, c.vy);
    // 切り続けるほど後ろが出る。戻すと素早く収まる
    if (d !== 0) c.holdT = Math.min(1, c.holdT + dt*1.7); else c.holdT = Math.max(0, c.holdT - dt*2.8);
    // ハンドルは一気にではなく、押している長さに応じて切れていく
    var rate = (d === 0 || d * c.steerV < 0) ? STEERDN : STEERUP;
    c.steerV += (d - c.steerV) * Math.min(1, rate * dt);
    // c.turnK：車の仕上げで曲がりやすくする倍率（標準の車は持たない＝1）
    c.ang += c.steerV * (TURN * (c.turnK || 1)) * Math.max(0.32, Math.min(1, sp/70)) * dt;  // 止まっていても向きは変えられる

    var fx = Math.sin(c.ang), fy = -Math.cos(c.ang);
    var rx = Math.cos(c.ang), ry = Math.sin(c.ang);
    var fwd = c.vx*fx + c.vy*fy;
    var lat = c.vx*rx + c.vy*ry;

    // コース上のどこにいるか
    c.idx = nearest(c.x, c.y, c.idx);
    var sN = TRACK[c.idx];
    var offv = (c.x - sN.x)*sN.nx + (c.y - sN.y)*sN.ny;   // 中心からの横ずれ
    var off = Math.abs(offv) - HALF;
    var onRoad = off < 0;

    // 前へ
    // 角度をつけている間は駆動が前へ出る（パワーをかけたドリフト）。
    // 山で最大になり、そこを越えると急に効かなくなるので、振りすぎても得しない。
    var la1 = Math.abs(lat);
    var drv = la1 <= PEAK ? la1 / PEAK
                          : Math.max(0, (PEAK * 1.5 - la1) / (PEAK * 0.5));
    // c.pow：ライバルの運転手がアクセルをどこまで踏むか（1＝床まで）。自分の車は持たない＝1
    fwd += ACCEL * (c.pow || 1) * (1 + DRIVE * drv) * dt;
    // 坂：下りは押され、上りは抑えられる
    fwd += GRAV * sN.g * dt;
    fwd -= fwd * (onRoad ? 0.16 : 1.1) * dt;
    // c.top：ライバルの運転手が出す速さの上限（怖がって踏み切れない分）。自分の車は持たない＝MAXS
    var top = c.top || MAXS;
    if (fwd > top) fwd = top;
    // 滑ったぶんの減速＝これが唯一の減速。
    // 前向きの速度からだけ引くと、真横を向いた（前向きが0の）ときに減速が
    // 効かなくなり、勢いを保ったまま向きだけ戻って かえって速くなる。
    // 前向きで引ききれないぶんは、横向きの勢いから削る。
    var la0 = Math.abs(lat);
    var loss = (la0 <= PEAK ? la0 * SCRUB * SCRUBMILD
                            : PEAK * SCRUB * SCRUBMILD + (la0 - PEAK) * SCRUB * SCRUBHARD) * dt;
    var take = Math.min(Math.max(0, fwd), loss);
    fwd -= take;
    // 90度を超えて流れると、前向きの速度はマイナス（車が進行方向と逆を向いている）。
    // このときエンジンは進行方向に対して逆向きに押すので、加速ではなく減速になる。
    // ここを 0 で止めるとその減速が丸ごと消え、90度で張り付いて振り回すほど速くなる。
    if (fwd < -BACKMAX) fwd = -BACKMAX;
    var rest = loss - take;
    if (rest > 0){
      var cut = Math.min(Math.abs(lat), rest);
      lat -= (lat > 0 ? cut : -cut);
    }

    // 横のグリップ
    // タイヤの踏ん張りは PEAK でいちばん強く、そこを越えると落ちていく。
    // 横速度に比例させ続けると、大きく振るほど強く引き戻されて速くなってしまう。
    var fast = 1 - SPEEDSLIP * Math.min(1, sp / MAXS);
    // 荷重：頂上では抜けて滑りやすく、谷では沈んで 食いつく
    var load = Math.max(0.60, Math.min(1.40, 1 - CREST * sN.dg));
    // c.gripK：車の仕上げの踏ん張り倍率、WGRIP：天気（雨で下がる。晴れは1）
    var grip = GRIP * (c.gripK || 1) * WGRIP * fast * (1 - HOLD*c.holdT) * (onRoad ? 1 : 0.5) * load;
    var la = Math.abs(lat);
    var curve = la <= PEAK ? la : Math.max(PEAK * TAIL, PEAK * PEAK / la);
    var dLat = Math.min(la, grip * curve * dt);
    lat -= (lat > 0 ? dLat : -dLat);

    c.vx = fx*fwd + rx*lat;
    c.vy = fy*fwd + ry*lat;
    // 前向きの成分だけを頭打ちにすると、車が回ったときに前向きへ空きができて
    // そこへ推進が継ぎ足される。回すたびに繰り返されるので、振り回すほど
    // 全体の速さが増えてしまう（実測で最高速の106%まで出ていた）。
    // 全体の速さで頭打ちにする。まっすぐ走ったときの最高速は変わらない。
    var tot = Math.hypot(c.vx, c.vy);
    if (tot > top){ var kk = top / tot; c.vx *= kk; c.vy *= kk; }
    c.x += c.vx * dt;
    c.y += c.vy * dt;

    // 壁
    c.wall = false;
    // 壁の位置。相手の車は、ヘアピンで隣の道と重なる所では壁を手前にして、隣の道へはみ出さない
    // （自分の車は持たない＝今までどおり WALL。順位表の記録の条件を変えないため）
    var wallW = WALL;
    if (c.tight) wallW = Math.max(4, Math.min(WALL, (offv > 0 ? sN.clrR : sN.clrL) - HALF));
    if (off > wallW) {
      var sgn = offv > 0 ? 1 : -1;
      // 壁の内側へ少し戻す（ちょうどの位置に置くと張り付く）
      c.x = sN.x + sN.nx * sgn * (HALF + wallW - 7);
      c.y = sN.y + sN.ny * sgn * (HALF + wallW - 7);
      // 壁へ向かう成分だけ消す。前へ進む成分は残すので、壁ぞいに流れて復帰できる
      var vn = c.vx*sN.nx + c.vy*sN.ny;
      if (vn * sgn > 0) { c.vx -= sN.nx * vn; c.vy -= sN.ny * vn; }
      c.vx *= 0.72; c.vy *= 0.72;
      c.hitT = 0.35;
      c.wall = true;
    }
    if (c.hitT > 0) c.hitT -= dt;

    // どうにも動けなくなったら、コースの中心へ戻して立て直す
    if (Math.hypot(c.vx, c.vy) < 16) c.stuckT += dt; else c.stuckT = 0;
    if (c.stuckT > 1.1) {
      c.stuckT = 0;
      c.x = sN.x; c.y = sN.y; c.ang = sN.a;
      c.vx = Math.sin(sN.a)*55; c.vy = -Math.cos(sN.a)*55;
      c.hitT = 0.5;
    }
    c.lat = lat; c.fwd = fwd; c.onRoad = onRoad;
  }

  // ---------- ライバルの運転手（コンピュータ）----------
  // 人と同じく左右のハンドルだけ。少し先のコース上の点を狙い、曲がる側へ寄せた点に向けて切る。
  // この先がきつく曲がっていて速すぎるときは、早めに向きを入れて滑らせ、速度を落とす
  // （ブレーキが無いので、人と同じくこれが唯一の減速）。
  // P: l0,lk 見る先 / ik,cw 寄せ方 / th 切り始め / sv,v0 先のきつさと出してよい速さ / g,ma 向きの入れ方
  function wrapA(a){ while (a > Math.PI) a -= Math.PI*2; while (a < -Math.PI) a += Math.PI*2; return a; }
  function botSteer(c, P){
    var sp = Math.hypot(c.vx, c.vy);
    var j = Math.min(TRACK.length-1, c.idx + Math.max(2, Math.round((P.l0 + sp*P.lk) / STEP)));
    var a = Math.max(0, j - P.cw), b = Math.min(TRACK.length-1, j + P.cw);
    var off = Math.max(-1, Math.min(1, wrapA(TRACK[b].a - TRACK[a].a) * P.ik)) * 40;
    var tp = TRACK[j];
    var err = wrapA(Math.atan2(tp.x + tp.nx*off - c.x, -(tp.y + tp.ny*off - c.y)) - c.ang);
    var e = Math.min(TRACK.length-1, c.idx + P.sv);
    var turn = wrapA(TRACK[e].a - TRACK[c.idx].a);
    var vs = P.v0 / (0.3 + Math.abs(turn));
    if (sp > vs && Math.abs(turn) > 0.25) err += (turn > 0 ? 1 : -1) * Math.min(P.ma, (sp - vs) * P.g);
    return err > P.th ? 1 : err < -P.th ? -1 : 0;
  }

  // ライバルを1コマ動かし、ぶつかっていれば押し合う
  function stepRival(dt){
    var r = riv;
    if (!rivFin) {
      drive(r, botSteer(r, CH().P), dt);
      if (r.idx >= TRACK.length - 3) rivFin = time;
    } else {
      // ゴールしたら惰性で流して止まる（コースの先には道が無いので、ハンドルは切らない）
      var kd = Math.max(0, 1 - 1.6*dt);
      r.vx *= kd; r.vy *= kd; r.x += r.vx*dt; r.y += r.vy*dt;
      r.lat = 0;
    }
    // 差の表示用に、各点を通ったタイムを控える
    for (var i = r.seen + 1; i <= r.idx; i++) rivAt[i] = time;
    if (r.idx > r.seen) r.seen = r.idx;
    for (var j = r.mySeen + 1; j <= idx; j++) myAt[j] = time;
    if (idx > r.mySeen) r.mySeen = idx;

    // ライバルの轍と煙
    var fx = Math.sin(r.ang), fy = -Math.cos(r.ang), rx = Math.cos(r.ang), ry = Math.sin(r.ang);
    if (Math.abs(r.lat) > 34) {
      var wl = { x: r.x - rx*13.8 - fx*18, y: r.y - ry*13.8 - fy*18 };
      var wr = { x: r.x + rx*13.8 - fx*18, y: r.y + ry*13.8 - fy*18 };
      if (rivWheels) {
        marks.push({ x1:rivWheels.l.x, y1:rivWheels.l.y, x2:wl.x, y2:wl.y, h:TRACK[r.idx].h });
        marks.push({ x1:rivWheels.r.x, y1:rivWheels.r.y, x2:wr.x, y2:wr.y, h:TRACK[r.idx].h });
        while (marks.length > 1400) marks.shift();
      }
      if (Math.random() < dt*30) smoke.push({ x:(wl.x+wr.x)/2, y:(wl.y+wr.y)/2, r:3+Math.random()*5, life:1, h:TRACK[r.idx].h });
      rivWheels = { l:wl, r:wr };
    } else rivWheels = null;

    if (bumpT > 0) bumpT -= dt;
    var hit = Math.abs(idx - r.idx) < 40 ? collide(car, r) : 0;
    if (hit > 25 && bumpT <= 0) {
      bumpT = 0.25;
      if (window.WADACHI_AUDIO) WADACHI_AUDIO.hitWall();
      for (var s = 0; s < 4; s++) smoke.push({ x:(car.x+r.x)/2, y:(car.y+r.y)/2, r:3+Math.random()*5, life:1, h:TRACK[idx].h });
    }
  }

  // 2台の当たり。車体を前後2つの円で近似する（全長62・全幅31 に合わせて 前後±14・半径15.5）。
  // 重なったぶんを半分ずつ押し戻し、押し合う向きの速さを分け合う（同じ重さ）。
  // 車体の端に当たると向きも少し回る。戻り値は当たりの強さ（音を鳴らすかの目安）。
  var CR = 15.5, CO = 14, BOUNCE = 0.35, SPIN = 0.0004;
  function collide(a, b){
    var best = 0;
    for (var ia = -1; ia <= 1; ia += 2){
      for (var ib = -1; ib <= 1; ib += 2){
        var ax = a.x + Math.sin(a.ang)*CO*ia, ay = a.y - Math.cos(a.ang)*CO*ia;
        var bx = b.x + Math.sin(b.ang)*CO*ib, by = b.y - Math.cos(b.ang)*CO*ib;
        var dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
        if (d >= CR*2 || d < 0.001) continue;
        var nx = dx / d, ny = dy / d, ov = (CR*2 - d) / 2;
        a.x -= nx*ov; a.y -= ny*ov; b.x += nx*ov; b.y += ny*ov;
        var vr = (b.vx - a.vx)*nx + (b.vy - a.vy)*ny;   // 近づく速さ（マイナス＝近づいている）
        if (vr >= 0) continue;
        var jm = -(1 + BOUNCE) * vr / 2;
        a.vx -= nx*jm; a.vy -= ny*jm; b.vx += nx*jm; b.vy += ny*jm;
        // 当たった円の位置（車の中心から）× 受けた力 で回す
        var rax = ax - a.x, ray = ay - a.y, rbx = bx - b.x, rby = by - b.y;
        a.ang += SPIN * (rax*(-ny*jm) - ray*(-nx*jm));
        b.ang += SPIN * (rbx*( ny*jm) - rby*( nx*jm));
        if (jm > best) best = jm;
      }
    }
    return best * 2;
  }

  // ---------- 絵 ----------
  function visibleRuns(){
    var cx = camX + W/2, cy = camY + H/2, lim = (W+H)/2 + 140;
    var runs = [], cur = null;
    for (var i=0;i<TRACK.length;i++){
      var s = TRACK[i];
      if (Math.abs(s.x-cx) < lim && Math.abs(s.y-cy) < lim) {
        if (!cur) { cur = []; runs.push(cur); }
        cur.push(s);
      } else cur = null;
    }
    return runs;
  }

  function strokeRuns(runs, width, color, dash){
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
    for (var r=0;r<runs.length;r++){
      var run = runs[r];
      if (run.length < 2) continue;
      // 破線は道の始点からの距離に合わせる（画面が動いても模様がずれない）
      ctx.lineDashOffset = dash ? run[0].d : 0;   // 符号に注意。マイナスだと逆に2倍ずれる
      ctx.beginPath();
      ctx.moveTo(run[0].x - camX, run[0].y - camY);
      for (var i=1;i<run.length;i++) ctx.lineTo(run[i].x - camX, run[i].y - camY);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // 路面に薄く色を重ねて坂を見せる。
  // 塗り分けの境目は「コース上の走行距離」で決める。画面に映っている範囲の
  // 先頭を基準にすると、カメラが動くたびに境目がずれて模様が路面を這って見える。
  var TINTN = 3;        // 何刻みで塗り分けるか（7×3＝21ごと）
  function tintStart(run){
    for (var i = 0; i < run.length; i++){
      if (Math.round(run[i].d / STEP) % TINTN === 0) return i;
    }
    return run.length;
  }
  function hillTint(runs){
    ctx.lineWidth = HALF*2; ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
    for (var r = 0; r < runs.length; r++){
      var run = runs[r];
      for (var i = tintStart(run); i + TINTN < run.length; i += TINTN){
        var g0 = (run[i].g + run[i+TINTN].g) / 2;
        var al = Math.min(0.13, Math.abs(g0) * 0.75);
        if (al < 0.012) continue;        // ほぼ平らなところは塗らない（塗っても見えない）
        ctx.strokeStyle = (g0 >= 0 ? 'rgba(95,211,224,' : 'rgba(240,135,58,') + al.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(run[i].x - camX, run[i].y - camY);
        for (var k = 1; k <= TINTN; k++){
          ctx.lineTo(run[i+k].x - camX, run[i+k].y - camY);
        }
        ctx.stroke();
      }
    }
    ctx.lineCap = 'round';
  }

  function draw(){
    var cv0 = curView();
    if (cv0 === 'chase' || cv0 === 'tv' || cv0 === 'orbit') {
      drawExt(cv0);
      drawWeather(false);
      drawGhostGap();
      drawRivalGap();
      drawSpeed();
      drawProfile();
      return;
    }
    if (cv0 === 'cab') {
      drawCab();
      drawWeather(false);
      drawGhostGap();
      drawRivalGap();
      drawSpeed();
      drawProfile();
      return;
    }
    ctx.fillStyle = COL.ground;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = COL.groundDot;
    for (var g=0; g<44; g++){
      var gx = (((g*137) % 400) - camX*0.35) % 400, gy = (((g*211) % 400) - camY*0.35) % 400;
      gx = ((gx % 400)+400)%400; gy = ((gy % 400)+400)%400;
      if (gx < W && gy < H) ctx.fillRect(gx, gy, 2, 2);
    }

    var runs = visibleRuns();
    strokeRuns(runs, (HALF+WALL)*2, COL.wall);       // 路肩
    strokeRuns(runs, HALF*2 + 5, COL.edge);          // 白線
    strokeRuns(runs, HALF*2, COL.road);              // 路面
    hillTint(runs);                                  // 坂の色づけ

    // 轍
    if (marks.length) {
      ctx.strokeStyle = COL.mark; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath();
      for (var m=0;m<marks.length;m++){
        var mk = marks[m];
        var sx = mk.x1 - camX, sy = mk.y1 - camY;
        if (sx < -50 || sx > W+50 || sy < -50 || sy > H+50) continue;
        ctx.moveTo(sx, sy); ctx.lineTo(mk.x2 - camX, mk.y2 - camY);
      }
      ctx.stroke();
    }

    strokeRuns(runs, 2, COL.center, [12,16]);        // 中央線

    // スタート／ゴール
    drawGate(TRACK[0], '#E8E4D8');
    drawGate(TRACK[TRACK.length-1], '#5FD3E0');

    // 煙
    for (var s=0;s<smoke.length;s++){
      var sm = smoke[s];
      ctx.globalAlpha = Math.max(0, sm.life) * 0.5;
      ctx.fillStyle = COL.smoke;
      ctx.beginPath(); ctx.arc(sm.x - camX, sm.y - camY, sm.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawGhost();
    drawRival();
    drawCar();
    drawWeather(true);
    drawGhostGap();
    drawRivalGap();
    drawSpeed();
    drawProfile();
  }

  function showTitle2(){
    var e = veilBody.getElementsByClassName('gh')[0];
    if (e) e.textContent = ghostLine();
  }
  function ghostLine(){
    var tail = '　（画面下の GHOST／G キーで 切→自己→1位）';
    if (ghostMode === 0) return 'ゴースト：切' + tail;
    if (ghostMode === 2) {
      var t = topG[gameKey()];
      if (!t) return 'ゴースト：1位と勝負 — まだ誰も記録を出していません' + tail;
      return 'ゴースト：1位と勝負　' + t.name + '　' + fmt(t.score) + tail;
    }
    var sl = SL();
    if (!ghosts[sl]) return 'ゴースト：自己ベスト — まだ記録なし（1本 完走すると記録されます）' + tail;
    return 'ゴースト：自己ベスト　' + fmt(ghostT[sl]) + tail;
  }

  // コースの断面図。左下に小さく出し、いまの位置に点を打つ。
  // 路面を塗ると、画面が動くたびに模様がずれて這っているように見えるのでやめた。
  function drawProfile(){
    if (st === 'title' || !PROFILE || !PROFILE.length) return;
    var x0 = 10, y0 = H - 34, w = 96, h = 24, i;
    ctx.save();
    ctx.fillStyle = 'rgba(11,12,16,0.55)';
    ctx.fillRect(x0 - 4, y0 - 4, w + 8, h + 8);
    // 山の形
    ctx.beginPath();
    ctx.moveTo(x0, y0 + h);
    for (i = 0; i < PROFILE.length; i++){
      ctx.lineTo(x0 + w * i / (PROFILE.length - 1), y0 + h - PROFILE[i] * h);
    }
    ctx.lineTo(x0 + w, y0 + h);
    ctx.closePath();
    ctx.fillStyle = 'rgba(95,211,224,0.16)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(95,211,224,0.55)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // いまの位置
    var u = Math.max(0, Math.min(1, idx / Math.max(1, TRACK.length - 1)));
    var pi = u * (PROFILE.length - 1);
    var lo2 = Math.floor(pi), hi2 = Math.min(PROFILE.length - 1, lo2 + 1);
    var hh = PROFILE[lo2] + (PROFILE[hi2] - PROFILE[lo2]) * (pi - lo2);
    var px = x0 + w * u, py = y0 + h - hh * h;
    ctx.strokeStyle = 'rgba(232,228,216,0.30)';
    ctx.beginPath(); ctx.moveTo(px, y0); ctx.lineTo(px, y0 + h); ctx.stroke();
    ctx.fillStyle = '#F0873A';
    ctx.beginPath(); ctx.arc(px, py, 2.6, 0, 7); ctx.fill();
    ctx.restore();
  }

  // 速さは画面の右下に出す（盤の外より、走っている画の中のほうが見やすい）
  function drawSpeed(){
    if (st === 'title') return;
    var kmh = Math.round(Math.hypot(car.vx, car.vy) * 0.62);
    ctx.save();
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(11,12,16,0.55)';
    ctx.fillRect(W - 74, H - 46, 68, 40);
    ctx.fillStyle = 'rgba(232,228,216,0.50)';
    ctx.font = 'bold 9px Oxanium, monospace';
    ctx.fillText('KM/H', W - 12, H - 33);
    // 勾配（下りは＋・水色／上りは－・橙）
    var gr = TRACK[idx] ? TRACK[idx].g : 0;
    var pc = Math.round(gr * 100);
    ctx.fillStyle = 'rgba(11,12,16,0.55)';
    ctx.fillRect(W - 74, H - 70, 68, 21);
    ctx.fillStyle = pc >= 0 ? '#5FD3E0' : '#F0873A';
    ctx.font = 'bold 13px Oxanium, monospace';
    ctx.fillText((pc >= 0 ? '▼ ' : '▲ ') + Math.abs(pc) + '%', W - 12, H - 55);
    ctx.fillStyle = sliding ? '#FFC27A' : '#E8E4D8';
    ctx.font = 'bold 24px Oxanium, monospace';
    ctx.fillText(String(kmh), W - 12, H - 12);
    ctx.restore();
  }

  // ライバルの車。画面の外にいるときは、いる方向の画面のふちに印を出す
  function drawRival(){
    if (!story || !riv) return;
    var r = riv, x = r.x - camX, y = r.y - camY;
    if (x < -40 || x > W+40 || y < -40 || y > H+40) {
      if (st !== 'play') return;
      var cx = W/2, cy = H/2, dx = x - cx, dy = y - cy;
      var k = Math.min((W/2 - 12) / Math.max(1e-6, Math.abs(dx)), (H/2 - 12) / Math.max(1e-6, Math.abs(dy)));
      var ex = cx + dx*k, ey = cy + dy*k, an = Math.atan2(dy, dx);
      ctx.save();
      ctx.translate(ex, ey); ctx.rotate(an);
      ctx.fillStyle = r.col.body; ctx.strokeStyle = '#E8E4D8'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-6, -6); ctx.lineTo(-6, 6); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
      return;
    }
    var slipR = Math.abs(Math.atan2(r.lat || 0, Math.max(18, r.fwd || 0)));
    var blink = r.hitT > 0 && Math.floor(r.hitT*20) % 2 === 0;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(r.ang);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = COL.lamp;
    ctx.beginPath();
    ctx.moveTo(-9, -26); ctx.lineTo(-48, -196); ctx.lineTo(48, -196); ctx.lineTo(9, -26);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    drawCarNew(ctx, r.col, r.steerV, slipR > 0.18, slipR, blink, false);
    // 黒い車は夜の路面に溶けるので、ふちを薄く光らせる
    if (CH().boss && !blink) {
      ctx.strokeStyle = 'rgba(200,205,220,0.35)'; ctx.lineWidth = 1.2;
      bodyPath(ctx, 0, 0); ctx.stroke();
    }
    ctx.restore();
  }

  // ライバルとの差（秒）。マイナス＝自分が前
  function drawRivalGap(){
    if (!story || !riv || st !== 'play') return;
    var d = null;
    if (riv.idx > idx && rivAt[idx] !== undefined) d = time - rivAt[idx];
    else if (idx > riv.idx && myAt[riv.idx] !== undefined) d = -(time - myAt[riv.idx]);
    else d = 0;
    var txt = rivFin ? '相手がゴール' : (d > 0 ? '+' : d < 0 ? '-' : '±') + Math.abs(d).toFixed(2);
    ctx.save();
    ctx.font = 'bold 11px Oxanium, "Zen Kaku Gothic New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(11,12,16,0.62)';
    var w = rivFin ? 84 : 58;
    ctx.fillRect(W/2 - w/2, 5, w, 15);
    ctx.fillStyle = rivFin || d > 0 ? '#E0453A' : '#8CF0AE';
    ctx.fillText(txt, W/2, 16);
    ctx.restore();
  }

  function drawGhost(){
    var c = ghostNow();
    if (!c) return;
    ghost = c.arr;
    var g = ghostPose(time);
    if (!g) return;
    var x = g.x - camX, y = g.y - camY;
    if (x < -60 || x > W+60 || y < -60 || y > H+60) return;
    ctx.save();
    ctx.globalAlpha = 0.34;
    ctx.translate(x, y);
    ctx.rotate(g.ang);
    drawCarNew(ctx, c.col, 0, false, 0, false, false);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 手本との差。マイナスなら自分が前に出ている
  function drawGhostGap(){
    if (st !== 'play' || story) return;
    var c = curGhost();
    if (!c) return;
    ghost = c.arr;
    var gt = ghostTimeAt(idx);
    if (gt < 0) return;
    var d = time - gt;
    var txt = (d >= 0 ? '+' : '-') + Math.abs(d).toFixed(2);
    ctx.save();
    ctx.font = 'bold 11px Oxanium, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(11,12,16,0.55)';
    ctx.fillRect(W/2 - 25, 5, 50, 14);
    ctx.fillStyle = d <= 0 ? c.col.body : '#E0453A';
    ctx.fillText(txt, W/2, 15.5);
    ctx.restore();
  }


  // ================= リプレイ =================
  // 走りの記録（0.05秒ごとの 位置・向き・コース上の番号）を再生する。
  // 自分の直前の走り（物語なら相手の車も、タイムアタックなら一緒に走ったゴーストも）と、
  // ゴーストの走りの2種類。再生中は視点を 中継→追いかけ→運転席→上から と切り替えられる。
  var rp = null;                 // 再生中の情報
  var lastRun = null;            // 直前の自分の走り
  var rivRec = [];               // 物語の相手の走り（自分の記録と同じ形）
  var RVIEWS = ['auto', 'tv', 'chase', 'orbit', 'cab', 'top'];
  var RVNAME = { auto:'おまかせ', tv:'中継', chase:'追いかけ', orbit:'回り込み', cab:'運転席', top:'上から' };
  var rview = 'auto';
  // おまかせ：中継→追いかけ→中継→回り込み を、場面ごとに切り替える
  var AUTO_SEQ = [['tv', 4.5], ['chase', 3.5], ['tv', 4.5], ['orbit', 3.2]];
  var chase = { x:0, y:0, z:0, yaw:0 };
  var rpui = document.getElementById('rpui');
  var rpView = document.getElementById('rpView');
  var rpSlow = document.getElementById('rpSlow');
  var rpEnd = document.getElementById('rpEnd');

  // 自分の車の色（ゴーストのリプレイ中はゴーストの色）
  function myCol(){ return st === 'replay' && rp && rp.col ? rp.col : COL.body; }
  // いま描くべき視点（リプレイ中はリプレイの視点）
  function curView(){
    if (st !== 'replay') return view;
    return rview === 'auto' ? AUTO_SEQ[rp.autoI][0] : rview;
  }
  function is3D(){ return curView() !== 'top'; }

  // いま一緒に走らせるゴースト（無ければ null）
  function ghostNow(){
    if (st === 'replay') return rp && rp.gh ? rp.gh : null;
    if (st === 'play' && !story) return curGhost();
    return null;
  }

  // 記録 arr の t 秒時点の姿
  function poseOf(arr, t){
    var n = arr.length / 4;
    var f = Math.max(0, Math.min(n - 1.0001, t / GH_DT)), i = Math.floor(f), u = f - i;
    var a = i*4, b = Math.min(n-1, i+1)*4;
    var da = arr[b+2] - arr[a+2];
    while (da >  Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    return { x: arr[a] + (arr[b]-arr[a])*u, y: arr[a+1] + (arr[b+1]-arr[a+1])*u,
             ang: arr[a+2] + da*u, idx: u < 0.5 ? arr[a+3] : arr[b+3] };
  }

  // 結果の画面などに出すリプレイのボタン
  function replayRow(){
    var h = '';
    if (lastRun && lastRun.course === courseIdx && lastRun.story === story && lastRun.rec.length >= 8)
      h += '<button type="button" class="rpb" data-replay="me">▶ リプレイ</button>';
    if (!story && curGhost()) h += '<button type="button" class="rpb" data-replay="ghost">▶ ゴーストのリプレイ</button>';
    return h ? '<br><span class="rprow">' + h + '</span>' : '';
  }

  function startReplay(kind){
    var src;
    if (kind === 'me') {
      if (!lastRun || lastRun.course !== courseIdx) return;
      src = { rec: lastRun.rec, riv: lastRun.riv, gh: lastRun.gh };
    } else {
      var g = curGhost();
      if (!g) return;
      src = { rec: g.arr, riv: null, gh: null, col: g.col.body };   // ゴーストの走りはゴーストの色で
    }
    rp = { kind: kind, arr: src.rec, riv: src.riv, gh: src.gh, col: src.col || null, t: 0, speed: 1,
           autoI: 0, autoT: 0, orbitA: 0,
           end: (src.rec.length / 4 - 1) * GH_DT,
           prev: { st: st, title: veilTitle.textContent, body: veilBody.innerHTML, btn: goBtn.textContent } };
    st = 'replay';
    if (window.SCOREBOARD) SCOREBOARD.hide();
    veil.classList.add('off'); countEl.classList.add('off');
    marks.length = 0; smoke.length = 0; lastWheels = null; rivWheels = null;
    score = 0; pending = 0; mult = 1;
    if (!story) riv = null;
    applyReplay(0, 0);
    camX = car.x - W/2; camY = car.y - H/2;
    cabYaw = car.ang; cabPitch = pitchAt(idx);
    resetChase();
    if (window.WADACHI_AUDIO) WADACHI_AUDIO.start(courseIdx % 3);
    rpui.hidden = false;
    syncRp();
    layout();
    lastT = 0;
  }
  function endReplay(){
    if (!rp) return;
    var p = rp.prev;
    rp = null;
    rpui.hidden = true;
    if (window.WADACHI_AUDIO) WADACHI_AUDIO.stop();
    st = p.st;
    if (st === 'title') reset();
    veilTitle.textContent = p.title; veilBody.innerHTML = p.body; goBtn.textContent = p.btn;
    veil.classList.remove('off');
    layout();
  }
  function syncRp(){
    rpView.textContent = '視点 ' + RVNAME[rview] + (rview === 'auto' && rp ? '（' + RVNAME[AUTO_SEQ[rp.autoI][0]] + '）' : '');
    rpSlow.textContent = rp && rp.speed < 1 ? 'スロー中' : 'スロー';
    rpSlow.classList.toggle('on', !!(rp && rp.speed < 1));
  }
  function cycleRview(){
    rview = RVIEWS[(RVIEWS.indexOf(rview) + 1) % RVIEWS.length];
    try { localStorage.setItem('wadachi.rview', rview); } catch(e){}
    syncRp(); layout();
  }
  function toggleSlow(){ if (rp) { rp.speed = rp.speed < 1 ? 1 : 0.35; syncRp(); } }
  rpView.addEventListener('click', function(){ cycleRview(); rpView.blur(); });
  rpSlow.addEventListener('click', function(){ toggleSlow(); rpSlow.blur(); });
  rpEnd.addEventListener('click', function(){ endReplay(); rpEnd.blur(); });
  try { var rv0 = localStorage.getItem('wadachi.rview'); if (RVIEWS.indexOf(rv0) >= 0) rview = rv0; } catch(e){}

  // 記録から t 秒時点の車の状態を組み立て、自分の車（と相手の車）に入れる
  function applyReplay(t, dt){
    var h = 0.03;
    var p = poseOf(rp.arr, t), pa = poseOf(rp.arr, Math.max(0, t - h)), pb = poseOf(rp.arr, t + h);
    var span = Math.max(1e-3, (Math.min(rp.end, t + h) - Math.max(0, t - h)));
    car.x = p.x; car.y = p.y; car.ang = p.ang;
    car.vx = (pb.x - pa.x) / span; car.vy = (pb.y - pa.y) / span;
    idx = p.idx; car.idx = idx; time = t;
    var sp = Math.hypot(car.vx, car.vy);
    // ハンドル：向きの変わる速さから逆算（式は drive と同じ）
    var dA = pb.ang - pa.ang;
    while (dA >  Math.PI) dA -= Math.PI*2;
    while (dA < -Math.PI) dA += Math.PI*2;
    var w = dA / span;
    steerV = Math.max(-1, Math.min(1, w / (TURN * Math.max(0.32, Math.min(1, sp/70)))));
    car.steerV = steerV;
    var fx = Math.sin(car.ang), fy = -Math.cos(car.ang), rx = Math.cos(car.ang), ry = Math.sin(car.ang);
    var fwd = car.vx*fx + car.vy*fy, lat = car.vx*rx + car.vy*ry;
    var slip = Math.abs(Math.atan2(lat, Math.max(18, fwd)));
    lastSlip = slip; lastSp = sp;
    sliding = (slip > 0.18 && sp > 80);
    // ドリフト中は、前輪を「進んでいく向き」へ向ける（カウンターを当てている姿）。
    // 記録にはハンドルの操作が無いので、車体の向きと進む向きのずれから決める
    if (slip > 0.12 && sp > 50) {
      // ずれの角度そのままを切る（最大 約46度で止まる）
      steerV = Math.max(-1, Math.min(1, Math.atan2(lat, Math.max(1, fwd)) / WLOCK));
      car.steerV = steerV;
    }
    if (dt > 0) {
      if (sliding) { driftT += dt; mult = Math.min(8, 1 + Math.floor(driftT / 1.5)); pending += slip * sp * dt * 1.6; idleT = 0; }
      else { idleT += dt; if (pending > 0 && idleT > 0.4) bank(); }
      // 轍と煙（走っているときと同じ作り方）
      var wl = { x: car.x - rx*13.8 - fx*18, y: car.y - ry*13.8 - fy*18 };
      var wr = { x: car.x + rx*13.8 - fx*18, y: car.y + ry*13.8 - fy*18 };
      if (Math.abs(lat) > 34) {
        if (lastWheels) {
          marks.push({ x1:lastWheels.l.x, y1:lastWheels.l.y, x2:wl.x, y2:wl.y, h:TRACK[idx].h });
          marks.push({ x1:lastWheels.r.x, y1:lastWheels.r.y, x2:wr.x, y2:wr.y, h:TRACK[idx].h });
          while (marks.length > 1400) marks.shift();
        }
        if (Math.random() < dt*30) smoke.push({ x:(wl.x+wr.x)/2, y:(wl.y+wr.y)/2, r:3+Math.random()*5, life:1, h:TRACK[idx].h });
        lastWheels = { l:wl, r:wr };
      } else lastWheels = null;
      for (var s = smoke.length-1; s >= 0; s--){
        var sm = smoke[s]; sm.r += 20*dt; sm.life -= dt*1.2;
        if (sm.life <= 0) smoke.splice(s, 1);
      }
    }
    // 物語の相手
    if (rp.riv && riv) {
      var q = poseOf(rp.riv, t), qa = poseOf(rp.riv, Math.max(0, t - h)), qb = poseOf(rp.riv, t + h);
      riv.x = q.x; riv.y = q.y; riv.ang = q.ang; riv.idx = q.idx;
      riv.vx = (qb.x - qa.x) / span; riv.vy = (qb.y - qa.y) / span;
      var rfx = Math.sin(riv.ang), rfy = -Math.cos(riv.ang);
      riv.fwd = riv.vx*rfx + riv.vy*rfy; riv.lat = riv.vx*Math.cos(riv.ang) + riv.vy*Math.sin(riv.ang);
      // 相手の車も、滑っている間は前輪を進む向きへ
      var rlat = riv.lat, rfwd = riv.fwd, rsp = Math.hypot(riv.vx, riv.vy);
      riv.steerV = (rsp > 50 && Math.abs(Math.atan2(rlat, Math.max(18, rfwd))) > 0.12)
        ? Math.max(-1, Math.min(1, Math.atan2(rlat, Math.max(1, rfwd)) / WLOCK)) : 0;
      riv.hitT = 0;
      // 相手の轍も残す
      if (dt > 0) {
        var rrx = Math.cos(riv.ang), rry = Math.sin(riv.ang);
        if (Math.abs(riv.lat) > 34) {
          var rwl = { x: riv.x - rrx*13.8 - rfx*18, y: riv.y - rry*13.8 - rfy*18 };
          var rwr = { x: riv.x + rrx*13.8 - rfx*18, y: riv.y + rry*13.8 - rfy*18 };
          if (rivWheels) {
            marks.push({ x1:rivWheels.l.x, y1:rivWheels.l.y, x2:rwl.x, y2:rwl.y, h:TRACK[riv.idx].h });
            marks.push({ x1:rivWheels.r.x, y1:rivWheels.r.y, x2:rwr.x, y2:rwr.y, h:TRACK[riv.idx].h });
            while (marks.length > 1400) marks.shift();
          }
          rivWheels = { l:rwl, r:rwr };
        } else rivWheels = null;
      }
    }
  }

  function stepReplay(dt){
    var d = dt * rp.speed;
    rp.t += d;
    if (rp.t >= rp.end) { endReplay(); return; }
    applyReplay(rp.t, d);
    // おまかせのカメラ切り替え（スロー中は長めに見せる）
    rp.autoT += dt;
    if (rview === 'auto' && rp.autoT >= AUTO_SEQ[rp.autoI][1]) {
      rp.autoT = 0; rp.autoI = (rp.autoI + 1) % AUTO_SEQ.length;
      if (AUTO_SEQ[rp.autoI][0] === 'chase') resetChase();
      syncRp(); layout();
    }
    rp.orbitA += d * 0.55;
    // 上からの視点のカメラ（走っているときと同じ追い方）
    var tx = car.x + car.vx*0.42 - W/2, ty = car.y + car.vy*0.42 - H/2;
    var k = Math.min(1, 6.5*d);
    camX += (tx - camX) * k; camY += (ty - camY) * k;
    followCab(d);
    followChase(d);
  }
  // 追いかけカメラ：進む向きの後ろ上から。滑ると車が斜めに見える（走っている間もリプレイでも使う）
  function followChase(d){
    var sp = Math.hypot(car.vx, car.vy);
    var dirA = sp > 20 ? Math.atan2(car.vx, -car.vy) : car.ang;
    chase.yaw += wrapA(dirA - chase.yaw) * Math.min(1, 3.5*d);
    var base = TRACK[idx] ? TRACK[idx].h : 0;
    var cx = car.x - Math.sin(chase.yaw)*82, cy = car.y + Math.cos(chase.yaw)*82;
    var kk = Math.min(1, 7*d);
    chase.x += (cx - chase.x) * kk; chase.y += (cy - chase.y) * kk;
    chase.z += (base + 30 - chase.z) * kk;
  }
  function resetChase(){
    chase.yaw = car.ang;
    chase.x = car.x - Math.sin(car.ang)*82; chase.y = car.y + Math.cos(car.ang)*82;
    chase.z = (TRACK[idx] ? TRACK[idx].h : 0) + 30;
  }

  // 中継カメラ：コースの外側（曲がる側の反対）に、ほぼ一定の間隔で立てる
  var tvCams = [], tvFor = -1;
  function buildTv(){
    tvCams = []; tvFor = courseIdx;
    var n = TRACK.length;
    for (var i = 24; i < n - 8; i += 46){
      var a = TRACK[Math.max(0, i-10)].a, b = TRACK[Math.min(n-1, i+10)].a;
      var side = (b - a) > 0 ? -1 : 1;
      if (Math.abs(b - a) < 0.05) side = (i / 46) % 2 ? 1 : -1;
      var t = TRACK[i], o = side * (HALF + WALL + 30);
      tvCams.push({ i: i, x: t.x + t.nx*o, y: t.y + t.ny*o, z: t.h + 34 });
    }
  }

  // 外からの視点（中継・追いかけ）
  function drawExt(v){
    var base = TRACK[idx] ? TRACK[idx].h : 0;
    var cam, F, tz = base + 7;
    if (v === 'tv') {
      if (tvFor !== courseIdx) buildTv();
      var best = null, bd = 1e9;
      for (var i = 0; i < tvCams.length; i++){
        var dd = Math.abs(tvCams[i].i - (idx + 12));
        if (dd < bd) { bd = dd; best = tvCams[i]; }
      }
      var dx = car.x - best.x, dy = car.y - best.y, hd = Math.hypot(dx, dy);
      var fov = Math.max(0.22, Math.min(1.1, 2 * Math.atan(75 / Math.max(1, hd))));   // 遠いほど寄せる
      F = (W/2) / Math.tan(fov/2);
      cam = makeCam(best.x, best.y, best.z, Math.atan2(dx, -dy), Math.atan2(tz - best.z, hd));
    } else if (v === 'orbit') {
      // 回り込み：車のまわりを低い位置からゆっくり回る
      var oa = car.ang + 2.2 + rp.orbitA;
      var ox = car.x + Math.sin(oa)*64, oy = car.y - Math.cos(oa)*64, oz = base + 11;
      F = (W/2) / Math.tan(0.95/2);
      cam = makeCam(ox, oy, oz, Math.atan2(car.x - ox, -(car.y - oy)), Math.atan2(base + 6 - oz, 64));
    } else {
      var lx = car.x + Math.sin(chase.yaw)*24, ly = car.y - Math.cos(chase.yaw)*24;
      var ddx = lx - chase.x, ddy = ly - chase.y;
      F = (W/2) / Math.tan(1.05/2);
      cam = makeCam(chase.x, chase.y, chase.z, Math.atan2(ddx, -ddy), Math.atan2(tz - chase.z, Math.hypot(ddx, ddy)));
    }
    var vp = { x:0, y:0, w:W, h:H, cx:W/2, hor:H*0.45, F:F, flip:false, wide:(W/2)/F, marks:true, self:true };
    ctx.save();
    scene(cam, vp);
    ctx.restore();
  }

  // ================= 運転席からの視点 =================
  // コースの点（x, y と高さ h）をそのまま3次元に起こして、運転席の目の高さから見る。
  // 世界は x（右）・y（下）・z（上）。前は (sin a, -cos a)、右は (cos a, sin a)。
  var view = 'top';
  var cabYaw = 0, cabPitch = 0;
  var EYE = 15.5;        // 目の高さ（車の全長62≒4.4m なので、約1.1m。スポーツカーの低い座面）
  var CAB_FOV = 1.25;    // 横の見える角度（ラジアン）
  var CAB_NEAR = 3;
  // 視線：ドリフト中は鼻先と進む向きの中間を見る（出口を見る感じ）
  function followCab(dt){
    var sp = Math.hypot(car.vx, car.vy), tgt = car.ang;
    if (sp > 30) {
      // 進む向きと「少し先のコース上の点」の両方を見る（道の行き先を目で追う）
      var vAng = car.ang + wrapA(Math.atan2(car.vx, -car.vy) - car.ang);
      var tp = TRACK[Math.min(TRACK.length-1, idx + Math.round((70 + sp*0.30) / STEP))];
      var aAng = vAng + wrapA(Math.atan2(tp.x - car.x, -(tp.y - car.y)) - vAng);
      var look = vAng + wrapA(aAng - vAng) * 0.6;
      tgt = car.ang + Math.max(-1.75, Math.min(1.75, wrapA(look - car.ang)));   // 真横（90度）を少し越えるまで向ける
    }
    cabYaw += wrapA(tgt - cabYaw) * Math.min(1, 9 * dt);
    cabPitch += (pitchAt(idx) - cabPitch) * Math.min(1, 6 * dt);
  }
  // 車は坂に沿って前へ傾く。下り（g が＋）は鼻先が下がる
  function pitchAt(i){ var t = TRACK[i] || TRACK[0]; return -0.10 - Math.atan(t.g); }

  // 色を夜の暗さへ溶かす（t=0 そのまま、1 で真っ暗）
  // 霧の色と、真っ暗（霧なら真っ白）になる遠さ。天気で変わる
  var FOG = { r:14, g:16, b:21, dist:1300 };
  function setFog(){
    if (weather === 'fog') { FOG.r = 52; FOG.g = 56; FOG.b = 64; FOG.dist = 360; }
    else { FOG.r = 14; FOG.g = 16; FOG.b = 21; FOG.dist = 1300; }
  }
  function fogC(rgb, t){
    var k = 1 - Math.max(0, Math.min(1, t));
    return 'rgb(' + Math.round(FOG.r + (rgb[0]-FOG.r)*k) + ',' + Math.round(FOG.g + (rgb[1]-FOG.g)*k) + ',' + Math.round(FOG.b + (rgb[2]-FOG.b)*k) + ')';
  }
  function rgbOf(hex){ var n = parseInt(hex.slice(1), 16); return [(n>>16)&255, (n>>8)&255, n&255]; }
  var RGB_GROUND = [30,38,31];   // 道の外の地面（夜の草地）
  var RGB_WET = [52,58,70];      // 雨で濡れた路面（少し明るく、青みがかる）
  var RGB_ROAD = [44,46,54], RGB_EDGE = [200,196,184], RGB_WALL = [58,46,38], RGB_RAIL = [88,86,84], RGB_CEN = [110,106,96];

  // カメラ cam から見た座標へ
  function toC(cam, x, y, z){
    var dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
    var Z = dx*cam.fx + dy*cam.fy, X = dx*cam.rx + dy*cam.ry;
    return { X:X, Y: dz*cam.cp - Z*cam.sp, Z: Z*cam.cp + dz*cam.sp };
  }
  // 手前で切れる多角形を、見える分だけにして画面の座標へ（[x0,y0,x1,y1,...]。見えなければ null）
  function projC(vp, pts){
    var out = [], i, a, b, sg = vp.flip ? -1 : 1;
    for (i = 0; i < pts.length; i++){
      a = pts[i]; b = pts[(i+1) % pts.length];
      var ain = a.Z >= CAB_NEAR, bin = b.Z >= CAB_NEAR;
      if (ain) out.push(vp.cx + sg*a.X*vp.F/a.Z, vp.hor - a.Y*vp.F/a.Z);
      if (ain !== bin){
        var t = (CAB_NEAR - a.Z) / (b.Z - a.Z);
        var X = a.X + (b.X-a.X)*t, Y = a.Y + (b.Y-a.Y)*t;
        out.push(vp.cx + sg*X*vp.F/CAB_NEAR, vp.hor - Y*vp.F/CAB_NEAR);
      }
    }
    return out.length >= 6 ? out : null;
  }
  function pathOf(sp){
    ctx.moveTo(sp[0], sp[1]);
    for (var i = 2; i < sp.length; i += 2) ctx.lineTo(sp[i], sp[i+1]);
    ctx.closePath();
  }
  function polyC(vp, pts, fill, seam){
    var sp = projC(vp, pts);
    if (!sp) return;
    ctx.fillStyle = fill;
    ctx.beginPath(); pathOf(sp); ctx.fill();
    // 区間どうしの継ぎ目に細い隙間が見えるので、同じ色で縁をなぞって埋める
    if (seam) { ctx.strokeStyle = fill; ctx.lineWidth = 0.9; ctx.stroke(); }
  }
  // 同じ色の多角形をためておき、色ごとに1回で塗る（塗る回数を減らして軽くする）
  function batch(vp){ return { vp: vp, keys: [], map: {} }; }
  function bAdd(B, pts, fill){
    var sp = projC(B.vp, pts);
    if (!sp) return;
    var a = B.map[fill];
    if (!a) { a = B.map[fill] = []; B.keys.push(fill); }
    a.push(sp);
  }
  function bFlush(B, seam){
    for (var k = 0; k < B.keys.length; k++){
      var key = B.keys[k], list = B.map[key];
      ctx.beginPath();
      for (var i = 0; i < list.length; i++) pathOf(list[i]);
      ctx.fillStyle = key; ctx.fill();
      if (seam) { ctx.strokeStyle = key; ctx.lineWidth = 0.9; ctx.stroke(); }
    }
  }
  function makeCam(x, y, z, yaw, pitch){
    return { x:x, y:y, z:z, fx:Math.sin(yaw), fy:-Math.cos(yaw), rx:Math.cos(yaw), ry:Math.sin(yaw),
             cp:Math.cos(pitch), sp:Math.sin(pitch), yaw:yaw, pitch:pitch };
  }

  // ---------- 相手の車（ライバル・ゴースト）の立体 ----------
  // 上から見た車（drawCarNew）と同じ形・同じ配色になるよう、同じ寸法から起こす。
  // 座標は上から見た絵と同じ：x 右・y 後ろ（前が -y）・z 路面からの高さ。
  // 角ばって見えないように：輪郭の点を細かくとり、車体の上半分は内側へ丸めて寝かせ、
  // 屋根も中央を盛り上げ、タイヤは円柱、足もとに影を落とす。
  var CAR3 = null;
  function quadPts(out, x0, y0, cx, cy, x1, y1, n){
    for (var i = 1; i <= n; i++){
      var t = i / n, a = (1-t)*(1-t), b = 2*(1-t)*t, c = t*t;
      out.push([a*x0 + b*cx + c*x1, a*y0 + b*cy + c*y1]);
    }
  }
  function buildCar3(){
    // 車体の輪郭（bodyPath と同じ線）。左側を前→後ろに作り、右側はその鏡写し
    var L = [[-6.2,-31.2], [-9.0,-30.4], [-11.4,-28.6]], i, k;
    // 泥よけの張り出しは控えめに（市販車くらい。上から見た絵ほどは張り出さない）
    quadPts(L, -11.4,-28.6, -13.7,-25.6, -13.6,-18.5, 6);   // 前の張り出し
    quadPts(L, -13.6,-18.5, -12.5,-5.0,  -12.6,  8.0, 8);   // 胴を絞る
    quadPts(L, -12.6,  8.0, -14.1,13.0,  -14.0, 21.0, 6);   // 後ろの張り出し
    L.push([-13.4,25.5], [-11.2,30.0], [-6.0,30.4]);
    var ring = L.slice();
    for (i = L.length - 1; i >= 0; i--) ring.push([-L[i][0], L[i][1]]);
    var n = ring.length;
    // 各点の外向き（となりの辺の向きの平均）
    var nor = [];
    for (i = 0; i < n; i++){
      var a = ring[(i-1+n) % n], b = ring[(i+1) % n];
      var dx = b[0]-a[0], dy = b[1]-a[1], l = Math.hypot(dx, dy) || 1;
      var ox = dy / l, oy = -dx / l;
      if (ox*ring[i][0] + oy*ring[i][1] < 0){ ox = -ox; oy = -oy; }
      nor.push([ox, oy]);
    }
    function inset(i, d){ return [ring[i][0] - nor[i][0]*d, ring[i][1] - nor[i][1]*d]; }
    // 上の面の高さ：前が低く後ろが高い（長いボンネットが前へ下がる）
    // 上の面の高さ（横から見た形）。ボンネットは鼻先へ向けて丸く下がり、
    // 窓の下から後ろは室内の下、後窓の下端から先は短く ほぼ平らな荷室のふた
    function zt(y){
      if (y < -11.5) { var t = (y + 31) / 19.5; return 8.6 + 2.6 * (1 - (1 - t) * (1 - t)); }
      if (y < 19)    return 11.2 + (y + 11.5) / 30.5 * 1.6;
      return 12.8 - (y - 19) / 11.4 * 0.7;
    }
    var F = [], D = [];   // F: 面、D: あとから貼る飾り（灯火・ホイール）
    var ZB = 3.4, ZS = 8.2;          // 車体の下端、肩（ここから上は内側へ丸める）。タイヤの下半分が見える高さ
    // タイヤハウスの丸い縁の高さ（その場所が切り欠きの中でなければ -1e9）。前は鼻先側のボンネットより低く収める
    function archZ(x, y){
      if (Math.abs(x) < 9.5) return -1e9;
      var d = y + 18.5;
      if (Math.abs(d) < 5.7) return 4.8 + Math.sqrt(5.7*5.7 - d*d);
      d = y - 18.5;
      if (Math.abs(d) < 6.0) return 5.0 + Math.sqrt(6.0*6.0 - d*d);
      return -1e9;
    }
    // 帯を1枚足す。下の縁がタイヤハウスに掛かる所は、縁を丸く持ち上げる（上の縁を越えたら、そこは切り欠き）
    function band(a, b, za, zb, c, d, zc, zd){
      var ya = Math.max(za, archZ(a[0], a[1])), yb = Math.max(zb, archZ(b[0], b[1]));
      if (ya >= zc && yb >= zd) return;
      ya = Math.min(ya, zc); yb = Math.min(yb, zd);
      F.push([[[a[0],a[1],ya], [b[0],b[1],yb], [d[0],d[1],zd], [c[0],c[1],zc]], 'body']);
    }
    for (i = 0; i < n; i++){
      var j = (i+1) % n, p = ring[i], q = ring[j], pi = inset(i, 1.0), qi = inset(j, 1.0),
          pt = inset(i, 2.4), qt = inset(j, 2.4);
      // 側面は3段（下の帯・肩・上へ回り込む面）。タイヤの所は、丸いタイヤハウスの形に下の縁を持ち上げて切り欠く
      var mp = (ZS + zt(p[1])) / 2 + 0.5, mq = (ZS + zt(q[1])) / 2 + 0.5;
      band(p, q, ZB, ZB, p, q, ZS, ZS);                      // 下の帯
      band(p, q, ZS, ZS, pi, qi, mp, mq);                    // 肩
      band(pi, qi, mp, mq, pt, qt, zt(p[1]), zt(q[1]));      // 上へ回り込む
    }
    // 上の面（ボンネット・荷室のふた）。前後に細かく区切った帯にして、場所ごとに傾きで明るさが変わるように
    var nL = L.length;
