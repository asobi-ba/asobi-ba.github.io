<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="左右のハンドルだけで走る夜の峠のドリフトタイムアタック。滑った跡が路面に黒く残る。">
  <meta name="theme-color" content="#12131A">
  <!-- スマホで「ホーム画面に追加」すると、上下のバーが消えて全画面で遊べる -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="黒い轍">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    /* 単体のページとして成立させるための最低限の土台 */
    :root{
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    body{ margin:0; font:14px system-ui,-apple-system,"Segoe UI",sans-serif; background:#12131A; }
    img{ max-width:100%; }
    [hidden]{ display:none !important; }
  </style>
<title>黒い轍</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  /* 夜の峠に振り切った配色。明暗の切り替えはせず、この一色で通す */
  :root{
    color-scheme: dark;
    --night:#0B0C10;
    --panel:#14161C;
    --line:rgba(232,228,216,.14);
    --text:#E8E4D8;
    --dim:#7C7A73;
    --amber:#F0873A;
    --amber-hi:#FFC27A;
    --cool:#5FD3E0;
    --red:#E0453A;
  }
  html,body{height:100%}
  /* スマホは上下のバーの出入りで高さが変わる。dvh なら実際に見えている高さになる */
  @supports (height:100dvh){ html,body{height:100dvh} }
  body{overscroll-behavior:none}

  /* 全画面のときは上下の飾りを消して、遊ぶ面だけにする */
  html.fs .masthead, html.fs .legend{display:none}
  html.fs .page{padding:4px 6px 6px}

  .fsbtn{
    position:fixed;right:8px;top:8px;z-index:60;
    width:34px;height:34px;padding:0;cursor:pointer;
    display:none;align-items:center;justify-content:center;
    font-family:'Zen Kaku Gothic New',system-ui,sans-serif;
    font-size:17px;font-weight:700;line-height:1;
    color:inherit;background:rgba(127,127,127,.20);
    border:1px solid rgba(127,127,127,.45);border-radius:4px;
    -webkit-tap-highlight-color:transparent;
  }
  .fsbtn.on{display:flex}
  .fsbtn:focus-visible{outline:2px solid currentColor;outline-offset:2px}
  body{
    margin:0;background:var(--night);color:var(--text);
    font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',system-ui,sans-serif;
  }
  .page{
    height:100%;box-sizing:border-box;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:10px 16px 14px;
  }

  .masthead{text-align:center;flex:0 0 auto}
  .masthead h1{
    margin:0;font-size:clamp(17px,4.6vw,22px);font-weight:700;
    letter-spacing:.42em;text-indent:.42em;
  }
  .masthead p{margin:2px 0 0;font-size:13.5px;color:var(--dim);letter-spacing:.1em}

  .stage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  .rig{display:inline-flex;flex-direction:column;gap:5px;max-width:100%}

  .tabs{display:flex;gap:4px}
  .tab{
    flex:1 1 0;min-width:0;
    font-family:'Zen Kaku Gothic New',sans-serif;font-size:14.5px;font-weight:500;
    letter-spacing:.08em;padding:6px 2px;cursor:pointer;
    color:var(--dim);background:var(--panel);
    border:1px solid var(--line);border-radius:0;
    display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.3;
  }
  .tab b{font-weight:700;font-size:16px;color:inherit}
  .tab i{font-style:normal;font-size:10.5px;opacity:.75}
  .tab.on{color:var(--amber);border-color:var(--amber);background:rgba(240,135,58,.10)}
  .tab:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  .tab.story.on{color:#8CF0AE;border-color:#8CF0AE;background:rgba(140,240,174,.08)}

  .dash{
    display:flex;align-items:center;gap:11px;
    background:var(--panel);border:1px solid var(--line);
    padding:6px 9px;
  }
  .dash .cell{display:flex;flex-direction:column;gap:1px;min-width:0}
  .dash .k{font-family:'Oxanium',monospace;font-size:9px;letter-spacing:.2em;color:var(--dim)}
  .dash .v{
    font-family:'Oxanium',monospace;font-weight:700;font-size:19.5px;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .dash .v.sm{font-size:14.5px}
  .dash .drift .v{color:var(--dim);transition:color .12s ease}
  .dash.sliding .drift .v{color:var(--amber-hi)}
  .dash .sp{flex:1}

  .prog{height:3px;background:var(--panel);border:1px solid var(--line);border-top:none}
  .prog i{display:block;height:100%;width:0;background:var(--cool)}

  .screen{
    position:relative;display:inline-block;line-height:0;
    border:1px solid var(--line);background:#000;max-width:100%;overflow:hidden;
  }
  canvas{display:block;touch-action:none}
  .glow{
    position:absolute;inset:0;pointer-events:none;opacity:0;
    box-shadow:inset 0 0 40px rgba(240,135,58,.55);
    transition:opacity .16s ease;
  }
  .glow.on{opacity:1}

  .count{
    position:absolute;inset:0;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
  }
  .count.off{display:none}
  .count span{
    display:grid;place-items:center;
    width:124px;height:124px;border-radius:50%;
    background:rgba(5,6,10,.82);
    border:3px solid rgba(240,135,58,.7);
    box-shadow:0 0 0 6px rgba(5,6,10,.45), 0 0 30px rgba(0,0,0,.7);
    font-family:'Oxanium',monospace;font-weight:700;font-size:73px;line-height:1;
    color:#FFF4E6;text-shadow:0 2px 10px rgba(0,0,0,.9);
    animation:pop .4s ease-out;
  }
  .count.go span{
    font-size:49px;letter-spacing:.12em;text-indent:.12em;
    color:#8CF0AE;border-color:rgba(140,240,174,.85);
  }
  @keyframes pop{ from{ transform:scale(1.35); opacity:.2 } to{ transform:scale(1); opacity:1 } }
  @media (prefers-reduced-motion:reduce){ .count span{animation:none} }

  .veil{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:11px;padding:20px;box-sizing:border-box;text-align:center;
    background:rgba(8,9,13,.92);line-height:1.75;
  }
  .veil.off{display:none}
  /* 項目が増えて画面に収まらないときは、幕の中だけ縦に送れるようにする */
  .veil{overflow-y:auto;justify-content:safe center}
  .veil > *{flex-shrink:0}

  /* ===== 順位表 ===== */
  .lb{
    width:min(100%,320px);font-size:14.5px;line-height:1.5;color:inherit;
    display:flex;flex-direction:column;gap:6px;
  }
  .lb.hide{display:none}
  .lb .lb-t{font-size:13px;letter-spacing:.18em;opacity:.65}
  .lb ol{
    list-style:none;margin:0;padding:0;
    display:flex;flex-direction:column;gap:2px;
    font-variant-numeric:tabular-nums;
  }
  .lb li{display:flex;gap:8px;align-items:baseline}
  .lb li .p{width:2.2em;text-align:right;opacity:.55}
  .lb li .n{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb li .s{font-weight:700}
  .lb li.me{font-weight:700;text-decoration:underline;text-underline-offset:3px}
  .lb li.me .p,.lb li.me .n,.lb li.me .s{opacity:1}
  .lb .lb-form{display:flex;gap:6px;align-items:center}
  .lb .lb-form input{
    flex:1;min-width:0;font:inherit;font-size:16px;
    padding:6px 8px;box-sizing:border-box;color:inherit;
    background:rgba(127,127,127,.18);
    border:1px solid rgba(127,127,127,.5);border-radius:2px;
  }
  .lb .lb-form button{
    font:inherit;font-size:14.5px;font-weight:700;white-space:nowrap;
    padding:7px 12px;cursor:pointer;color:inherit;
    background:rgba(127,127,127,.3);
    border:1px solid rgba(127,127,127,.55);border-radius:2px;
  }
  .lb .lb-form button:disabled{opacity:.45;cursor:default}
  .lb .lb-msg{font-size:13.5px;opacity:.75;min-height:1.2em}
  .lb .lb-msg.ng{opacity:1;font-weight:700}
  .lb .lb-warn{font-size:12px;opacity:.55}
  .veil h2{
    margin:0;font-family:'Oxanium',monospace;font-weight:700;
    font-size:clamp(14px,4.4vw,19px);letter-spacing:.16em;color:var(--amber);
  }
  .veil p{margin:0;font-size:14.5px;color:#C4C0B6;max-width:22em}
  .veil .course{font-size:18.5px;font-weight:700;color:var(--text);letter-spacing:.14em}
  .veil .course em{font-style:normal;font-size:12px;font-weight:400;color:var(--cool);letter-spacing:.1em}
  .veil .big{
    font-family:'Oxanium',monospace;font-weight:700;font-size:41.5px;
    font-variant-numeric:tabular-nums;color:var(--text);line-height:1;
  }
  /* 物語 */
  .veil .chap{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;letter-spacing:.12em;color:var(--dim)}
  .veil .chap .nav{
    font:inherit;font-size:12px;line-height:1;padding:4px 7px;cursor:pointer;
    color:var(--text);background:transparent;border:1px solid var(--line);border-radius:2px;
  }
  .veil .chap .nav:disabled{opacity:.25;cursor:default}
  .veil .who{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#C4C0B6;letter-spacing:.06em}
  .veil .who i{display:inline-block;width:14px;height:9px;border:1px solid rgba(232,228,216,.5)}
  .veil .who b{font-size:19px;color:var(--text);letter-spacing:.14em}
  .veil .line{display:inline-block;font-size:14.5px;color:var(--text);line-height:1.7}
  .veil .narr{display:inline-block;font-size:13.5px;color:#A9A59B;line-height:1.75;font-style:normal}
  .veil .fade{opacity:0;animation:fadeIn 1.2s ease forwards}
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }
  @media (prefers-reduced-motion:reduce){ .veil .fade{opacity:1;animation:none} }
  .veil .chips{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;max-width:20em;font-size:12.5px;color:#C4C0B6}
  .veil .chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .veil .chip i{display:inline-block;width:10px;height:7px;border:1px solid rgba(232,228,216,.5)}
  .veil .endbtn{margin-top:4px;font:inherit;font-size:12.5px;line-height:1.2;padding:5px 10px;cursor:pointer;color:var(--amber-hi);background:transparent;border:1px solid rgba(255,194,122,.5);border-radius:2px}
  .veil .pal{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:16em}
  .veil .sw{
    width:22px;height:22px;padding:0;cursor:pointer;border-radius:3px;
    border:1px solid rgba(232,228,216,.35);-webkit-tap-highlight-color:transparent;
  }
  .veil .sw.on{outline:2px solid var(--text);outline-offset:2px}
  .veil .sw:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  /* リプレイ */
  .rpui{
    position:absolute;left:6px;right:6px;top:6px;line-height:1.2;
    display:flex;align-items:center;gap:5px;flex-wrap:wrap;pointer-events:none;
  }
  .rpui .rptag{
    font-family:'Oxanium',monospace;font-weight:700;font-size:12px;letter-spacing:.2em;
    color:#E0453A;margin-right:auto;animation:rpblink 1.2s steps(2) infinite;
  }
  @keyframes rpblink{ 50%{ opacity:.25 } }
  @media (prefers-reduced-motion:reduce){ .rpui .rptag{animation:none} }
  .rpui button{
    pointer-events:auto;cursor:pointer;
    font-family:'Zen Kaku Gothic New',sans-serif;font-size:12px;font-weight:700;
    padding:5px 8px;color:var(--text);background:rgba(11,12,16,.72);
    border:1px solid rgba(232,228,216,.35);border-radius:2px;
  }
  .rpui button.on{color:var(--amber-hi);border-color:rgba(255,194,122,.6)}
  .rpui button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  .veil .dirrow{display:inline-flex;gap:6px}
  .veil .dirb{
    font:inherit;font-size:12.5px;font-weight:700;line-height:1.2;padding:4px 10px;cursor:pointer;
    color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:2px;
  }
  .veil .dirb.on{color:var(--amber);border-color:var(--amber)}
  .veil .dirb:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  .veil .rprow{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:2px}
  .veil .rpb{
    font:inherit;font-size:13px;font-weight:700;line-height:1.2;padding:6px 11px;cursor:pointer;
    color:var(--cool);background:transparent;border:1px solid rgba(95,211,224,.55);border-radius:2px;
  }
  .veil .rpb:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  .veil .narr.end{margin-top:6px;color:var(--amber-hi);letter-spacing:.12em}
  .veil .sub{font-family:'Oxanium',monospace;font-size:11px;letter-spacing:.18em;color:var(--cool)}
  .go{
    font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:.22em;text-indent:.22em;
    padding:9px 22px;cursor:pointer;
    color:#0B0C10;background:var(--amber);border:none;
  }
  .go:hover{background:var(--amber-hi)}
  .go:focus-visible{outline:2px solid var(--cool);outline-offset:3px}

  .vol{
    position:fixed;left:10px;bottom:10px;z-index:55;
    display:flex;align-items:center;gap:6px;
    font-family:'Oxanium',monospace;font-size:11px;letter-spacing:.14em;
    color:var(--cool);background:rgba(11,12,16,.55);
    border:1px solid rgba(196,192,182,.22);border-radius:3px;padding:5px 8px;
  }
  .veil .gh{ color:var(--cool);font-size:13.5px;letter-spacing:.04em; }
  .ghb{
    -webkit-appearance:none;appearance:none;cursor:pointer;
    font-family:'Oxanium',monospace;font-size:11px;letter-spacing:.14em;
    color:var(--dim);background:transparent;
    border:1px solid rgba(196,192,182,.22);border-radius:2px;padding:3px 6px;margin-left:4px;
  }
  .ghb.on{ color:var(--cool);border-color:rgba(95,211,224,.55); }
  .ghb.top{ color:#E8C07A;border-color:rgba(232,192,122,.6); }
  .vol input{
    -webkit-appearance:none;appearance:none;width:74px;height:3px;
    background:rgba(196,192,182,.3);border-radius:2px;outline:none;cursor:pointer;
  }
  .vol input::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;
    background:var(--amber);border:none;cursor:pointer;
  }
  .vol input::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:var(--amber);border:none;cursor:pointer;
  }
  .vol input:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

  .legend{
    flex:0 0 auto;width:100%;max-width:520px;
    border-top:1px solid var(--line);padding-top:7px;
    /* 音量バーが浮いているので、その高さぶん下を空ける */
    padding-bottom:46px;
    display:flex;flex-wrap:wrap;gap:4px 14px;
    font-size:13.5px;color:var(--dim);
  }
  .legend span{white-space:nowrap}
  @media (max-height:640px){ .masthead p{display:none} }
</style>
</head>
<body>
<button class="fsbtn" id="fsBtn" type="button" title="全画面" aria-label="全画面にする">全</button>
<div class="page">
  <div class="masthead">
    <h1>黒い轍</h1>
    <p>下りの峠をひとっ走り。ブレーキは無い、滑らせて止めろ</p>
  </div>

  <div class="stage" id="stage">
    <div class="rig" id="rig">
      <div class="tabs" id="tabs">
        <button class="tab on" type="button" data-c="0"><b>杉ノ沢</b><i>バランス</i></button>
        <button class="tab"    type="button" data-c="1"><b>鷹ノ巣</b><i>高速・長い</i></button>
        <button class="tab"    type="button" data-c="2"><b>蛇骨</b><i>ヘアピン連続</i></button>
        <button class="tab story" type="button" data-c="s"><b>物語</b><i>ライバル13人</i></button>
      </div>

      <div class="dash" id="dash">
        <div class="cell"><span class="k">TIME</span><span class="v" id="vTime">0.00</span></div>
        <div class="cell"><span class="k">BEST</span><span class="v sm" id="vBest">--</span></div>
        <div class="cell drift"><span class="k">DRIFT</span><span class="v sm" id="vDrift">0</span></div>
        <div class="sp"></div>
      </div>
      <div class="prog"><i id="progBar"></i></div>

      <div class="screen" id="screen">
        <canvas id="game" aria-label="黒い轍 ゲーム画面"></canvas>
        <div class="glow" id="glow" aria-hidden="true"></div>
        <div class="count off" id="count" aria-hidden="true"><span id="countN">3</span></div>
        <div class="rpui" id="rpui" hidden>
          <span class="rptag">REPLAY</span>
          <button type="button" id="rpView" title="V キーでも切り替え">視点 中継</button>
          <button type="button" id="rpSlow" title="S キーでも切り替え">スロー</button>
          <button type="button" id="rpEnd" title="Esc キーでも終わる">終わる</button>
        </div>
        <div class="veil" id="veil">
          <h2 id="veilTitle">TOUGE TIME ATTACK</h2>
          <p id="veilBody">
            左右だけ。アクセルは自動、ブレーキは無い。<br>
            ヘアピンは曲がりきれない。<br>
            <b>滑らせて速度を落とす</b>のが唯一の減速。
          </p>
          <div class="lb hide" id="lbBox"></div>
          <button class="go" id="goBtn" type="button">スタート</button>
        </div>
      </div>
    </div>
  </div>

  <div class="vol"><span>SOUND</span><input id="volSl" type="range" min="0" max="100" step="5" value="50" aria-label="音量"><button class="ghb" id="ghBtn" type="button" aria-pressed="true">GHOST</button><button class="ghb on" id="vwBtn" type="button">視点 上から</button><button class="ghb on" id="wxBtn" type="button">天気 晴れ</button><button class="ghb" id="tiltBtn" type="button" hidden>傾き 切</button></div>

  <div class="legend">
    <span>← → / A D でハンドル</span>
    <span>スマホは画面の左半分・右半分をおす</span>
    <span>Space＝スタート／やり直し</span>
    <span>P＝やすみ</span>
    <span>G＝ゴースト</span>
    <span>V＝視点</span>
  </div>
</div>

<script>
// ===== 黒い轍の音（ユーロビート）=====
// 音源ファイルは使わず、波形をその場で作る。
//   BGM  … コースごとに別の曲。四つ打ち・裏拍のオープンハイハット・
//           16分で転がるベース・ノコギリ波の主旋律という、ユーロビートの型。
//   タイヤの鳴き … 雑音を帯域で絞るだけでは「シャー」としか鳴らない。
//           実物は共鳴した音程を持ち、滑るほど高くなり、細かく震える。
//           そこで「高いQの帯域を3本＋低いうなり＋周波数と音量のゆらぎ」で作る。
(function(){
  var actx = null, master = null, musicG = null, seG = null;
  var vol = 0.5, ready = false;

  // ---------- 曲 ----------
  // 音度は base からの半音。-1 は休み。
  var TRACKS = [
    { // 0 杉ノ沢（バランス）イ短調
      bpm: 158, base: 220.00,
      root:  [110.00, 87.31, 130.81, 98.00, 110.00, 87.31, 130.81, 82.41],
      triad: [[220.00,261.63,329.63],[174.61,220.00,261.63],[261.63,329.63,392.00],
              [196.00,246.94,293.66],[220.00,261.63,329.63],[174.61,220.00,261.63],
              [261.63,329.63,392.00],[164.81,207.65,246.94]],
      bass:  [0,0,12,0, 0,0,12,0, 0,0,12,0, 0,12,0,12],
      lead: [
        [12,-1,10,-1, 7,-1,10,-1, 12,-1,-1,15, 14,-1,12,-1],
        [ 8,-1, 7,-1, 5,-1, 7,-1,  8,-1,-1,12, 10,-1, 8,-1],

  function norm(d, pk){
    var m = 0;
    for (var i = 0; i < d.length; i++){ var v = Math.abs(d[i]); if (v > m) m = v; }
    if (m > 0){ var sc = pk / m; for (var j = 0; j < d.length; j++) d[j] *= sc; }
    return d;

  // きれいな正弦波でゆらすとビブラート＝歌声になるので、乱数で震わせる。
  function jitData(sr){
    var hz = 42, n = Math.round(sr * 2.0), d = new Float32Array(n);
    var step = Math.round(sr / hz), a = Math.random()*2-1, b = Math.random()*2-1, k = 0;
    for (var i = 0; i < n; i++){
      var u = k / step;
      d[i] = a + (b - a) * (u*u*(3-2*u));
      k++;
      if (k >= step){ k = 0; a = b; b = Math.random()*2-1; }
    }
    var f = Math.round(sr * 0.02);
    for (var j = 0; j < f; j++){ var g = j / f; d[j] = d[j]*g + d[n-1-j]*(1-g); }
    return d;
  }

  function kickData(sr){
    var dur = 0.30, n = Math.round(sr * dur), d = new Float32Array(n), ph = 0;
    for (var i = 0; i < n; i++){

      var f = 45 + 78 * Math.exp(-t / 0.028);
      ph += 2 * Math.PI * f / sr;
      d[i] = Math.sin(ph) * Math.exp(-t / 0.085)
           + (Math.random()*2-1) * Math.exp(-t / 0.004) * 0.35;
    }
    return norm(d, 0.95);
  }
  function clapData(sr){
    var dur = 0.26, n = Math.round(sr * dur), d = new Float32Array(n);
    var hits = [0, 0.011, 0.023], y = 0;
    for (var i = 0; i < n; i++){
      var t = i / sr, a = 0;
      for (var h = 0; h < hits.length; h++) if (t >= hits[h]) a += Math.exp(-(t - hits[h]) / 0.012);
      a += Math.exp(-t / 0.10) * 0.55;
      y += 0.55 * ((Math.random()*2-1) - y);
      d[i] = y * a;
    }
    return norm(d, 0.9);
  }

    for (var i = 0; i < n; i++){

      var hp = w - prev; prev = w;
      d[i] = hp * Math.exp(-t / (open ? 0.075 : 0.012));

    var dur = 1.1, n = Math.round(sr * dur), d = new Float32Array(n), prev = 0;

    g.gain.linearRampToValueAtTime(gain, t + 0.006);
    g.gain.setValueAtTime(gain, t + dur * 0.6);
    g.gain.linearRampToValueAtTime(0, t + dur);
    var f = actx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = cut; f.Q.value = 1.0;

      o.type = 'sawtooth';

      o.detune.value = ds[i];
      o.connect(g);
      try { o.start(t); o.stop(t + dur + 0.02); } catch(e){}
    }

    var ln = T.lead[bar][k];

  // 位相を揃えると各周期に山がひとつ立つ＝一発の爆発になる。

  function pulseWave(n, roll){
    var re = new Float32Array(n + 1), im = new Float32Array(n + 1);
    for (var i = 1; i <= n; i++){
      re[i] = Math.pow(i, roll) * (0.90 + Math.random() * 0.20);
      im[i] = 0;
    }
    try { return actx.createPeriodicWave(re, im); } catch(e){ return null; }
  }

  function makeLive(){

    var sqHp = actx.createBiquadFilter();
    sqHp.type = 'highpass'; sqHp.frequency.value = 2500; sqHp.Q.value = 0.7;
    sqIn.connect(sqHp);

    var Qs = [30, 18, 6], gs = [0.77, 0.27, 0.19];

      bp.type = 'bandpass';
      bp.frequency.value = 900;
      bp.Q.value = Qs[i];
      var g = actx.createGain(); g.gain.value = gs[i];

    function jitter(param, amount, rate, offset){

      jitter(sqBp[0].frequency, 150, 1.00, 0.00),
      jitter(sqBp[1].frequency, 190, 1.37, 0.71),
      jitter(sqBp[2].frequency, 120, 0.83, 1.33),

    noiseSrc.connect(thIn);
    thBp = actx.createBiquadFilter();
    thBp.type = 'bandpass'; thBp.frequency.value = 105; thBp.Q.value = 2.2;

    // --- ゴムのびびり（倍音を持つ帯。これが「ゴムが鳴っている」感じを作る） ---
    buzzO = actx.createOscillator(); buzzO.type = 'sawtooth'; buzzO.frequency.value = 900;

    buzzBp.type = 'bandpass'; buzzBp.frequency.value = 2400; buzzBp.Q.value = 1.3;

    buzzO.connect(buzzBp); buzzBp.connect(buzzG); buzzG.connect(buzzTrem); buzzTrem.connect(seG);

    noiseSrc.connect(roarIn);
    roarBp = actx.createBiquadFilter();
    roarBp.type = 'bandpass'; roarBp.frequency.value = 330; roarBp.Q.value = 1.1;

    try { noiseSrc.start(); } catch(e){}

    // 固定のフィルターで上を切ると気の抜けた音になる。回転に合わせて開かせる。

      // 0.5倍（1回転に1度の成分）を入れると不等間隔になってV8のドロドロになる。
      { wave:wMain, type:'sawtooth', mul:1.0, det:  -3, g:1.00 },
      { wave:wMain, type:'sawtooth', mul:1.0, det:   3, g:1.00 },
      { wave:wUp,   type:'sawtooth', mul:2.0, det:   0, g:0.42 },
      { wave:null,  type:'square',   mul:2.0, det:   4, g:0.28 },
      { wave:null,  type:'sawtooth', mul:3.0, det:  -4, g:0.14 }

      if (PARTS[j].wave) { try { o.setPeriodicWave(PARTS[j].wave); } catch(e){ o.type = PARTS[j].type; } }
      else o.type = PARTS[j].type;
      o.frequency.value = 70 * PARTS[j].mul;
      o.detune.value = PARTS[j].det;
      var pg = actx.createGain(); pg.gain.value = PARTS[j].g;
      o.connect(pg); pg.connect(engG);
      try { o.start(); } catch(e){}

    // 爆発に合わせて脈打たせる。完全に同じ波が繰り返されると電子音に聞こえる。
    engNz = actx.createGain(); engNz.gain.value = 0;
    noiseSrc.connect(engNz);
    engNzMod = actx.createGain(); engNzMod.gain.value = 0.48;

      lim.attack.value = 0.003; lim.release.value = 0.12;
    } catch(e){ lim = null; }
    if (lim){ master.connect(lim); lim.connect(actx.destination); }
    else master.connect(actx.destination);
    musicG = actx.createGain(); musicG.gain.value = 0.42; musicG.connect(master);
    seG = actx.createGain(); seG.gain.value = 0.5; seG.connect(master);

    var sr = actx.sampleRate;
    B.kick  = buf(kickData(sr));
    B.clap  = buf(clapData(sr));
    B.hat   = buf(hatData(sr, false));
    B.hatO  = buf(hatData(sr, true));
    B.crash = buf(crashData(sr));
    B.noise = buf(noiseData(sr));
    B.jit   = buf(jitData(sr));
    B.hit   = buf(hitData(sr));
    makeLive();
    ready = true;
  }

  var lastCount = 99;

  window.WADACHI_AUDIO = {
    init: function(){
      init();
      if (actx && actx.state === 'suspended'){ try { actx.resume(); } catch(e){} }
    },
    // コース番号で曲を選ぶ
    setTrack: function(i){
      T = TRACKS[Math.max(0, Math.min(TRACKS.length - 1, i | 0))];
      SPB = 60 / T.bpm; STP = SPB / 4;
    },
    trackInfo: function(){ return { bpm: T.bpm, base: T.base }; },
    start: function(course){
      this.init();
      if (typeof course === 'number') this.setTrack(course);
      if (!ready) return;
      playing = true;
      nextStep = 0;
      nextTime = actx.currentTime + 0.08;
      lastCount = 99;
      musicG.gain.setTargetAtTime(0.42, actx.currentTime, 0.05);
    },
    stop: function(){
      if (!ready) return;
      playing = false;
      musicG.gain.setTargetAtTime(0, actx.currentTime, 0.08);
      sqIn.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      scrIn.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      thIn.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      buzzG.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      roarIn.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      engG.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      engNz.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      engLoad = 0; engPrevSp = 0;
    },
    pause: function(on){
      if (!ready) return;
      musicG.gain.setTargetAtTime(on ? 0 : 0.42, actx.currentTime, 0.06);
      if (on){
        sqIn.gain.setTargetAtTime(0, actx.currentTime, 0.04);
        scrIn.gain.setTargetAtTime(0, actx.currentTime, 0.04);
        thIn.gain.setTargetAtTime(0, actx.currentTime, 0.04);
        buzzG.gain.setTargetAtTime(0, actx.currentTime, 0.04);
        roarIn.gain.setTargetAtTime(0, actx.currentTime, 0.04);
        engG.gain.setTargetAtTime(0, actx.currentTime, 0.04);
        engNz.gain.setTargetAtTime(0, actx.currentTime, 0.04);
      }
    },
    count: function(n){
      if (!ready || n === lastCount) return;
      lastCount = n;
      if (n > 0) beep(880, 0.10, 0.5);
      else beep(1320, 0.30, 0.55);
    },
    hitWall: function(){ if (ready) one(B.hit, 0.6, 0.9 + Math.random()*0.25, seG); },
    goal: function(isNew){
      if (!ready) return;
      if (isNew) arp([440, 554.37, 659.25, 880, 1108.73], 0.075, 0.32, 0.14);
      else arp([440, 523.25, 659.25], 0.085, 0.30, 0.13);
    },
    fail: function(){ if (ready) arp([330, 277.18, 220], 0.10, 0.34, 0.13); },

    // 毎こま。走っている状態を渡す
    tick: function(st, sliding, slip, sp){
      if (!ready) return;
      pump();
      var t = actx.currentTime;
      var run = (st === 'play');
      var fast = Math.min(1, sp / 260);

      // 鳴き：滑り具合で開き、滑るほど・速いほど高くなる
      var want = 0;
      if (run && sliding) want = Math.min(0.85, 0.22 + slip * 1.5) * Math.min(1, sp / 150);
      sqIn.gain.setTargetAtTime(want, t, 0.030);
      // こすれ：滑った量そのもの。速いほど強い
      scrIn.gain.setTargetAtTime(run && sliding ? Math.min(0.62, 0.20 + slip * 1.15) * Math.min(1, sp / 110) : 0, t, 0.04);
      scrBp.frequency.setTargetAtTime(165 + Math.min(1, slip * 2.2) * 150 + fast * 105, t, 0.06);
      // びびり：ゴムが食いついては離れる振動。倍音があるので「ゴム」に聞こえる
      var bf = 500 + Math.min(1.0, slip * 2.2) * 330 + fast * 180;
      buzzO.frequency.setTargetAtTime(bf, t, 0.05);
      buzzBp.frequency.setTargetAtTime(bf * 2.6, t, 0.05);
      buzzG.gain.setTargetAtTime(run && sliding ? Math.min(0.24, 0.08 + slip * 0.49) * Math.min(1, sp / 130) : 0, t, 0.035);
      thIn.gain.setTargetAtTime(run && sliding ? Math.min(0.85, 0.30 + slip * 1.5) * Math.min(1, sp / 100) : 0, t, 0.05);
      thBp.frequency.setTargetAtTime(78 + fast * 62, t, 0.08);
      var f0 = 4600 + Math.min(1.0, slip * 2.2) * 1600 + fast * 900;
      sqBp[0].frequency.setTargetAtTime(f0, t, 0.05);
      sqBp[1].frequency.setTargetAtTime(f0 * 1.49, t, 0.05);
      sqBp[2].frequency.setTargetAtTime(f0 * 1.90, t, 0.05);

      // 路面のうなり：速度だけで決まる
      roarIn.gain.setTargetAtTime(run ? 0.07 * fast : 0, t, 0.09);
      roarBp.frequency.setTargetAtTime(270 + fast * 190, t, 0.09);

      // エンジン：速度にまっすぐ比例させると間延びするので、変速を模して回転を上下させる
      var gi = 0;
      while (gi < GEARS.length - 1 && fast >= GEARS[gi + 1]) gi++;
      var glo = GEARS[gi], ghi = (gi + 1 < GEARS.length) ? GEARS[gi + 1] : 1.0;
      var rev = 0.16 + 0.84 * Math.min(1, Math.max(0, (fast - glo) / Math.max(0.01, ghi - glo)));
      // 踏み込み具合は速度の増え方から見る。滑っている間は踏んでいるものとして扱う
      var dsp = (sp - engPrevSp) * 60;
      engPrevSp = sp;
      var load = Math.max(0, Math.min(1, dsp / 90));
      if (sliding) load = Math.max(load, 0.55);
      engLoad += (load - engLoad) * 0.15;

      // 爆発の間隔。下を 26Hz まで落とすと一発ずつが粒として聞こえる（ドロドロ）
      var ef = 30 + rev * 245;
      for (var i = 0; i < engO.length; i++)
        engO[i].frequency.setTargetAtTime(ef * engMul[i], t, 0.05);
      engF.frequency.setTargetAtTime(380 + rev * 2400 + engLoad * 900, t, 0.07);
      engG.gain.setTargetAtTime(run ? (0.091 + engLoad * 0.081 + rev * 0.048) : 0, t, 0.08);
      engPulse.frequency.setTargetAtTime(ef, t, 0.05);
      engNz.gain.setTargetAtTime(run ? (0.26 + engLoad * 0.42) : 0, t, 0.08);
      engNzF.frequency.setTargetAtTime(820 + rev * 1900, t, 0.07);

    },
    setVol: function(v){
      vol = Math.max(0, Math.min(1, v));
      if (master) master.gain.value = vol * 0.55;
      try { localStorage.setItem('wadachi.vol', String(Math.round(vol * 100))); } catch(e){}
    },
    getVol: function(){
      try {
        var s = localStorage.getItem('wadachi.vol');
        if (s !== null) vol = Math.max(0, Math.min(1, parseInt(s, 10) / 100));
      } catch(e){}
      return vol;
    }
  };
})();
</script>

<script>
// ===== 順位表（みんなで共有）=====
// 送るのは「ゲーム名・入力した名前・点数」だけ。ほかは送らない。
(function(){
  var API = 'https://game-scores.pdylplplp.workers.dev';
  var box = document.getElementById('lbBox');
  if (!box) return;
  var KEY = 'score.name';

  var unit = '';
  var myName = '';
  try { myName = localStorage.getItem(KEY) || ''; } catch(e){}

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  function fmt(v){ return (Math.round(v * 100) / 100).toLocaleString('ja-JP'); }

  function listHTML(list, top){
    if (!list || !list.length) return '<div class="lb-msg">まだ誰も出していません</div>';
    var out = '<ol>';
    for (var i = 0; i < Math.min(list.length, top || 5); i++){
      var e = list[i];
      out += '<li' + (myName && e.n === myName ? ' class="me"' : '') + '>'
           + '<span class="p">' + (i+1) + '</span>'
           + '<span class="n">' + esc(e.n) + '</span>'
           + '<span class="s">' + fmt(e.s) + unit + '</span></li>';
    }
    return out + '</ol>';
  }

  // 題字の画面：上位だけ見せる
  function showTop(game){
    box.classList.remove('hide');
    box.innerHTML = '<div class="lb-t">ミンナノ ジュンイ</div><div class="lb-msg">読み込み中…</div>';
    fetch(API + '/board?game=' + encodeURIComponent(game), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.error) throw new Error(d.error);
        unit = d.unit || '';
        box.innerHTML = '<div class="lb-t">ミンナノ ジュンイ</div>' + listHTML(d.list, 5);
      })
      .catch(function(){
        box.innerHTML = '<div class="lb-t">ミンナノ ジュンイ</div>'
                      + '<div class="lb-msg">いまは見られません</div>';
      });
  }

  // 遊び終わり：名前を入れて送る
  function showSubmit(game, score){
    box.classList.remove('hide');
    box.innerHTML =
      '<div class="lb-t">ジュンイヒョウ ニ オクル</div>'
      + '<div class="lb-form">'
      +   '<input id="lbName" type="text" maxlength="12" placeholder="ニックネーム" '
      +     'value="' + esc(myName) + '" autocomplete="off">'
      +   '<button id="lbSend" type="button">送る</button>'
      + '</div>'
      + '<div class="lb-warn">本名は入れないでください。12文字まで。</div>'
      + '<div class="lb-msg" id="lbMsg"></div>';

    var inp = document.getElementById('lbName');
    var btn = document.getElementById('lbSend');
    var msg = document.getElementById('lbMsg');

    btn.addEventListener('click', function(){
      var nm = (inp.value || '').trim();
      if (!nm){ msg.textContent = '名前を入れてください'; msg.className = 'lb-msg ng'; inp.focus(); return; }
      // 送る前に覚える。通信が失敗しても名前が消えないように
      myName = nm;
      try { localStorage.setItem(KEY, myName); } catch(e){}
      btn.disabled = true;
      msg.className = 'lb-msg';
      msg.textContent = '送っています…';
      fetch(API + '/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify({ game: game, name: nm, score: score })
      }).then(function(r){ return r.json(); }).then(function(d){
        if (d.error){
          msg.textContent = d.error; msg.className = 'lb-msg ng';
          btn.disabled = false; return;
        }
        myName = d.name;
        try { localStorage.setItem(KEY, myName); } catch(e){}
        box.innerHTML = '<div class="lb-t">'
          + (d.inTop ? d.rank + 'イ' : d.rank + 'イ（20イ マデ ノラナイ）') + '</div>'
          + listHTML(d.list, 5);
      }).catch(function(){
        msg.textContent = '送れませんでした。あとでもう一度。';
        msg.className = 'lb-msg ng';
        btn.disabled = false;
      });
    });

    inp.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && !e.isComposing) btn.click();
    });
  }

  window.SCOREBOARD = {
    top: showTop,
    over: showSubmit,
    hide: function(){ box.classList.add('hide'); }
  };
})();
</script>

  var courseIdx = 0;
  var TRACK = [], TRACKLEN = 0, STEP = 7;

  function buildTrack(){
    var CO = COURSES[courseIdx], COURSE = CO.segs;
    TRACK.length = 0;
    var x = 0, y = 0, a = 0, d = 0;      // a: 進行方向（0=上, 正=右回り）
    var HL = HILL[CO.rev ? CO.base : courseIdx];
    function push(){
      var p1 = d / HL.l1, p2 = d / HL.l2 + 2.1;
      TRACK.push({
        x:x, y:y, a:a, d:d, nx:Math.cos(a), ny:Math.sin(a),
        h: -HL.base*d + HL.a1*Math.sin(p1) + HL.a2*Math.sin(p2),
        g: HL.base - (HL.a1/HL.l1)*Math.cos(p1) - (HL.a2/HL.l2)*Math.cos(p2),
        dg: (HL.a1/(HL.l1*HL.l1))*Math.sin(p1) + (HL.a2/(HL.l2*HL.l2))*Math.sin(p2)
      });
    }
    push();
    for (var i=0;i<COURSE.length;i++){
      var sg = COURSE[i];
      if (sg[0] === 'S') {
        var n = Math.max(1, Math.round(sg[1]/STEP));
        for (var j=0;j<n;j++){
          x += Math.sin(a)*STEP; y += -Math.cos(a)*STEP; d += STEP; push();
        }
      } else {
        var rad = sg[1], deg = sg[2] * Math.PI/180;
        var len = rad * deg;
        var n2 = Math.max(2, Math.round(len/STEP));
        var dA = (sg[0]==='R' ? deg : -deg) / n2;
        for (var k=0;k<n2;k++){
          a += dA;
          x += Math.sin(a)*STEP; y += -Math.cos(a)*STEP; d += STEP; push();
        }
      }
    }
    TRACKLEN = d;
    if (CO.rev) {
      // 上り：点の並びを逆にし、向きを反対に。高さはそのままなので、勾配の符号が入れ替わる
      var R = [];
      for (var ri = TRACK.length - 1; ri >= 0; ri--){
        var p = TRACK[ri], ra = p.a + Math.PI;
        R.push({ x:p.x, y:p.y, a:ra, d:TRACKLEN - p.d, nx:Math.cos(ra), ny:Math.sin(ra), h:p.h, g:-p.g, dg:p.dg });
      }
      TRACK.length = 0;
      for (ri = 0; ri < R.length; ri++) TRACK.push(R[ri]);
    }
    buildProfile();
    buildCheckpoints();
    buildRoom();
  }

  // 各点の左右に、ほかの部分の道（ヘアピンの折り返し先など）の中心がどれだけ離れているか。
  // 近い所では、相手の車の走れる幅と、立体の地面の幅をこれで決める。コースを組むときに一度だけ
  function buildRoom(){
    var n = TRACK.length, i, j;
    for (i = 0; i < n; i++){
      var a = TRACK[i], mL = 1e12, mR = 1e12;
      for (j = 0; j < n; j++){
        if (Math.abs(i - j) < 40) continue;
        var dx = TRACK[j].x - a.x, dy = TRACK[j].y - a.y, dd = dx*dx + dy*dy;
        if (dd > 160000) continue;                 // 400 より遠い所は関係ない
        if (dx*a.nx + dy*a.ny > 0) { if (dd < mR) mR = dd; } else { if (dd < mL) mL = dd; }
      }
      a.roomL = Math.min(400, Math.sqrt(mL)); a.roomR = Math.min(400, Math.sqrt(mR));
    }
    // 横へどこまで出ても、隣の道（中心から HALF+16 の内側）に入らないか。
    // 隣の道は真横とは限らない（斜め）ので、横へ少しずつずらして実際に確かめる
    var lim = HALF + 16, lim2 = lim * lim;
    for (i = 0; i < n; i++){
      var b = TRACK[i], near = [];
      for (j = 0; j < n; j++){
        if (Math.abs(i - j) < 40) continue;
        var ex = TRACK[j].x - b.x, ey = TRACK[j].y - b.y;
        if (ex*ex + ey*ey < 180*180) near.push(TRACK[j]);
      }
      for (var sd = -1; sd <= 1; sd += 2){
        var clr = HALF + WALL;
        for (var o = 0; o <= HALF + WALL; o += 2){
          var qx = b.x + b.nx*o*sd, qy = b.y + b.ny*o*sd, hit = false;
          for (var m = 0; m < near.length; m++){
            var fx2 = near[m].x - qx, fy2 = near[m].y - qy;
            if (fx2*fx2 + fy2*fy2 < lim2) { hit = true; break; }
          }
          if (hit) { clr = Math.max(0, o - 2); break; }
        }
        if (sd < 0) b.clrL = clr; else b.clrR = clr;
      }
    }
  }

  // コース全体の高さの形。毎コマ作ると重いので、コースを組むときに一度だけ。
  var PROFILE = [];
  function buildProfile(){
    PROFILE = [];        // 宣言より先に呼ばれるので、入れ直す
    var N = 64, lo = 1e9, hi = -1e9, i, t;
    for (i = 0; i < N; i++){
      t = TRACK[Math.min(TRACK.length-1, Math.round(i/(N-1)*(TRACK.length-1)))].h;
      PROFILE.push(t);
      if (t < lo) lo = t;
      if (t > hi) hi = t;
    }
    var sp2 = Math.max(1, hi - lo);
    for (i = 0; i < N; i++) PROFILE[i] = (PROFILE[i] - lo) / sp2;   // 0〜1 に直す
  }

  // 車に一番近いコース上の点を、前回の位置の近くから探す
  // 現在地は「前のコマの位置のすぐ近く」からしか探さない。
  // 広く探すと、ヘアピンで折り返した先の道へ飛び移れてしまう（＝ショートカット）
  function nearest(px, py, from){
    var lo = Math.max(0, from-12), hi = Math.min(TRACK.length-1, from+4);
    var bi = from, bd = 1e9, i, dx, dy, dd;
    for (i=lo;i<=hi;i++){
      dx = TRACK[i].x - px; dy = TRACK[i].y - py; dd = dx*dx + dy*dy;
      if (dd < bd) { bd = dd; bi = i; }
    }
    return bi;
  }

  // 番号だけで見ると、ヘアピンの内側を突っ切っても「通った」ことになってしまう。
  // 関門の線を、道幅の中で、手前から先へ越えたときだけ通過と数える。
  var GATES = [], nextGate = 0, gatePrevS = null;
  function buildCheckpoints(){
    GATES = [];
    for (var c = 20; c < TRACK.length - 12; c += 22) GATES.push(TRACK[c]);
  }
  function checkGate(){
    if (nextGate >= GATES.length) return;
    var g = GATES[nextGate];
    var dx = car.x - g.x, dy = car.y - g.y;
    var sAlong = dx * Math.sin(g.a) + dy * (-Math.cos(g.a));   // 関門の手前か先か
    var tSide  = dx * g.nx + dy * g.ny;                        // 関門の左右のずれ
    if (gatePrevS !== null && gatePrevS < 0 && sAlong >= 0 && Math.abs(tSide) <= HALF + WALL + 6) {
      nextGate++; gatePrevS = null;                            // くぐった
    } else {
      gatePrevS = sAlong;
    }
  }

    if (!(w > 40)) { w = 280; h = w * H / W; }
    w = Math.round(w); h = Math.round(h);
    // 運転席の視点は塗る量が多いので、細かさを少し落として軽くする（2倍 → 1.5倍まで）
    var want = Math.min(window.devicePixelRatio || 1, is3D() ? 1.5 : 2);
    if (w === lastW && h === lastH && want === dpr) return;
    lastW = w; lastH = h;
    dpr = want;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    cv.width  = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    scale = w / W;
